name: release

# 发版的唯一入口。链路固定为：
#
#   release-please  → 维护那个长期存在的发布 PR；**它被合并时**才切 tag 并建 draft Release
#   verify-ci       → 查（不重跑）tag 所在提交在 ci.yml 上的结论，与构建并行
#   build-binaries  → 以切出的 tag 为准编译平台二进制
#   upload-assets   → 渲染 git-cliff 说明、把产物挂到 **draft** 上
#   publish-release → 前面全绿才把 draft 翻成正式发布
#
# 两条硬规则：
#
# 1. **只有发布 PR 被合并才发版。** 普通功能 PR 合进 main 只会刷新那个发布 PR；
#    重活全部挂在 `needs.release-please.outputs.build_artifacts == 'true'` 上，
#    该值来自 release-please 的 `release_created`。
# 2. **Release 在全部构建成功前保持 draft。** 任一步失败就停在 draft：现象是「多了一个
#    草稿」而不是「发出去一个没有产物的版本」，可观测且可修复。
#
# 发布矩阵覆盖 Linux x64/arm64、macOS x64/arm64、Windows x64/arm64。六个目标都发布
# `voice,mcp` CLI；Tauri 当前封闭的 updater 目标只有 Linux x64、macOS arm64、
# Windows x64，因此只在这三个目标发布安装包，绝不拿无法编译的壳冒充五平台安装包。
# 两个 Linux CLI 按安装脚本的兼容性契约发布 musl，并用 cargo-zigbuild 构建；Linux
# 桌面安装包仍以原生 GNU target 构建，因为 WebKitGTK/GTK 是宿主系统动态依赖。
#
# CodeBuild 预备（尚未启用）：`yunjian-github` 连接为 PENDING，授权并重建 webhook 前
# 全部 job 保持 GitHub-hosted。届时纯 Linux x86_64 控制作业分别用唯一标签
# `release-please`、`release-verify-ci`、`release-upload-assets`、`release-publish`；
# `build-binaries` 同时含 Linux ARM、macOS 与 Windows，不能整体切到当前 x86_64 项目，
# 必须先按宿主平台拆 job。每个 CodeBuild job 都使用第一标签
# `codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}` 加上述唯一标签。

on:
  push:
    branches: [main]
  # 补挂产物用：tag 已经发出去了，但当时某个构建失败、产物没传上去。
  # 这条路径不重新切 tag，只重建并补挂到既有 tag 上。
  workflow_dispatch:
    inputs:
      tag_name:
        description: "已存在的 tag（例如 v0.1.0）"
        required: true
        type: string
      version:
        description: "产物文件名里的版本号（例如 0.1.0）"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # verify-ci 要读 ci.yml 的运行记录与作业结论。
  actions: read

# 刻意 `cancel-in-progress: false`：发版跑到一半被后一次 push 取消，会留下一个
# 切了 tag、建了 draft 却没有产物的中间状态。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY_NAME: yunjian
  CLI_CRATE: yunjian-cli
  DESKTOP_BINARY_NAME: yunjian-desktop
  GIT_CLIFF_VERSION: 2.13.1
  TAURI_CLI_VERSION: 2.11.4

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      build_artifacts: ${{ steps.gate.outputs.build_artifacts }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: 运行 release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 把两种触发方式收敛成同一组输出，后面的作业只看 build_artifacts，
      # 不必各自去分辨自己是被谁触发的。
      - name: 汇总构建门控
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            {
              echo "build_artifacts=true"
              echo "tag_name=${INPUT_TAG}"
              echo "version=${INPUT_VERSION}"
            } >> "$GITHUB_OUTPUT"
            echo "手动补挂：tag=${INPUT_TAG} version=${INPUT_VERSION}"
          else
            {
              echo "build_artifacts=${RELEASE_CREATED:-false}"
              echo "tag_name=${RELEASE_TAG:-}"
              echo "version=${RELEASE_VERSION:-}"
            } >> "$GITHUB_OUTPUT"
            if [ "${RELEASE_CREATED:-false}" = "true" ]; then
              echo "发布 PR 已合并，切出 ${RELEASE_TAG}，进入构建。"
            else
              echo "本次只刷新发布 PR，不发版。"
            fi
          fi

  # 发布门禁：正式发布必须建立在「tag 那个提交的 CI 是绿的」之上。
  #
  # 只查询、不重跑（重跑等于把 ci.yml 抄第二遍，两套标准迟早漂移）。与 build-binaries
  # 并行，门禁在 upload-assets 处生效——CI 红则产物永远挂不上去，Release 留在 draft。
  #
  # 必须**始终执行**而不能被跳过：upload-assets 把它写进了 needs，被跳过的 needs
  # 会连带把 upload-assets 一起跳过。因此这里用与其他作业相同的 build_artifacts 门控，
  # 并给 workflow_dispatch 留一个空操作成功分支（补挂既有 tag 时没有新的 CI 可查）。
  verify-ci:
    name: Verify CI Passed
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 手动补挂：跳过 CI 门禁（空操作）
        if: github.event_name == 'workflow_dispatch'
        run: echo "补挂既有 tag，没有新的 CI 运行可查，直接放行。"

      - name: 检出 tag
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: 解析 tag 指向的提交
        id: sha
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-list -n1 "${TAG_NAME}")" >> "$GITHUB_OUTPUT"

      # 查的是 main 分支上那次 push 的运行，而不是 tag 自己的：release-please 用
      # GITHUB_TOKEN 创建 tag，而 GITHUB_TOKEN 触发的事件不会再启动工作流，
      # 所以 refs/tags/vX.Y.Z 根本不存在对应的 CI 运行，等它等于永久挂起。
      #
      # 定位运行用 `actions/runs?head_sha=` 再按 `.path` 过滤，不用
      # `actions/workflows/ci.yml/runs?head_sha=`——实测后者带 head_sha 过滤时返回空列表。
      # 按 `.path` 而不是按 `.name` 认工作流：`name:` 字段随时可以改，文件路径不会。
      - name: 等待 tag 提交上的 CI Success
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          max_iters=100
          sleep_secs=15
          run_id=""
          for i in $(seq 1 "${max_iters}"); do
            run_id=$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=push&branch=main&per_page=100" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")]
                    | sort_by(.created_at) | last | .id // empty')
            if [ -n "${run_id}" ]; then
              echo "找到 ${HEAD_SHA} 的 CI 运行：${run_id}"
              break
            fi
            echo "${HEAD_SHA} 还没有 CI 运行（${i}/${max_iters}），等待 ${sleep_secs}s……"
            sleep "${sleep_secs}"
          done
          if [ -z "${run_id}" ]; then
            echo "::error::等不到 CI 运行，拒绝发布（Release 保持 draft）"
            exit 1
          fi
          for i in $(seq 1 "${max_iters}"); do
            jobs_json=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100")
            status=$(echo "${jobs_json}" | jq -r '.jobs[] | select(.name == "CI Success") | .status')
            conclusion=$(echo "${jobs_json}" | jq -r '.jobs[] | select(.name == "CI Success") | .conclusion // ""')
            if [ "${status}" != "completed" ]; then
              echo "CI Success 尚未结束（status='${status}'，${i}/${max_iters}），等待 ${sleep_secs}s……"
              sleep "${sleep_secs}"
              continue
            fi
            if [ "${conclusion}" = "success" ]; then
              echo "${HEAD_SHA} 的 CI Success 已通过。"
              exit 0
            fi
            # cancelled 也在这里落地。main 上紧接着的下一次合并会因
            # cancel-in-progress 取消掉本提交的 CI 运行，此时需要人工重跑那次 CI
            # 再重跑本作业；Release 在此期间安全地停在 draft。
            echo "::error::CI Success 结论为 '${conclusion}'，拒绝发布（Release 保持 draft）"
            exit 1
          done
          echo "::error::等不到 CI Success 结束，拒绝发布（Release 保持 draft）"
          exit 1

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            use_zigbuild: true
            archive: tar.gz
            desktop: linux
            desktop_target: x86_64-unknown-linux-gnu
            desktop_arch: x86_64
            expected_arch: x86-64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            use_zigbuild: true
            archive: tar.gz
            desktop: none
            desktop_target: x86_64-unknown-linux-gnu
            desktop_arch: aarch64
            expected_arch: aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_zigbuild: false
            archive: tar.gz
            desktop: none
            desktop_target: x86_64-apple-darwin
            desktop_arch: x86_64
            expected_arch: x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            use_zigbuild: false
            archive: tar.gz
            desktop: macos
            desktop_target: aarch64-apple-darwin
            desktop_arch: aarch64
            expected_arch: arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_zigbuild: false
            archive: zip
            desktop: windows
            desktop_target: x86_64-pc-windows-msvc
            desktop_arch: x86_64
            expected_arch: x86-64
            expected_pe_machine: 34404
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_zigbuild: false
            archive: zip
            desktop: none
            desktop_target: aarch64-pc-windows-msvc
            desktop_arch: aarch64
            expected_arch: ARM64
            expected_pe_machine: 43620
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          # sherpa-rs-sys 的 build script 会复制原生库。缓存 target 会保留脚本指纹却
          # 丢掉复制结果，第二次运行才在链接时报缺库；原生下载另用 actions/cache。
          cache-targets: false

      - name: 缓存 sherpa-onnx 原生产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs
            ~/AppData/Local/sherpa-rs
          key: sherpa-native-${{ matrix.target }}-v1.12.9

      - name: 安装 Linux 原生依赖
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libasound2-dev musl-tools
          if [ "${{ matrix.desktop }}" = "linux" ]; then
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libxdo-dev libssl-dev dpkg-dev patchelf
          fi
          SO=$(find /usr/lib/llvm-* -name 'libclang.so*' -print -quit 2>/dev/null || true)
          if [ -z "$SO" ]; then
            echo "::error::装了 libclang-dev 却找不到 libclang.so"
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$SO")" >> "$GITHUB_ENV"

      - name: 配置 Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (-not (Test-Path (Join-Path $candidate 'libclang.dll'))) {
            throw "找不到 Windows runner 预装的 libclang.dll：$candidate"
          }
          "LIBCLANG_PATH=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 安装 Zig
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: 安装 cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: 安装 Tauri CLI
        if: matrix.desktop != 'none'
        shell: bash
        run: cargo install tauri-cli --version "=${TAURI_CLI_VERSION}" --locked

      - name: 编译 CLI（Linux musl）
        if: matrix.use_zigbuild
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked -p "${CLI_CRATE}" \
            --target "${TARGET}" --features voice,mcp

      - name: 编译 CLI（原生）
        if: ${{ !matrix.use_zigbuild }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p "${CLI_CRATE}" \
            --target "${TARGET}" --features voice,mcp

      - name: 断言 CLI 同时带 voice 与 mcp
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/${BINARY_NAME}"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="${bin}.exe"; fi
          test -f "$bin"
          "$bin" --version
          "$bin" mcp --help >/dev/null
          log="${RUNNER_TEMP}/yunjian-feature.log"
          "$bin" --log-level debug --json models list >/dev/null 2>"$log"
          if ! grep -Fq 'sherpa-onnx ' "$log"; then
            cat "$log" >&2
            echo "::error::voice 后端版本探针未出现；拒绝发布缺少 voice 的 CLI"
            exit 1
          fi

      - name: 暂存 CLI 与语音运行库
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release="target/${TARGET}/release"
          stage="${RUNNER_TEMP}/yunjian-cli-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          exe="${BINARY_NAME}"
          if [ "${{ runner.os }}" = "Windows" ]; then exe="${exe}.exe"; fi
          cp "$release/$exe" "$stage/$exe"

          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            if readelf -d "$stage/$exe" 2>/dev/null | grep -Fq '(NEEDED)'; then
              readelf -d "$stage/$exe"
              echo "::error::musl CLI 仍有动态依赖；拒绝发布伪静态产物"
              exit 1
            fi
          else
            case "${{ runner.os }}" in
              macOS) patterns=('libonnxruntime*.dylib' 'libsherpa-onnx-c-api*.dylib' 'libsherpa-onnx-cxx-api*.dylib') ;;
              Windows) patterns=('onnxruntime*.dll' 'sherpa-onnx-c-api*.dll' 'sherpa-onnx-cxx-api*.dll') ;;
            esac
            shopt -s nullglob
            for pattern in "${patterns[@]}"; do
              found=()
              while IFS= read -r native_file; do
                found+=("$native_file")
              done < <(find "$release" -maxdepth 1 -type f -name "$pattern" -print)
              if [ "${#found[@]}" -eq 0 ]; then
                echo "::error::缺少 voice 运行库：$pattern"
                find "$release" -maxdepth 1 -type f -print
                exit 1
              fi
              cp "${found[@]}" "$stage/"
            done
          fi
          ls -la "$stage"

      - name: 打包 CLI（tar.gz）
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="${BINARY_NAME}-${VERSION}-${TARGET}.tar.gz"
          tar -czf "dist/${archive}" -C "${RUNNER_TEMP}/yunjian-cli-stage" .
          tar -tzf "dist/${archive}" | tee "${RUNNER_TEMP}/cli-contents.txt"
          grep -Eq '(^|/)yunjian$' "${RUNNER_TEMP}/cli-contents.txt"
          if [ "${{ matrix.use_zigbuild }}" != "true" ]; then
            grep -Eiq 'onnxruntime|sherpa-onnx-c-api' "${RUNNER_TEMP}/cli-contents.txt"
          fi
          extracted="${RUNNER_TEMP}/cli-verify"
          mkdir -p "$extracted"
          tar -xzf "dist/${archive}" -C "$extracted"
          file "$extracted/${BINARY_NAME}" | tee "${RUNNER_TEMP}/cli-file.txt"
          grep -Fqi '${{ matrix.expected_arch }}' "${RUNNER_TEMP}/cli-file.txt"

      - name: 打包 CLI（zip）
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.version }}
          EXPECTED_PE_MACHINE: ${{ matrix.expected_pe_machine }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "${env:BINARY_NAME}-${env:VERSION}-${env:TARGET}.zip"
          Compress-Archive -Path "${env:RUNNER_TEMP}\yunjian-cli-stage\*" -DestinationPath "dist\$archive"
          $verify = Join-Path $env:RUNNER_TEMP 'cli-verify'
          Expand-Archive -Path "dist\$archive" -DestinationPath $verify
          $cli = Join-Path $verify 'yunjian.exe'
          if (-not (Test-Path $cli)) { throw 'CLI zip 缺少 yunjian.exe' }
          if (-not (Get-ChildItem $verify -Filter '*onnxruntime*.dll')) { throw 'CLI zip 缺少 onnxruntime DLL' }
          if (-not (Get-ChildItem $verify -Filter '*sherpa-onnx-c-api*.dll')) { throw 'CLI zip 缺少 sherpa C API DLL' }
          $bytes = [IO.File]::ReadAllBytes($cli)
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          if ($machine -ne [int]$env:EXPECTED_PE_MACHINE) {
            throw "CLI PE 架构错误：machine=$machine expected=$env:EXPECTED_PE_MACHINE"
          }

      - name: 构建桌面前端
        if: matrix.desktop != 'none'
        working-directory: app
        run: npm ci && npm run build

      - name: 构建 Tauri 安装包
        if: matrix.desktop != 'none'
        shell: bash
        working-directory: crates/yunjian-app
        env:
          TARGET: ${{ matrix.desktop_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY；updater 签名不可关闭，Release 保持 draft"
            exit 1
          fi
          case "${{ matrix.desktop }}" in
            linux) bundles='deb,appimage' ;;
            macos) bundles='dmg' ;;
            windows) bundles='nsis,msi' ;;
          esac
          cargo tauri build --ci --target "$TARGET" --bundles "$bundles"

      - name: 收集并验证 Linux 安装包
        if: matrix.desktop == 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.desktop_target }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="target/${TARGET}/release/bundle"
          debs=("$root/deb/"*.deb)
          images=("$root/appimage/"*.AppImage)
          [ "${#debs[@]}" -eq 1 ] && [ "${#images[@]}" -eq 1 ]
          [ -f "${debs[0]}.sig" ] && [ -f "${images[0]}.sig" ]

          deb_name="${DESKTOP_BINARY_NAME}-${VERSION}-linux-${{ matrix.desktop_arch }}.deb"
          image_name="${DESKTOP_BINARY_NAME}-${VERSION}-linux-${{ matrix.desktop_arch }}.AppImage"
          cp "${debs[0]}" "dist/$deb_name"
          cp "${debs[0]}.sig" "dist/${deb_name}.sig"
          cp "${images[0]}" "dist/$image_name"
          cp "${images[0]}.sig" "dist/${image_name}.sig"

          deb_root="${RUNNER_TEMP}/deb-root"
          dpkg-deb -x "dist/$deb_name" "$deb_root"
          deb_bin=$(find "$deb_root" -type f -name "$DESKTOP_BINARY_NAME" -print -quit)
          test -n "$deb_bin"
          file "$deb_bin" | tee "${RUNNER_TEMP}/deb-file.txt"
          grep -Fqi '${{ matrix.expected_arch }}' "${RUNNER_TEMP}/deb-file.txt"

          chmod +x "dist/$image_name"
          ( cd "${RUNNER_TEMP}" && "$GITHUB_WORKSPACE/dist/$image_name" --appimage-extract >/dev/null )
          image_bin=$(find "${RUNNER_TEMP}/squashfs-root" -type f -name "$DESKTOP_BINARY_NAME" -print -quit)
          test -n "$image_bin"
          file "$image_bin" | tee "${RUNNER_TEMP}/appimage-file.txt"
          grep -Fqi '${{ matrix.expected_arch }}' "${RUNNER_TEMP}/appimage-file.txt"

      - name: 收集并验证 macOS 安装包
        if: matrix.desktop == 'macos'
        shell: bash
        env:
          TARGET: ${{ matrix.desktop_target }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          root="target/${TARGET}/release/bundle"
          dmgs=("$root/dmg/"*.dmg)
          updates=("$root/macos/"*.app.tar.gz)
          [ "${#dmgs[@]}" -eq 1 ] && [ "${#updates[@]}" -eq 1 ]
          [ -f "${updates[0]}.sig" ]

          dmg_name="${DESKTOP_BINARY_NAME}-${VERSION}-macos-${{ matrix.desktop_arch }}.dmg"
          update_name="${DESKTOP_BINARY_NAME}-${VERSION}-macos-${{ matrix.desktop_arch }}.app.tar.gz"
          cp "${dmgs[0]}" "dist/$dmg_name"
          cp "${updates[0]}" "dist/$update_name"
          cp "${updates[0]}.sig" "dist/${update_name}.sig"

          mount="${RUNNER_TEMP}/yunjian-dmg"
          mkdir -p "$mount"
          hdiutil attach "dist/$dmg_name" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          app_bin=$(find "$mount" -type f -path '*/Contents/MacOS/yunjian-desktop' -print -quit)
          test -n "$app_bin"
          file "$app_bin" | tee "${RUNNER_TEMP}/dmg-file.txt"
          grep -Fqi '${{ matrix.expected_arch }}' "${RUNNER_TEMP}/dmg-file.txt"
          hdiutil detach "$mount"
          trap - EXIT
          tar -tzf "dist/$update_name" | grep -F 'Contents/MacOS/yunjian-desktop'

      - name: 收集并验证 Windows 安装包
        if: matrix.desktop == 'windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.desktop_target }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          $root = "target\$env:TARGET\release\bundle"
          $nsis = @(Get-ChildItem "$root\nsis\*.exe" -File)
          $msi = @(Get-ChildItem "$root\msi\*.msi" -File)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw "NSIS/MSI 产物数量错误：$($nsis.Count)/$($msi.Count)" }
          if (-not (Test-Path "$($nsis[0].FullName).sig") -or -not (Test-Path "$($msi[0].FullName).sig")) {
            throw 'Windows updater 签名缺失'
          }
          $setupName = "$env:DESKTOP_BINARY_NAME-$env:VERSION-windows-x86_64-setup.exe"
          $msiName = "$env:DESKTOP_BINARY_NAME-$env:VERSION-windows-x86_64.msi"
          Copy-Item $nsis[0].FullName "dist\$setupName"
          Copy-Item "$($nsis[0].FullName).sig" "dist\$setupName.sig"
          Copy-Item $msi[0].FullName "dist\$msiName"
          Copy-Item "$($msi[0].FullName).sig" "dist\$msiName.sig"

          $nsisRoot = Join-Path $env:RUNNER_TEMP 'nsis-root'
          & 7z x "dist\$setupName" "-o$nsisRoot" -y | Out-Null
          $nsisBin = Get-ChildItem $nsisRoot -Recurse -Filter 'yunjian-desktop.exe' | Select-Object -First 1
          if ($null -eq $nsisBin) { throw 'NSIS 安装包里没有 yunjian-desktop.exe' }

          $msiRoot = Join-Path $env:RUNNER_TEMP 'msi-root'
          New-Item -ItemType Directory -Force -Path $msiRoot | Out-Null
          $process = Start-Process msiexec.exe -ArgumentList @('/a', (Resolve-Path "dist\$msiName"), '/qn', "TARGETDIR=$msiRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative extract 失败：$($process.ExitCode)" }
          $msiBin = Get-ChildItem $msiRoot -Recurse -Filter 'yunjian-desktop.exe' | Select-Object -First 1
          if ($null -eq $msiBin) { throw 'MSI 安装包里没有 yunjian-desktop.exe' }

          foreach ($binary in @($nsisBin.FullName, $msiBin.FullName)) {
            $bytes = [IO.File]::ReadAllBytes($binary)
            $offset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
            if ($machine -ne 0x8664) { throw "安装包内二进制不是 x86_64 PE：$binary machine=$machine" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  upload-assets:
    name: Upload Release Assets
    # verify-ci 写在这里就是门禁本身：CI 红 → 本作业不跑 → publish-release 连带不跑
    # → Release 停在 draft。
    needs: [release-please, build-binaries, verify-ci]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: 断言矩阵产物集合完整且无意外文件
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            "yunjian-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
            "yunjian-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
            "yunjian-${VERSION}-x86_64-apple-darwin.tar.gz"
            "yunjian-${VERSION}-aarch64-apple-darwin.tar.gz"
            "yunjian-${VERSION}-x86_64-pc-windows-msvc.zip"
            "yunjian-${VERSION}-aarch64-pc-windows-msvc.zip"
            "yunjian-desktop-${VERSION}-linux-x86_64.deb"
            "yunjian-desktop-${VERSION}-linux-x86_64.deb.sig"
            "yunjian-desktop-${VERSION}-linux-x86_64.AppImage"
            "yunjian-desktop-${VERSION}-linux-x86_64.AppImage.sig"
            "yunjian-desktop-${VERSION}-macos-aarch64.dmg"
            "yunjian-desktop-${VERSION}-macos-aarch64.app.tar.gz"
            "yunjian-desktop-${VERSION}-macos-aarch64.app.tar.gz.sig"
            "yunjian-desktop-${VERSION}-windows-x86_64-setup.exe"
            "yunjian-desktop-${VERSION}-windows-x86_64-setup.exe.sig"
            "yunjian-desktop-${VERSION}-windows-x86_64.msi"
            "yunjian-desktop-${VERSION}-windows-x86_64.msi.sig"
          )
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "${RUNNER_TEMP}/expected-assets.txt"
          find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "${RUNNER_TEMP}/actual-assets.txt"
          if ! diff -u "${RUNNER_TEMP}/expected-assets.txt" "${RUNNER_TEMP}/actual-assets.txt"; then
            echo "::error::发布矩阵产物集合与封闭清单不一致"
            exit 1
          fi

      - name: 断言 updater 签名与内置公钥属于同一密钥
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          def keynum(encoded_box: str) -> bytes:
              lines = base64.b64decode(encoded_box.strip()).decode("utf-8").splitlines()
              if len(lines) < 2:
                  raise SystemExit("minisign box 缺少 payload 行")
              payload = base64.b64decode(lines[1])
              if len(payload) < 10:
                  raise SystemExit("minisign payload 过短")
              return payload[2:10]

          config = json.loads(Path("crates/yunjian-app/tauri.conf.json").read_text())
          expected = keynum(config["plugins"]["updater"]["pubkey"])
          signatures = sorted(Path("dist").glob("*.sig"))
          if len(signatures) != 5:
              raise SystemExit(f"预期 5 个 updater 签名，实际 {len(signatures)}")
          for signature in signatures:
              actual = keynum(signature.read_text())
              if actual != expected:
                  raise SystemExit(
                      f"{signature.name} 的 keynum {actual.hex().upper()} 与内置公钥 "
                      f"{expected.hex().upper()} 不一致"
                  )
              print(f"{signature.name}: keynum={actual.hex().upper()}")
          PY

      # 用 git-cliff 官方预编译产物，不引第三方 action：orhun/git-cliff-action
      # 星数远低于采用门槛，而工具本身有官方 release。与 ci.yml 里 cargo-audit
      # 的处理方式一致。解到 RUNNER_TEMP 而不是工作树，避免污染仓库。
      - name: 安装 git-cliff（官方预编译产物）
        run: |
          set -euo pipefail
          dir="git-cliff-${GIT_CLIFF_VERSION}"
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/${dir}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLf -o "${RUNNER_TEMP}/git-cliff.tar.gz" "${url}"
          tar xzf "${RUNNER_TEMP}/git-cliff.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${dir}" >> "$GITHUB_PATH"

      - name: 生成发布说明
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git-cliff --version
          git-cliff --config cliff.toml --latest --strip header --output RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 生成并校验 Tauri updater 清单
        env:
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/${TAG_NAME}"
          linux="yunjian-desktop-${VERSION}-linux-x86_64.AppImage"
          mac="yunjian-desktop-${VERSION}-macos-aarch64.app.tar.gz"
          windows="yunjian-desktop-${VERSION}-windows-x86_64-setup.exe"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$(cat RELEASE_NOTES.md)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg linux_url "${base}/${linux}" \
            --rawfile linux_sig "dist/${linux}.sig" \
            --arg mac_url "${base}/${mac}" \
            --rawfile mac_sig "dist/${mac}.sig" \
            --arg windows_url "${base}/${windows}" \
            --rawfile windows_sig "dist/${windows}.sig" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
              "linux-x86_64": {url: $linux_url, signature: $linux_sig},
              "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
              "windows-x86_64-nsis": {url: $windows_url, signature: $windows_sig}
            }}' > dist/latest.json
          jq -e \
            '.version != "" and
             (.platforms | keys | sort) == ["darwin-aarch64", "linux-x86_64", "windows-x86_64-nsis"] and
             all(.platforms[]; (.url | startswith("https://github.com/")) and (.signature | length > 20))' \
            dist/latest.json >/dev/null

      # 摘要从**最终要上传的同一个 dist/** 产生。每个非摘要资产都有同名 `.sha256`，
      # 包括安装器、updater 签名与 latest.json；未来增加格式却漏摘要会在这里硬失败。
      - name: 为每个发布资产生成并机械校验 SHA-256
        working-directory: dist
        run: |
          set -euo pipefail
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\n' | LC_ALL=C sort)
          if [ "${#assets[@]}" -ne 18 ]; then
            printf '实际非摘要资产（%s）：\n' "${#assets[@]}"
            printf '  %s\n' "${assets[@]}"
            echo "::error::预期 17 个矩阵资产 + latest.json，共 18 个"
            exit 1
          fi
          for asset in "${assets[@]}"; do
            sha256sum "$asset" > "${asset}.sha256"
          done
          for asset in "${assets[@]}"; do
            test -s "${asset}.sha256"
            sha256sum -c --strict "${asset}.sha256"
          done
          sidecars=$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l)
          [ "$sidecars" -eq "${#assets[@]}" ]

      # 挂产物 + 写正文，但**保持 draft**。翻牌交给 publish-release。
      - name: 把产物挂到 draft Release 上
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "${TAG_NAME}" --repo "${REPO}" --notes-file RELEASE_NOTES.md
          gh release upload "${TAG_NAME}" --repo "${REPO}" --clobber dist/*
          gh release view "${TAG_NAME}" --repo "${REPO}" --json isDraft,assets > "${RUNNER_TEMP}/release.json"
          jq '{isDraft, assets: [.assets[].name]}' "${RUNNER_TEMP}/release.json"
          jq -e '.isDraft == true' "${RUNNER_TEMP}/release.json" >/dev/null
          find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "${RUNNER_TEMP}/local-assets.txt"
          jq -r '.assets[].name' "${RUNNER_TEMP}/release.json" | LC_ALL=C sort > "${RUNNER_TEMP}/remote-assets.txt"
          diff -u "${RUNNER_TEMP}/local-assets.txt" "${RUNNER_TEMP}/remote-assets.txt"

  publish-release:
    name: Publish Release
    needs: [release-please, verify-ci, build-binaries, upload-assets]
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 全链路唯一一处把 draft 翻成正式发布。走到这里意味着 CI 绿、每个目标都编译成功、
      # 产物已经挂上。
      - name: 翻牌：draft → 正式发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release edit "${TAG_NAME}" --repo "${REPO}" --draft=false --latest
          # 翻牌之后必须**断言**翻成功了，而不是把状态打印出来给人看。原来这里是
          # 一条只打印的 `gh ... --jq`：它对 `false` 与 `null` 都返回 0，所以翻牌
          # 失败也照样绿。而且它请求了 `isLatest`——`gh release view --json` 并不
          # 支持这个字段（实测报 `Unknown JSON field`），于是这条命令在真正发第一版
          # 时只会以一个与发布无关的错误炸掉。
          #
          # `latest` 只有 REST 端点答得上来，所以分两处查：draft 状态与资产清单走
          # `gh release view`，`latest` 走 `releases/latest` 再比 tag。
          gh release view "${TAG_NAME}" --repo "${REPO}" --json isDraft,tagName,assets \
            > "${RUNNER_TEMP}/published.json"
          jq '{isDraft, tagName, assets: [.assets[].name]}' "${RUNNER_TEMP}/published.json"
          jq -e --arg tag "${TAG_NAME}" \
            '.isDraft == false and .tagName == $tag and (.assets | length > 0)' \
            "${RUNNER_TEMP}/published.json" > /dev/null
          test "$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name')" = "${TAG_NAME}"
