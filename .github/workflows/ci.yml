name: ci

# 唯一的正确性门禁。五个作业里只有 `ci-success` 会被分支保护要求，其余四个
# 通过它汇总——这样以后增删作业不必每次去改分支保护。
# **`ci-success` 这个 name 就是分支保护里那个必需检查的名字，改它等于让分支保护指向一个
# 不再上报的 context，所有 PR 会立刻卡死。** 增删作业改 needs，不要动 name。
#
# 全部命令都走 Makefile 的目标名（`make fmt-check` / `make lint` / `make test` /
# `make build`），**不在本文件里重写命令**。门禁只有一处定义，否则「本机绿」与
# 「CI 绿」会变成两套标准。唯一的例外是 test-windows：它刻意直接跑 cargo，
# 见该作业的注释。
#
# Linux x86_64 作业跑在 CodeBuild 托管的自托管 runner 上（项目 `yunjian-runner`，
# us-east-2）。**换的是执行机，不是 CI 的形状**：命令、依赖图与门禁一律不动。
# 自托管 runner 不计入 GitHub 的 included minutes，只付 CodeBuild 的分钟数。
#
# 三条硬约束，改这里之前先读：
#
# 1. `codebuild-yunjian-runner-` 里的项目名必须与 CodeBuild 项目**逐字相同**。对不上时
#    CodeBuild 不处理 webhook，**job 会一直挂在 queued 而不报错**——那个症状最难查。
# 2. 每个 job 的第二个标签必须**全局唯一**。GitHub 按 superset 匹配路由 job，标签少的
#    job 会被标签多的 job 的 runner 接走，后者永远等不到自己的 runner。今天各 job 标签
#    数相同也不安全：将来只要给某个 job 加一个 `instance-size:` 覆盖就会触发。
# 3. `${{ github.run_id }}-${{ github.run_attempt }}` 两段都要。少了 run_attempt，
#    重跑会去抢上一次那批 runner 的标签。
#
# `test-windows` 继续用 GitHub 托管 runner：CodeBuild 的 Windows runner 需要预留容量
# fleet（按小时计费），而本项目只用它验一条跨平台路径发现行为，不值这个成本。
#
# 若仓库转为 private，第三方报告上传还必须配置各服务自己的 token；`GITHUB_TOKEN` 不能
# 代替 Codecov repository upload token。

on:
  push:
  pull_request:

# 并发组必须包含 github.event_name。同一分支的 push 与 pull_request 是两条独立
# 运行，共用一个组会互相取消，于是 PR 上的检查莫名变成 cancelled、
# 而 `ci-success` 又必须把 cancelled 判为失败——结果是永远合不进去。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 固定版本而不是取 latest：格式化器换版本会改输出，一次上游发布就能让所有
  # 无关 PR 的 fmt-check 集体变红。升级时同步改开发机上的 oxfmt 版本。
  OXFMT_VERSION: 0.59.0
  # cargo-audit 用 RustSec 官方发布的预编译产物，不引第三方 action，也不从源码编译。
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  test:
    name: Test
    runs-on:
      - codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - ci-test
    steps:
      - uses: actions/checkout@v4

      # 必须显式钉 Node：CodeBuild 的 `standard:7.0` 镜像同时装了 Node 18/20/22/24，
      # 默认哪一个由镜像自己决定，与 GitHub 托管镜像不同。而 `app/` 的 vite 8 要求
      # `^20.19 || >=22.12`——落到 Node 18 上时 `npm ci` 对 EBADENGINE **只 warn 不 fail**
      # （退出码 0），失败被推迟到两步之后，报成 `Cannot find module @rollup/rollup-*`
      # 这类完全不提版本的错。所以钉版本，并让本步自己断言，把失败拉回成因所在。
      # 断言写的是 vite 的真实区间而不是「等于 22」，改 node-version 时不会误报。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 断言 Node 版本满足 app/ 的下限
        run: |
          node --version
          npm --version
          node -e 'const [a,b]=process.versions.node.split(".").map(Number);
            if (!((a===20&&b>=19)||(a===22&&b>=12)||a>22)) {
              console.error("Node "+process.versions.node+" 不满足 app/ 的 ^20.19 || >=22.12");
              process.exit(1);
            }'

      # 显式列出 components：仓库根的 rust-toolchain.toml 虽然声明了
      # rustfmt + clippy，但 action 先装好 stable 之后，rustup 未必会再为
      # 已存在的工具链补装组件。少了 rustfmt，`make fmt-check` 直接报命令不存在。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 同时缓存 cargo registry / git 与 target 目录。
      - uses: Swatinem/rust-cache@v2

      # Tauri 在 Linux 上链接系统 WebKitGTK，缺了这些包 `crates/yunjian-app` 连编译都
      # 过不去——而它现在是工作区成员，于是 `cargo test --workspace` 会整体失败。
      # 这不是「桌面端专用」的额外步骤，是本作业能编译工作区的前提。
      # 版本必须是 4.1（Tauri v2 用 libsoup3 那一支），4.0 是 v1 的搭配。
      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev

      # 必须显式安装：`make fmt-check` 在缺 oxfmt 时是**硬失败**而不是跳过
      # （todo 5 的刻意选择——跳过等于门禁静默蒸发）。
      # 注意来源是 npm 的 oxc-project/oxc，**不是 crates.io**：crates.io 上叫
      # oxfmt 的是一个毫不相关的序列化库，`cargo install oxfmt` 装的是错东西。
      - name: 安装 oxfmt
        run: |
          npm install -g "oxfmt@${OXFMT_VERSION}"
          oxfmt --version

      - name: 格式校验
        run: make fmt-check

      - name: clippy
        run: make lint

      - name: 测试（含背诵评分黄金契约）
        run: make test

      # 默认工作区测试不会启用 `yunjian-mcp/http`，而一致性 harness 需要同时编译可选传输，
      # 才能守住完整特性组合下的五工具协议面。
      - name: MCP 端到端一致性测试
        run: make mcp-conformance

      # 自绘标题栏的时序缺陷（StrictMode 下卸载后写状态、订阅泄漏）与非 Tauri 降级
      # 只有 Vitest 验得到，Rust 侧一条都覆盖不到。它在 `make ci` 的 GATE 里，
      # 这里单列一步只是为了让失败定位到「前端测试」而不是一整条 ci。
      - name: 前端测试
        run: make frontend-test

      # `build` 刻意不在 `make ci` 里（耗时且不是正确性门禁），所以在 CI 里单列一步。
      - name: 发布构建
        run: make build

  # Windows 上刻意只跑 cargo test，不走 make：门禁的格式化与 lint 与平台无关，
  # 在这里重复一遍只是花两倍时间。这个作业存在的理由是跨平台行为——
  # `dirs` 的配置目录发现在 Windows 上读 %APPDATA%/%LOCALAPPDATA%/%USERPROFILE%，
  # 与 Linux 的 XDG 路径完全不同，只有真的在 Windows 上跑才能证明测试隔离成立。
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 本作业刻意直接跑 cargo，所以拿不到 Makefile 里那条「产物缺失就自动构建前端」的
      # 前置依赖，必须在这里显式构建：`crates/yunjian-app` 的 `generate_context!` 在
      # `app/dist` 缺失时 panic，`cargo test --workspace` 会因此无法编译。
      # Windows runner 不需要额外系统依赖（WebView2 随系统常青分发），只需要前端产物。
      - name: 构建桌面端前端
        run: npm ci && npm run build
        working-directory: app

      # 前端测试在 Windows 上也跑：标题栏的契约测试要在磁盘上按路径找文件
      # （capabilities JSON、两份 tauri 配置、构建产物），而路径处理正是这个项目
      # 一再栽跟头的地方。Linux 上绿不代表 Windows 上绿。
      - name: 前端测试
        run: npm test
        working-directory: app

      - name: 测试
        run: cargo test --workspace

  # stable 变绿不能证明 Cargo.toml 声明的最低版本仍然可用。单独用精确的 1.95
  # 验一遍，避免依赖升级后再次出现“声明下限低于真实下限”。
  #
  # 覆盖面刻意切成两层，因为“编译得过”和“声明的下限成立”不是同一个问题：
  #
  # 1. **依赖声明的下限**：从 `cargo metadata --all-features` 取整张锁定图里每个包的
  #    `rust-version` 求最大值，与工作区声明值比较。这一层**覆盖全部特性（含 `voice`）**，
  #    一行代码都不编译，因此不需要原生工具链，也不会因为将来新增特性而漏掉。它要抓的
  #    正是本 PR 处理的那类回归：`inputx-phonetic-edit 1.4.0` 声明 1.95，而工作区曾声明 1.88。
  #
  # 2. **我们自己的代码**：用 1.95 真的编译一遍。特性集是“除 `voice` 之外的全部特性”，
  #    由 `cargo metadata` 现算而不是手写白名单——新增特性自动进入，不会静默漏检。
  #
  # `voice` 被排除的理由不是它编不过，而是 Makefile 已经定下的边界（见 `make build` 上方
  # 那段注释）：它要 libclang、要联网下载几十 MB 预编译 sherpa-onnx 产物，且分发物许可与
  # 默认构建不同，因此刻意不进任何门禁。把它拉进这个必需检查等于把一次网络下载放进分支
  # 保护的关键路径。**代价必须说清楚：`voice` 特性后面我们自己写的那部分代码没有在 1.95 上
  # 被类型检查过**——它由 `voice-build.yml` 在 stable 上五平台构建覆盖；而它拉进来的依赖
  # （sherpa-rs 等）声明的下限仍由第 1 层覆盖。
  msrv:
    name: MSRV (Rust 1.95)
    runs-on:
      - codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - ci-msrv
    steps:
      - uses: actions/checkout@v4

      # 钉 Node 的理由与断言写法见本文件 `test` 作业的同名步骤。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 断言 Node 版本满足 app/ 的下限
        run: |
          node --version
          node -e 'const [a,b]=process.versions.node.split(".").map(Number);
            if (!((a===20&&b>=19)||(a===22&&b>=12)||a>22)) {
              console.error("Node "+process.versions.node+" 不满足 app/ 的 ^20.19 || >=22.12");
              process.exit(1);
            }'

      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.95

      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev

      # 第 2 层的特性集包含 `yunjian-voice/capture`，它拉进 `rodio` -> `alsa-sys`，
      # 而 `alsa-sys` 的 build script 用 pkg-config 找 `alsa.pc`，找不到就 panic。
      # 缺它时的报错是「Package alsa was not found」，字面上与语音无关，极易误判成
      # sherpa 的问题。包名与 voice-build.yml、audio-permissions.yml 完全一致。
      #
      # 自带 `apt-get update` 而不依赖上一步跑过：与 audio-permissions.yml 里那两处一致。
      # 少了它，这一步的成败就取决于步骤顺序，将来任何一次重排都能让它无声地失效。
      - name: 安装 ALSA 开发文件
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      # 第 2 层的特性集还会把 `sherpa-rs-sys` 拉进图里，它的 build script 跑 bindgen，
      # 而 bindgen 要 dlopen `libclang.so`。GitHub 托管的 ubuntu-latest 自带 libclang，
      # CodeBuild 的 `standard:7.0` 不带——也就是说这一步以前是在白拿托管镜像的预装件。
      # 缺它时的报错是「Unable to find libclang ... (invalid: [])」，字面上指向 sherpa，
      # 与 MSRV 毫无关系，极易误判成依赖版本问题。
      #
      # 不用 `llvm-config --libdir` 取路径：libclang-dev 不带无版本号的 `llvm-config`，
      # 实测报 command not found，于是 LIBCLANG_PATH 被写成空串，bindgen 的报错里那个
      # `(invalid: [])` 正是这么来的。直接找 .so 更稳。做法与 voice-build.yml 一致。
      - name: 安装 libclang 并导出 LIBCLANG_PATH
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          SO=$(find /usr/lib/llvm-* -name 'libclang.so*' -print -quit 2>/dev/null || true)
          if [ -z "$SO" ]; then
            echo "::error::装了 libclang-dev 却找不到 libclang.so"
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$SO")" >> "$GITHUB_ENV"

      - name: 构建桌面端前端
        run: npm ci && npm run build
        working-directory: app

      # 版本比较在 jq 里按数字分量做，不用字符串比较：字符串会把 1.100 判得比 1.95 小。
      # 缺分量按 0 补齐，所以 `1.95` 与 `1.95.0` 视为同一版本。
      - name: 第 1 层——依赖声明的下限不得高于工作区声明值（全特性）
        run: |
          cargo metadata --all-features --locked --format-version 1 \
            > "${RUNNER_TEMP}/metadata.json"
          jq -r '
            def version: split(".") | map(tonumber) | (. + [0, 0])[0:3];
            def render: map(tostring) | join(".");
            .workspace_members as $members
            | ([.packages[]
                | select(.id as $id | $members | index($id))
                | .rust_version | version] | min) as $declared
            | ([.packages[]
                | select(.rust_version != null)
                | .rust_version | version] | max) as $required
            | if $required > $declared
              then "工作区声明 \($declared | render)，但锁定图里有依赖要求 \($required | render)：\([.packages[] | select(.rust_version != null) | select((.rust_version | version) == $required) | .name] | unique | join(", "))"
                | halt_error(1)
              else "锁定图（全特性）要求 \($required | render)，不高于工作区声明 \($declared | render)"
              end
          ' "${RUNNER_TEMP}/metadata.json"

      # 特性集现算：所有工作区成员的所有特性，减去 `default`（本来就开着）与 `voice`
      # （上面说明了排除理由）。将来谁加了新特性会自动被这一步覆盖；若新特性同样需要
      # 原生工具链，这一步会当场变红而不是静默漏检——那正是我们要的默认行为。
      - name: 第 2 层——在 1.95 上编译（除 voice 之外的全部特性）
        run: |
          features=$(cargo metadata --no-deps --format-version 1 | jq -r '
            [.packages[] as $p
              | ($p.features | keys[])
              | select(. != "default" and . != "voice")
              | "\($p.name)/\(.)"] | unique | join(",")')
          echo "本次编译的特性：${features}"
          cargo check --workspace --locked --features "${features}"

  # 语料门禁定义在 `corpus.yml` 里并由此处调用，而不是内联在本文件。
  # 它必须由 `ci.yml` 调用才能进 `ci-success` 的 needs——`needs` 只在同一个工作流文件内
  # 有效，一个自带 push 触发的独立工作流无论多绿都喂不进这个门禁。
  # 调用是**无条件**的：带路径过滤会让无关 PR 上它变成 skipped，而下面的白名单判定把
  # skipped 当失败，必需检查就永远不通过。理由详见 `corpus.yml` 的文件头。
  corpus:
    name: Corpus
    uses: ./.github/workflows/corpus.yml

  security:
    name: Security Audit
    runs-on:
      - codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - ci-security
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # 装到 RUNNER_TEMP 而不是 checkout 目录：解到工作树里会污染仓库，
      # 让后续任何「工作树干净」的断言失效。
      # 下载地址里的 %2F 是必需的——tag 名本身含斜杠（cargo-audit/vX.Y.Z）。
      # 取 musl 而不是 gnu 产物。gnu 那份链接的是宿主 glibc，实测在 CodeBuild 的
      # `standard:7.0`（Ubuntu 22.04，glibc 2.35）上报 `version GLIBC_2.38 not found`
      # ——它在 GitHub 托管的 ubuntu-latest（24.04，glibc 2.39）上能跑纯属宿主够新。
      # musl 产物静态链接，与宿主 glibc 版本无关，换镜像不会再触发这一类失败。
      # 仍是 RustSec 官方预编译产物，不引第三方 action、不从源码编译。
      - name: 安装 cargo-audit（RustSec 官方预编译产物）
        run: |
          DIR="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          URL="https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${DIR}.tgz"
          curl -sSLf -o "${RUNNER_TEMP}/cargo-audit.tgz" "$URL"
          tar xzf "${RUNNER_TEMP}/cargo-audit.tgz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/${DIR}" >> "$GITHUB_PATH"

      - name: 校验 cargo-audit 可用
        run: cargo audit --version

      - name: 依赖漏洞审计
        run: cargo audit

  ci-success:
    name: CI Success
    runs-on:
      - codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - ci-success
    needs: [test, test-windows, msrv, corpus, security]
    # always() 是必需的：默认情况下任一 needs 失败就会让本作业变成 skipped，
    # 而 skipped 在分支保护看来既不是成功也不是失败，必需检查会永远处于 pending。
    if: always()
    steps:
      # 用白名单而不是黑名单：断言每个结果都恰好等于 success，
      # 而不是逐一排除 failure / cancelled / skipped。黑名单在 GitHub 将来
      # 新增一种结果值时会静默放行，白名单不会。
      - name: 断言每个依赖作业都成功
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "依赖作业结果：${RESULTS}"
          # 空串必须当失败处理，否则 for 循环一次都不进、门禁变成空操作。
          if [ -z "${RESULTS}" ]; then
            echo "::error::拿不到依赖作业的结果，拒绝放行"
            exit 1
          fi
          failed=0
          for result in $(echo "${RESULTS}" | tr ',' ' '); do
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::CI 未全绿（${RESULTS}）——只有全部为 success 才放行"
            exit 1
          fi
          echo "全部依赖作业成功。"
