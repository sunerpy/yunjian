name: corpus-release

# 语料工件发布：`corpus-v*` tag → GitHub Release。
#
# ## 为什么与应用发布 tag 分离
#
# 语料修订与代码修订的节奏差一个数量级：上游数据缺陷随时可能修，而应用版本不该
# 因为一次数据修订被迫发一版；反过来，发一版应用也不该强迫重新分发 200 MB 的语料。
# 因此工件挂在独立的 `corpus-v*` tag 上，应用侧靠 `schema_version` 谈兼容
# （`manifest.json` 里同时写 `schema_version` 与 `min_app_version`）。
#
# `release-please.yml` 管的是 `v*` 应用 tag，本工作流只认 `corpus-v*`，两者不重叠。
#
# ## 为什么在 CI 里重建而不是上传本机产物
#
# 工件必须可复现：构建器逐行有序写入、`VACUUM` 后逐字节确定，所以 CI 重建出来的
# 文件应当与本机一致。在 CI 重建同时也证明了「任何人拿着锁定 revision 都能重造
# 这个工件」，而上传本机产物只能证明某台机器上曾经有过这么一个文件。
#
# ## 审计库是 CI 工件，不进 Release
#
# `corpus-audit.db` 是构建期台账（`defect` + `disposition`），供排查用；
# 它作为 workflow artifact 保留 90 天，**不**作为 Release 资产——用户工件里
# 不该有任何诊断数据。
#
# `build` 跑在 CodeBuild 托管 runner 上。它对镜像的实际要求只有 `gh` / `jq` /
# `sha256sum`，三者都在 `aws/codebuild/standard:7.0` 里；工件本身的确定性不依赖宿主
# SQLite——`rusqlite` 用 `bundled` 特性从随包源码编译，所以换基础镜像不会动摇上面
# 「逐字节确定」那条性质。

on:
  push:
    tags:
      - "corpus-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "已存在的 corpus-v* tag，用于重挂失败的发布"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 三个上游按 corpus/sources.toml 锁定的 revision。改这里等于改语料内容，
  # 必须与 sources.toml 同步——`verify-sources` 会核对摘要，对不上即失败。
  CHINESE_POETRY_REV: b8594f81a89752241442f2ce267d6f66f96704ee
  WERNEROR_REV: 4cfe49c06858e00d15f84d192fe5294295f79689
  RHYME_REV: ff0e9c13fb037c43e0eaa5dc929c0fe4fa2ffb18

concurrency:
  group: corpus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish corpus artifact
    runs-on:
      - codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - corpus-release-build
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 许可门禁在建库之前：不合许可的源根本不该被读进来，这个顺序与
      # `make corpus-gate` 一致。
      - name: 许可门禁
        run: cargo run -p xtask --release -- verify-sources --offline

      - name: 检出锁定 revision 的上游语料
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corpus-src"
          clone_at() {
            local url="$1" rev="$2" dir="$3"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth 1 origin "$rev"
            git -C "$dir" checkout -q FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$rev"
          }
          clone_at https://github.com/chinese-poetry/chinese-poetry "$CHINESE_POETRY_REV" \
            "$RUNNER_TEMP/corpus-src/chinese-poetry"
          clone_at https://github.com/Werneror/Poetry "$WERNEROR_REV" \
            "$RUNNER_TEMP/corpus-src/Poetry"
          clone_at https://github.com/charlesix59/chinese_word_rhyme "$RHYME_REV" \
            "$RUNNER_TEMP/corpus-src/rhyme"

      - name: 构建待发布的随包库与审计库
        run: |
          cargo run -p xtask --release -- corpus-build \
            --chinese-poetry-dir "$RUNNER_TEMP/corpus-src/chinese-poetry" \
            --werneror-dir "$RUNNER_TEMP/corpus-src/Poetry" \
            --rhyme-dir "$RUNNER_TEMP/corpus-src/rhyme"

      # 打包自带六条中止断言（完整性、无诊断表、跨文件守恒、结论在预算内、
      # 形态与结论一致、最终 gzip 不超预算），任一不成立即失败，不需要在这里重复。
      - name: 打包并校验工件
        run: cargo run -p xtask --release -- corpus-package

      - name: 独立复核校验与 manifest
        working-directory: corpus/build/package
        run: |
          set -euo pipefail
          sha256sum -c ./*.db.gz.sha256
          jq -e '.schema_version and .corpus_version and .min_app_version and .sha256' \
            manifest.json > /dev/null
          jq -e '.measurement.within_budget == true' manifest.json > /dev/null
          # 工件大小必须与 manifest 记录一致：两者由不同代码路径产生，
          # 对不上说明 manifest 描述的不是这个文件。
          test "$(stat -c%s ./*.db.gz)" = "$(jq -r '.size_bytes' manifest.json)"

      # 随包赏析种子与语料是**同一次数据发布里的两件独立工件**（todo 76）：它们各有版本，
      # 而 `corpus fetch` 要靠一份统一清单同时拿到两者。少了这一步，发布出去的语料没有
      # 任何代码路径能把种子送到用户机器上，「无 key 也有赏析」在净机上就不成立。
      #
      # ## 为什么是「下载 + 校验」而不是「在这里生成」
      #
      # 这一步曾经直接跑 `pregenerate` 且**刻意不给 `--endpoint`**（CI 里没有开放权重推理
      # 运行时）。那一步如实降级成「每条正文是未生成标记」，而下游照常把它发出去：
      # `corpus-v0.1.0` 的 `appreciations.json` 因此是 16 条全占位。移动端首启从
      # `releases/latest/download/assets_manifest.json` 取种子，所以真机上看到的赏析
      # 一直是占位——2026-08-17 实测确认。
      #
      # 在 CI 里现拉一个 7B 权重跑推理不是可行的替代：既让发布时长失控（本机 CPU 实测
      # 32–66 秒/条，还要先下载几个 GiB 权重），也让「发布产物由哪一次推理产生」不可追溯——
      # 每次重跑都会得到一份新的、无人看过的正文。
      #
      # 于是种子在一台有运行时的机器上**生成一次**，上传到独立的 `appreciation-seed-v*`
      # Release，指针与摘要写进仓库里的 `dataset/appreciations.lock.toml`。本步骤只按锁
      # 下载：时长是一次下载，而「这些字节从哪来」由 `git log dataset/appreciations.lock.toml`
      # 回答。锁不是种子本身，所以「产物不入库」那条规则没有被动摇。
      #
      # `xtask/src/main.rs` 有一条断言扫本文件，要求 `verify-seed` 在场且 `pregenerate` 不在。
      - name: 按种子锁下载随包赏析种子
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SEED_TAG="$(cargo run -p xtask --release --quiet -- \
            verify-seed --print-seed-tag)"
          echo "种子 tag：$SEED_TAG"
          gh release view "$SEED_TAG" --json tagName,isDraft,isPrerelease > seed-release.json
          jq -e --arg tag "$SEED_TAG" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == true' \
            seed-release.json > /dev/null
          # 发布说明也要写出种子来源，而那一步不该再解析一次锁——锁只应有一个解析器。
          echo "SEED_TAG=$SEED_TAG" >> "$GITHUB_ENV"
          gh release download "$SEED_TAG" --dir dataset --clobber \
            --pattern appreciations.json \
            --pattern appreciations.json.sha256 \
            --pattern appreciations.manifest.json

      # 门禁在这里，而不是在生成那一环：`pregenerate` 不带 `--endpoint` 时如实降级是**正确
      # 行为**（本地开发与管线校验都需要它），把降级产物发给用户才是缺陷。所以
      # `generation_executed=false` 在本步骤是硬失败。
      #
      # 它不采信种子自述的任何字段：覆盖集与每首的 `grounding_digest` 由上面刚建好的
      # `corpus.db` 用生成期同一个实现重算，逐项相等才放行。披露门禁也在这里接上——
      # 发布流不再跑 `pregenerate`，那道检查若不重新挂上就整条消失了。
      - name: 随包赏析种子发布门禁
        run: |
          cargo run -p xtask --release -- verify-seed \
            --corpus-db corpus/build/release/corpus.db

      # 清单里的下载地址必须指向**本次这个 tag** 的资产。写死 `latest` 会让一次新发布
      # 悄悄改掉旧清单指向的文件。
      - name: 合成统一资产清单
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          cp dataset/appreciations.json dataset/appreciations.json.sha256 corpus/build/package/
          cargo run -p xtask --release -- assets-manifest \
            --corpus-manifest corpus/build/package/manifest.json \
            --seed-manifest dataset/appreciations.manifest.json \
            --seed corpus/build/package/appreciations.json \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            --out corpus/build/package/assets_manifest.json

      # 统一清单的两个摘要都当场重算一遍。清单由 xtask 写、资产由 packager 写，
      # 两条代码路径对不上意味着清单描述的不是即将上传的那两个文件。
      - name: 独立复核统一清单
        working-directory: corpus/build/package
        run: |
          set -euo pipefail
          sha256sum -c ./appreciations.json.sha256
          test "$(jq -r '.corpus.sha256' assets_manifest.json)" \
            = "$(cut -d' ' -f1 <./*.db.gz.sha256)"
          test "$(jq -r '.appreciation_seed.sha256' assets_manifest.json)" \
            = "$(cut -d' ' -f1 <./appreciations.json.sha256)"
          test "$(jq -r '.corpus.corpus_version' assets_manifest.json)" \
            = "$(jq -r '.appreciation_seed.corpus_version' assets_manifest.json)"

      - name: 上传审计库（CI 工件，不进 Release）
        uses: actions/upload-artifact@v4
        with:
          name: corpus-audit-db
          path: corpus/build/release/corpus-audit.db
          retention-days: 90
          compression-level: 9

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          cd corpus/build/package
          # `--clobber` 让重挂（workflow_dispatch）可以覆盖上一次上传失败留下的资产，
          # 而不必为了修一次发布去升语料版本号。
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.db.gz ./*.db.gz.sha256 manifest.json \
              appreciations.json appreciations.json.sha256 assets_manifest.json --clobber
            gh release edit "$TAG" --prerelease=false --latest
          else
            gh release create "$TAG" ./*.db.gz ./*.db.gz.sha256 manifest.json \
              appreciations.json appreciations.json.sha256 assets_manifest.json \
              --latest \
              --title "语料工件 $TAG" \
              --notes "$(printf '%s\n' \
                "由 \`xtask corpus-package\` 产出，六条中止断言全部通过。" \
                "" \
                "- 随包默认集：$(jq -r '.shipped_scope' manifest.json)，$(jq -r '.record_count' manifest.json) 首" \
                "- schema 版本：$(jq -r '.schema_version' manifest.json)（应用最低版本 $(jq -r '.min_app_version' manifest.json)）" \
                "- 工件：$(jq -r '.size_bytes' manifest.json) 字节（gzip），解压后 $(jq -r '.uncompressed_bytes' manifest.json) 字节" \
                "- SHA-256：\`$(jq -r '.sha256' manifest.json)\`" \
                "" \
                "\`ngram\` / \`poem_fts\` / \`poem_last_char\` 三张检索结构**不随包**，" \
                "由应用首启在本机派生（实测 $(jq -r '.measurement.first_launch_seconds' manifest.json) 秒）。" \
                "构建期审计台账拆入 \`corpus-audit.db\`，作为 CI 工件而非用户工件。" \
                "" \
                "## 随包赏析种子" \
                "" \
                "- \`appreciations.json\`：$(jq -r '.record_count' ../../../dataset/appreciations.manifest.json) 条，模板版本 $(jq -r '.template_version' ../../../dataset/appreciations.manifest.json)" \
                "- 覆盖集：$(jq -r '.coverage_tags | join("、")' ../../../dataset/appreciations.manifest.json)（筛选途径 $(jq -r '.coverage_selector' ../../../dataset/appreciations.manifest.json)）" \
                "- 生成模型：$(jq -r '.model' ../../../dataset/appreciations.manifest.json)（许可 $(jq -r '.model_license' ../../../dataset/appreciations.manifest.json)，运行时 $(jq -r '.provider' ../../../dataset/appreciations.manifest.json)）" \
                "- 权重摘要：\`$(jq -r '.model_digest' ../../../dataset/appreciations.manifest.json)\`" \
                "- 种子来源：\`${SEED_TAG}\` 这个 Release，指针见 \`dataset/appreciations.lock.toml\` 的 git 历史" \
                "- **是否真的执行了推理：$(jq -r '.generation_executed' ../../../dataset/appreciations.manifest.json)**" \
                "$(jq -r 'if .generation_executed then "" else "" end' ../../../dataset/appreciations.manifest.json)" \
                "$(jq -r 'if .generation_executed | not then "> [!WARNING]\n> 本次发布的种子**不是模型输出**：" + .not_executed_reason + "。每条正文是未生成标记，\n> 管线、门禁与溯源字段照常校验。不要把它当成可供阅读的赏析内容。" else "" end' ../../../dataset/appreciations.manifest.json)" \
                "" \
                "## 统一资产清单" \
                "" \
                "\`assets_manifest.json\` 同时声明上面两件工件，是 \`yunjian corpus fetch\` 的入口。" \
                "两件工件版本独立，但 \`corpus_version\` 必须一致——不一致时导入会被兼容矩阵拒绝，" \
                "因此发布前已在 \`xtask assets-manifest\` 里比过一次。")"
          fi

      # 发布之后**独立复核发布这件事本身**，而不是相信上一步的退出码。
      #
      # 这一步补的是一个真实发生过的漏洞：todo 75 曾被判为完成，而仓库里一个
      # Release、一个 tag 都没有。原因是那条验收 shell 用 `gh ... --jq` 取一个布尔值
      # 却只看退出码——`gh --jq` 对 `false` 与 `null` 都返回 0，于是「发布了吗」这个
      # 问题永远答「是」。**退出码 0 不等于验收通过**：凡是产出机器可读结果的命令，
      # 都必须再断言那个结果的语义字段。
      #
      # 所以下面每一条都是可证伪的比较：Release 必须不是 draft、六个资产逐个点名、
      # 并且真的把工件与 `.sha256` 下回来重算一遍摘要——上传成功不等于内容正确。
      - name: 复核 Release 真实存在且资产可校验
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,tagName,assets > release.json
          jq -e --arg tag "$TAG" '.tagName == $tag and .isDraft == false' release.json > /dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > latest-release.json
          jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            latest-release.json > /dev/null
          jq -r '.assets[].name' release.json | LC_ALL=C sort > remote-assets.txt
          cat remote-assets.txt
          for want in \
            "$(basename corpus/build/package/*.db.gz)" \
            "$(basename corpus/build/package/*.db.gz.sha256)" \
            manifest.json \
            appreciations.json \
            appreciations.json.sha256 \
            assets_manifest.json; do
            grep -qxF "$want" remote-assets.txt
          done
          mkdir -p verify && cd verify
          gh release download "$TAG" --pattern '*.db.gz' --pattern '*.db.gz.sha256' \
            --pattern 'manifest.json' --pattern 'appreciations.json' \
            --pattern 'appreciations.json.sha256' --pattern 'assets_manifest.json' --clobber
          sha256sum -c ./*.db.gz.sha256
          sha256sum -c ./appreciations.json.sha256
          test "$(stat -c%s ./*.db.gz)" = "$(jq -r '.size_bytes' manifest.json)"
          test "$(cut -d' ' -f1 <./*.db.gz.sha256)" = "$(jq -r '.sha256' manifest.json)"
          test "$(cut -d' ' -f1 <./appreciations.json.sha256)" \
            = "$(jq -r '.appreciation_seed.sha256' assets_manifest.json)"
          test "$(cut -d' ' -f1 <./appreciations.json.sha256)" \
            = "$(cut -d' ' -f1 <../corpus/build/package/appreciations.json.sha256)"
          test "$(jq -r '.appreciation_seed.url' assets_manifest.json)" \
            = "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/appreciations.json"
