name: voice-build

# 五平台原生语音构建矩阵。存在的理由是 todo 44 的裁决：Linux 之外的四个目标在开发
# 环境里无法构建（无 Windows/macOS 宿主机、无 NDK、无 Xcode SDK），只能在有对应宿主机
# 的地方验证。详见 docs/VOICE-BUILD.zh.md「五平台结论」。
#
# Linux x86_64 的四个执行单元跑在 CodeBuild 托管 runner 上，Windows / macOS 腿继续用
# GitHub 托管 runner（CodeBuild 那两个平台要预留容量 fleet，按小时计费）。
#
# 混合平台矩阵**不需要按宿主 OS 拆 job**：`runs-on: ${{ fromJSON(matrix.runner) }}` 让
# 每条腿自带一个 JSON 串——Linux 腿给两标签数组，其余腿给单个字符串。拆 job 会改动依赖
# 图与汇总作业的 needs，而换 runner 本该只改执行机。
# 注意 matrix 里的 `runner` 值现在是**JSON 文本**，外层单引号是语法的一部分，不是排版。

on:
  push:
    branches: [main]
    paths:
      - "crates/yunjian-voice/**"
      - "crates/yunjian-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/voice-build.yml"
  pull_request:
    paths:
      - "crates/yunjian-voice/**"
      - "crates/yunjian-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/voice-build.yml"
  workflow_dispatch:

# 并发组包含 github.event_name：同一分支的 push 与 pull_request 是两条独立运行，
# 互相取消会让 PR 检查莫名变成 cancelled。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ASR_MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-tiny.tar.bz2
  TTS_MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kitten-nano-en-v0_2-fp16.tar.bz2

jobs:
  no-voice-links-nothing:
    name: 无语音构建不链接 onnxruntime
    runs-on:
      - codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - voice-no-native
    steps:
      - uses: actions/checkout@v4

      # 钉 Node 的理由与断言写法见 ci.yml `test` 作业的同名步骤：下面那步 `npm ci` 对
      # 版本过低只 warn 不 fail，失败会推迟到 vite build 才炸，且报错不提版本。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 断言 Node 版本满足 app/ 的下限
        run: |
          node --version
          node -e 'const [a,b]=process.versions.node.split(".").map(Number);
            if (!((a===20&&b>=19)||(a===22&&b>=12)||a>22)) {
              console.error("Node "+process.versions.node+" 不满足 app/ 的 ^20.19 || >=22.12");
              process.exit(1);
            }'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 本作业跑的是 `cargo build --workspace`，而工作区自 todo 59 起含 `yunjian-app`
      # （Tauri）。它在 Linux 上链接系统 WebKitGTK，缺包时连 `glib-sys` 的 build script
      # 都过不去，于是这条与 onnxruntime 毫无关系的断言会因为缺 GTK 而失败。
      # 刻意不改成 `--exclude yunjian-app`：本作业要证明的是**默认构建整体**不链接
      # onnxruntime，把新成员排除掉就等于把断言的覆盖面缩小到它自己没声明的范围。
      - name: 安装 Tauri 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev

      # 前端产物是 `yunjian-app` 的编译期前置条件（`generate_context!` 在
      # `build.frontendDist` 缺失时 panic）。本作业直接跑 cargo，拿不到 Makefile 里
      # 那条自动构建的前置，所以显式构建。
      - name: 构建桌面端前端
        run: npm ci && npm run build
        working-directory: app

      - run: cargo build --workspace --release
      - name: 断言未链接 onnxruntime 且可运行
        run: |
          if ldd target/release/yunjian | grep -i onnx; then
            echo "::error::不开 voice 却链接了 onnxruntime"
            exit 1
          fi
          # `--version` 而不是裸调用：todo 30 之后裸调用缺子命令，clap 打帮助并按约定退出 2
          # （用法错误），`bash -e` 会把它当成失败。`--version` 同样要求进程真的起来、
          # 动态库真的解析成功，这正是本步要证明的性质。
          ./target/release/yunjian --version

  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: '["codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}", "voice-desktop-linux-x64"]'
            target: x86_64-unknown-linux-gnu
          - name: windows-x64
            runner: '"windows-latest"'
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            runner: '"macos-14"'
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cache-targets: false 是必需的，不是调优。rust-cache 会保留 sherpa-rs-sys 的
      # build script 指纹却裁掉它复制出来的 .so，于是 build script 不再重跑、
      # 原生库也不再出现，链接报 `unable to find library -lonnxruntime`。实测如此。
      # 原生产物另用一层 cache 兜住，重跑 build script 时不必重新下载几十 MB。
      - uses: Swatinem/rust-cache@v2
        with:
          key: voice-${{ matrix.target }}
          cache-targets: false

      - name: 缓存 sherpa-onnx 原生产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs
            ~/AppData/Local/sherpa-rs
          key: sherpa-native-${{ matrix.target }}-v1.12.9

      # 不用 `llvm-config --libdir`：ubuntu-latest 上 libclang-dev 不带无版本号的
      # `llvm-config`，实测报 `command not found`，于是 LIBCLANG_PATH 被写成空串，
      # bindgen 随后报「Unable to find libclang ... (invalid: [])」。直接找 .so 更稳。
      # libasound2-dev 是必需的，不是可选：`voice` 特性隐含 `capture`，`capture` 拉进
      # `rodio` -> `alsa-sys`，而它的 build script 用 pkg-config 找 `alsa.pc`，找不到就
      # panic。缺它时报错是「Package alsa was not found」，与语音无关，很容易误判成
      # sherpa 的问题。
      - name: 安装 libclang 与 ALSA 开发文件（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libasound2-dev
          SO=$(find /usr/lib/llvm-* -name 'libclang.so*' -print -quit 2>/dev/null || true)
          if [ -z "$SO" ]; then
            echo "::error::装了 libclang-dev 却找不到 libclang.so"
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$SO")" >> "$GITHUB_ENV"

      - name: 缓存冒烟模型
        id: models
        uses: actions/cache@v4
        with:
          path: models/cache
          key: voice-smoke-models-whisper-tiny-kitten-nano-v0_2

      # 权重不进 git，因此每台 runner 自取。许可已核实为 Apache-2.0，
      # 见 docs/VOICE-BUILD.zh.md「许可清单」。
      - name: 下载冒烟模型
        if: steps.models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models/cache
          cd models/cache
          curl -sSLf -o asr.tar.bz2 "$ASR_MODEL_URL"
          curl -sSLf -o tts.tar.bz2 "$TTS_MODEL_URL"
          tar xf asr.tar.bz2
          tar xf tts.tar.bz2
          rm asr.tar.bz2 tts.tar.bz2

      - name: 构建（带 voice）
        run: cargo build --release --target ${{ matrix.target }} --features yunjian-cli/voice -p yunjian-cli

      - name: 冒烟：一次真实识别 + 一次真实合成
        run: cargo test -p yunjian-voice --features voice --target ${{ matrix.target }} smoke

      # 这一步单独存在是因为它抓到过真实缺陷：缺 rpath 时二进制以退出码 127
      # 启动失败，而 cargo test 会注入 LD_LIBRARY_PATH，测试却全绿。
      - name: 断言发布二进制自身可启动
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/yunjian
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          # `--version` 而不是裸调用，理由同上：裸调用缺子命令按约定退出 2，
          # 而本步要证明的是「进程起得来、原生库解析得开」，`--version` 同样覆盖。
          "$BIN" --version

      - name: 记录体积增量
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p yunjian-cli
          {
            echo "### ${{ matrix.name }} 体积"
            echo '```'
            find "target/${{ matrix.target }}/release" -maxdepth 1 \
              \( -name 'yunjian*' -o -name '*onnx*' -o -name '*sherpa*' \) \
              -exec ls -l {} + || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 移动端只做「构建 + 记录每 ABI 库体积」。设备上的识别与合成冒烟走 todo 68 的
  # 物理设备 harness——GitHub runner 既无真机也无可用麦克风。
  mobile:
    name: ${{ matrix.name }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-arm64
            runner: '["codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}", "voice-mobile-android-arm64"]'
            target: aarch64-linux-android
          - name: ios-arm64
            runner: '"macos-14"'
            target: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cache-targets: false 是必需的，不是调优。rust-cache 会保留 sherpa-rs-sys 的
      # build script 指纹却裁掉它复制出来的 .so，于是 build script 不再重跑、
      # 原生库也不再出现，链接报 `unable to find library -lonnxruntime`。实测如此。
      # 原生产物另用一层 cache 兜住，重跑 build script 时不必重新下载几十 MB。
      - uses: Swatinem/rust-cache@v2
        with:
          key: voice-${{ matrix.target }}
          cache-targets: false

      - name: 缓存 sherpa-onnx 原生产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sherpa-rs
            ~/Library/Caches/sherpa-rs
            ~/AppData/Local/sherpa-rs
          key: sherpa-native-${{ matrix.target }}-v1.12.9

      # 不用 `llvm-config --libdir`：ubuntu-latest 上 libclang-dev 不带无版本号的
      # `llvm-config`，实测报 `command not found`，于是 LIBCLANG_PATH 被写成空串，
      # bindgen 随后报「Unable to find libclang ... (invalid: [])」。直接找 .so 更稳。
      # libasound2-dev 是必需的，不是可选：`voice` 特性隐含 `capture`，`capture` 拉进
      # `rodio` -> `alsa-sys`，而它的 build script 用 pkg-config 找 `alsa.pc`，找不到就
      # panic。缺它时报错是「Package alsa was not found」，与语音无关，很容易误判成
      # sherpa 的问题。
      - name: 安装 libclang 与 ALSA 开发文件（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libasound2-dev
          SO=$(find /usr/lib/llvm-* -name 'libclang.so*' -print -quit 2>/dev/null || true)
          if [ -z "$SO" ]; then
            echo "::error::装了 libclang-dev 却找不到 libclang.so"
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$SO")" >> "$GITHUB_ENV"

      - name: 配置 Android NDK
        if: matrix.target == 'aarch64-linux-android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      # 链接器和 C 编译器写死 android26：cpal 0.18 的 Android 后端要求 API 26，比
      # Tauri 文档写的 24 高。这一条是 todo 46 记录的产品要求。只设置 Cargo linker
      # 不够：ring 等含 C 代码的 crate 通过 cc-rs 读取 CC_<target>，否则会回落查找
      # PATH 中不存在的 aarch64-linux-android-clang。
      # BINDGEN_EXTRA_CLANG_ARGS 里的 --sysroot 是必需的：sherpa-rs-sys 会把 rust 三元组
      # 映射成 clang 三元组，但不传 sysroot，于是 clang 回落到宿主机 /usr/include，
      # 报 `bits/libc-header-start.h file not found`。实测如此。
      #
      # 只导出链接器曾经够用，因为 `voice` 里没有需要**为目标**编译 C 的依赖。todo 53
      # 让 `voice` 隐含 `download` 之后不再成立：`ureq`（-> rustls -> ring，含 C 与汇编）
      # 与 `bzip2`（-> bzip2-sys，自带 libbz2 的 C 源码）成了目标侧普通依赖，两者都用
      # cc-rs 编译。此前图里唯一的 ring 挂在 sherpa-rs-sys 的 build-dependencies 下，
      # 那是给宿主机编的，用宿主 cc 就够了。
      #
      # 缺这几条变量时 cc-rs 找不到目标编译器：它先探 `aarch64-linux-android21-clang`
      # （NDK bin 不在 PATH 上，探不到），再回落到 `aarch64-linux-android-clang`——
      # 而**统一工具链时代的 NDK 从未发过这个不带 API 级别的名字**，于是报
      # `ToolNotFound: failed to find tool "aarch64-linux-android-clang"`。ar/ranlib 走
      # 同一套回落：先探 PATH 上的 `llvm-ar`，失败则回落到同样不存在的
      # `aarch64-linux-android-ar`。因此四个工具全部写成 NDK 内的绝对路径，不依赖 PATH。
      #
      # 刻意**不**把 `$TC/bin` 加进 PATH：那会让 cc-rs 的自动探测命中 NDK 自带的
      # `aarch64-linux-android21-clang`，于是哪天这里的 CC 被删掉，C 代码会静默按
      # API 21 编译而不是报错。
      #
      # ar 是不带三元组前缀的 `llvm-ar`：NDK r23 移除了 GNU binutils，
      # `aarch64-linux-android-ar` 在 r26 里不存在。
      - name: 导出 NDK 环境
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          # 链接器与 CC 取自**同一个**变量，因此两者不可能落在不同 API 级别上——
          # C 代码与 Rust 代码针对不同 API 编译是这里最难查的一类故障。
          CLANG="$TC/bin/aarch64-linux-android26-clang"
          CLANGXX="${CLANG}++"
          AR="$TC/bin/llvm-ar"
          RANLIB="$TC/bin/llvm-ranlib"

          # 写死工具名是必需的（自动探测会回落到 NDK 从未发过的名字），但写死的名字
          # 会随 NDK 升版失效。不断言的话，下次失效仍然表现为那句无从下手的
          # `ToolNotFound`；断言之后它变成「这个文件没了」加一份目录清单。
          MISSING=0
          for TOOL in "$CLANG" "$CLANGXX" "$AR" "$RANLIB"; do
            if [ ! -x "$TOOL" ]; then
              echo "::error::NDK 工具不存在或不可执行：$TOOL"
              MISSING=1
            fi
          done
          if [ "$MISSING" != 0 ]; then
            echo "$TC/bin 的实际内容："
            ls "$TC/bin"
            exit 1
          fi

          # API 26 不是随手选的：android24 的 sysroot 里没有 AAudio 符号（todo 25 实测），
          # 而 `voice` 隐含 `capture`，cpal 的 Android 后端就走 AAudio。
          case "$CLANG" in
            *android26-clang) echo "OK: API 26" ;;
            *) echo "::error::CC/链接器不是 android26，cpal 的 AAudio 绑定会链接到缺符号的 sysroot"; exit 1 ;;
          esac

          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
            echo "CC_aarch64_linux_android=$CLANG"
            echo "CXX_aarch64_linux_android=$CLANGXX"
            echo "AR_aarch64_linux_android=$AR"
            echo "RANLIB_aarch64_linux_android=$RANLIB"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$TC/sysroot"
          } >> "$GITHUB_ENV"

      # iOS 只做 cargo check：`sherpa-rs` 声明了 `crate-type = ["cdylib", "rlib"]`，
      # cargo 会为依赖构建每一种声明的 lib 类型，而它的 cdylib 在 iOS 上链接失败
      # （undefined symbols for architecture arm64）。这是上游打包限制，不是本项目的配置问题。
      # `cargo check` 能证明 bindgen 与编译通路成立，跳过那个不该存在的 dylib 链接步骤。
      # 彻底解决要 fork 掉 `cdylib` 或推动上游，留给 todo 69；详见 docs/VOICE-BUILD.zh.md。
      - name: 校验（iOS，仅 check）
        if: matrix.target == 'aarch64-apple-ios'
        run: cargo check --release --target ${{ matrix.target }} --features voice -p yunjian-voice

      - name: 构建（带 voice）
        if: matrix.target != 'aarch64-apple-ios'
        run: cargo build --release --target ${{ matrix.target }} --features voice -p yunjian-voice

      - name: 记录每 ABI 原生库体积
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} 原生库体积"
            echo '```'
            find ~/.cache/sherpa-rs -type f \( -name '*.so' -o -name '*.a' \) -exec ls -l {} + || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  voice-build-success:
    name: voice-build 汇总
    runs-on:
      - codebuild-yunjian-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - voice-build-success
    needs: [no-voice-links-nothing, desktop, mobile]
    if: always()
    steps:
      - name: 任一依赖作业未成功即失败
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] \
            || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::voice-build 矩阵存在未成功的作业"
            exit 1
          fi
