# 云笺上游数据源清单（锁定 revision + 逐资产许可判定）
#
# 由 `cargo run -p xtask -- verify-sources` 强制校验，任何不合规条目直接让构建失败。
#
# 为什么校验粒度是「逐资产」而不是「逐仓库」：一份仓库级 LICENSE 只能授予该仓库
# **自身整理工作**的权利，无法为它抓取或转录来的内容授权。本清单落地时这条规则
# 立刻在 MIT 仓库内部命中了 10 个夹带现代注释/赏析的文件（见各 asset 的 note），
# 说明「仓库是 MIT 所以内容都能用」是错的。
#
# license_class 语义：
#   public_domain —— 底本为前现代作品，已过保护期
#   permissive    —— 该仓库自身的整理/计算产物，由其 LICENSE 授权
#   unverified    —— 授权链未核实（现代出版物、抓取自商业站点、来源不明的现代散文）
# shippable = false 的资产一律不进入分发产物；`unverified` 且 `shippable = true`
# 是硬失败。

[[source]]
name = "chinese-poetry/chinese-poetry"
url = "https://github.com/chinese-poetry/chinese-poetry"
git_rev = "b8594f81a89752241442f2ce267d6f66f96704ee"
license = "MIT"
license_url = "https://raw.githubusercontent.com/chinese-poetry/chinese-poetry/b8594f81a89752241442f2ce267d6f66f96704ee/LICENSE"
license_sha256 = "c195319aeaa3ffcbe16aa5d26eec19eae5a42f84337dd2b3dc3c9d5ccbbd6507"
license_file = "corpus/licenses/chinese-poetry.LICENSE"
retrieved_at = "2026-08-10"
usage = "text"
note = """
上游 issue #76 把 MIT 的范围说得很清楚：「此数据库(JSON结构化数据)是计算机数据属于软件，
仅对衍生整理的工作产物保留许可权」。因此原文本身按公有领域对待，整理产物按 MIT 对待。
注意：草案称该仓库「JSON 只有 {author, paragraphs, title, id}」，实测为假——见下列
unverified 资产。另：只有 `全唐诗/poet.*` 与 `strains/json/*` 带原生 `id` 字段，
`宋词/ci.song.*` 等其余集合没有，todo 10 的「优先用上游原生 key」路径覆盖不到它们。
"""

[[source.assets]]
path = "全唐诗/poet.tang.*.json, 全唐诗/poet.song.*.json"
underlying_work = "public-domain: 全唐诗（清康熙敕编）、全宋诗"
license_class = "public_domain"
shippable = true
note = "58 + 255 个分片，每片 1000 条；带原生 `id`，可作 source_locator。字段 {author, id, paragraphs, title}。"

[[source.assets]]
path = "全唐诗/authors.tang.json, 全唐诗/authors.song.json"
underlying_work = "public-domain: 全唐诗 原书作者小传（文言）"
license_class = "public_domain"
shippable = true
note = "authors.tang.json 3675 条、2573 条有 desc；实测 desc 是《全唐詩》原有文言小传，非现代撰写。"

[[source.assets]]
path = "宋词/ci.song.*.json"
underlying_work = "public-domain: 全宋词"
license_class = "public_domain"
shippable = true
note = "22 个标准分片 + ci.song.2019y.json(3 条)，合计 21050 条，与 issue #261 审计的 21050 吻合。字段 {author, paragraphs, rhythmic}，**无 id**。"

[[source.assets]]
path = "宋词/ci.db"
underlying_work = "permissive: 该仓库自建的 SQLite 产物"
license_class = "permissive"
shippable = false
note = "上游构建产物，本项目自行建库，不消费也不分发。"

[[source.assets]]
path = "五代诗词/huajianji/*.json"
underlying_work = "public-domain: 花间集 + UNVERIFIED 现代注释（notes 字段）"
license_class = "unverified"
shippable = false
note = "实测 huajianji-1-juan.json 50 条中 48 条 notes 非空，内容是现代白话注释（「小山：女子画眉的式样之一」），撰者不明。若日后只取正文、显式丢弃 notes，可另立一条 public_domain 资产。"

