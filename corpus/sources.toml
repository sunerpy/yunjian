[[source]]
name = "charlesix59/chinese_word_rhyme"
url = "https://github.com/charlesix59/chinese_word_rhyme"
git_rev = "ff0e9c13fb037c43e0eaa5dc929c0fe4fa2ffb18"
license = "MIT"
license_url = "https://raw.githubusercontent.com/charlesix59/chinese_word_rhyme/ff0e9c13fb037c43e0eaa5dc929c0fe4fa2ffb18/LICENSE"
license_sha256 = "e1464036d0f0ca738de9ebcb697b8faaf6dc2eafd193dc98555f23b409e87599"
license_file = "corpus/licenses/charlesix59-chinese_word_rhyme.LICENSE"
retrieved_at = "2026-08-10"
usage = "rhyme"
note = """
韵书来源。仓库自带 `crawler/` 目录，抓取脚本 getTunes.py / getCilin.py 指向
sou-yun.cn，所以「哪些文件是自有整理、哪些是抓来的」必须逐文件判定。
平水韵与词林正韵的 韵部/声部 嵌套顺序相反（实测：平水韵为 声部 -> 韵部，
词林正韵为 部 -> 声），todo 15 必须按 rhyme_book 分别处理。
"""

[[source.assets]]
path = "data/Pingshui_Rhyme.json"
underlying_work = "public-domain: 平水韵（前现代韵书）"
license_class = "public_domain"
shippable = true
note = "5 个声部键（上声部/上平声部/下平声部/…），10671 个字条。嵌套为 声部 -> 韵部 -> [字]。"

[[source.assets]]
path = "data/Cilin_Rhyme.json"
underlying_work = "public-domain: 词林正韵（清 戈载，1821）"
license_class = "public_domain"
shippable = true
note = "19 部，5575 个字条。嵌套为 部 -> 声 -> [字]，与平水韵相反。"

[[source.assets]]
path = "data/Word_Tune.json"
underlying_work = "permissive: 由平水韵派生的逐字平仄表"
license_class = "permissive"
shippable = true
note = "8232 个字 -> 平/仄。"

[[source.assets]]
path = "data/Ci_Word_Tune.json"
underlying_work = "permissive: 由词林正韵派生的逐字平仄表"
license_class = "permissive"
shippable = true
note = "5037 个字条、10074 个标量叶子。"

[[source.assets]]
path = "data/Xinyun_Rhyme.json"
underlying_work = "unverified: 中华新韵（2005 年现代出版物）"
license_class = "unverified"
shippable = false
note = "14 部、7693 字条。仓库的 MIT 无法为 2005 年出版物授权。todo 15 保留 rhyme_book = xinyun 槽位并返回 RhymeBookUnavailable。"

[[source.assets]]
