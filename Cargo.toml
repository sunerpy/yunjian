[workspace]
resolver = "3"
members = [
  "crates/yunjian-core",
  "crates/yunjian-corpus",
  "crates/yunjian-ai",
  "crates/yunjian-recite",
  "crates/yunjian-voice",
  "crates/yunjian-mcp",
  "crates/yunjian-cli",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sunerpy/yunjian"
authors = ["sunerpy <nkuzhangshn@gmail.com>"]

# 所有第三方版本集中在此处声明，成员 crate 一律以 `workspace = true` 引用。
# 版本字符串由方案研究结论固定，不得擅自升降。
[workspace.dependencies]
# MCP 协议：3.x 无 SSE 传输，且一个月内发生过 major 变更，故精确锁定。
rmcp = "=3.1.2"
# `bundled` 不是默认特性，且不可移除：系统 SQLite 可能早于 FTS5 trigram 分词器（3.34.0）。
rusqlite = { version = "0.40", features = ["bundled"] }
fsrs = "6.6"
keyring-core = "1.0"
genai = "0.6"
rodio = { version = "0.22", features = ["recording"] }
cpal = "0.18"
ferrous-opencc = "0.4"
pinyin = "0.11"
inputx-phonetic-edit = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
  "local-time",
] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
# 配置发现需要平台配置/数据目录（XDG、macOS、Windows 各不相同）。
dirs = "6"
# 仅用于测试：把结构体序列化成 JSON 后检查字段名，守住「配置里不得出现密钥字段」。
serde_json = "1"
blake3 = "1"
secrecy = "0.10"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
