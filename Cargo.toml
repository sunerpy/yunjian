[workspace]
resolver = "3"
members = [
  "crates/yunjian-core",
  "crates/yunjian-corpus",
  "crates/yunjian-ai",
  "crates/yunjian-recite",
  "crates/yunjian-voice",
  "crates/yunjian-mcp",
  "crates/yunjian-cli",
  "crates/yunjian-app",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/sunerpy/yunjian"
authors = ["sunerpy <nkuzhangshn@gmail.com>"]

# 所有第三方版本集中在此处声明，成员 crate 一律以 `workspace = true` 引用。
# 版本字符串由方案研究结论固定，不得擅自升降。
[workspace.dependencies]
# MCP 协议：3.x 无 SSE 传输，且一个月内发生过 major 变更，故精确锁定。
rmcp = "=3.1.2"
# `bundled` 不是默认特性，且不可移除：系统 SQLite 可能早于 FTS5 trigram 分词器（3.34.0）。
rusqlite = { version = "0.40", features = ["bundled"] }
fsrs = "6.6"
# 凭据存储。**刻意只依赖 `keyring-core` 加逐平台 store，绝不依赖 `keyring` 门面 crate**：
# keyring 4.x 自己的文档写明应用「should not be linking to this library at all」，它存在
# 的意义是替旧版本使用者做迁移。门面会把五个平台的 store 一次性拖进依赖树，也就把
# Linux 上的 D-Bus 栈塞进 Windows 构建里。
keyring-core = "1.0"
# Linux 首选：Secret Service（GNOME Keyring / KWallet）。需要 D-Bus 会话**和**一个真实
# 的 secrets 守护进程，两者在 CI、容器与纯 SSH 会话里都不存在，因此它是「首选」而非
# 「必然」——`Store::new()` 失败是预期路径，不是异常。
# `crypto-rust` 不是默认特性且必须显式选一个：不选任何 crypto 后端会编译失败。选 rust
# 而非 openssl 是为了不引入 C 依赖。
zbus-secret-service-keyring-store = { version = "1.0", default-features = false, features = [
  "crypto-rust",
] }
# Linux 兜底：内核 keyutils。上游文档称其在无头 Linux 上「strongly recommended」，因为
# 它属于内核、总是可用；代价是**纯内存、重启即失效**，上游明确要求调用方
# 「prepare for `Entry::get_password` to fail」。这条正是 `StorageReport.persistence`
# 必须存在的理由：它和 Secret Service 都是「钥匙串」，但持久性根本不同。
linux-keyutils-keyring-store = "1.0"
# macOS 与 iOS 共用一个 crate，但特性不同、且必须显式选：macOS 用 `keychain`
# （legacy keychain，对所有应用可用、不需要 provisioning profile），iOS 只有
# `protected` 一个 store 且该特性是强制的（不开会 `compile_error!`）。
apple-native-keyring-store = { version = "1.0", default-features = false }
windows-native-keyring-store = "1.1"
# Android。必须先由宿主应用初始化 `ndk-context` 的 application context 才能建 store。
# 默认特性即新的命名 store（`by_store`）；`legacy`（`by_service`）刻意不开：上游标记
# 其为 deprecated，且它删完凭据后仍留下密钥。
android-native-keyring-store = { version = "1.0", default-features = false }
# 多供应商 LLM 客户端。**只锁 0.6.x**：0.7 仍是 beta。刻意不引入 `rig-core`
# （agent 框架，为一次 chat 调用背一整套编排）与 `llm-chain`（2023 年起停更）。
#
# `default-features = false` + 显式 `rustls-tls` 是刻意的：genai 自己的 `lib.rs` 有一条
# `compile_error!` 守卫——`native-tls` 与 `rustls-tls` 互斥，而 `rustls-tls` 在默认特性集
# 里。写死 rustls 一方面免掉 OpenSSL 这个 C 依赖，另一方面把「将来谁想换 native-tls」
# 逼成一次显式改动而不是静默的特性合并。
genai = { version = "0.6", default-features = false, features = ["rustls-tls"] }
# 异步运行时。genai 内部即依赖它（`rt-multi-thread` + `macros`），此处显式声明是因为
# `yunjian-ai` 的测试要自己驱动 `exec_chat` 的 future，并在同一个 reactor 上跑本地
# mock HTTP 端点——间接依赖不会把 `#[tokio::test]` 宏带进来。
#
# 库代码本身不需要运行时：`AppreciationProvider` 只是 `async fn`，长任务走
# `yunjian-core::operation` 的 OS 线程。因此它只出现在 `[dev-dependencies]`。
tokio = { version = "1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "time",
] }
# 麦克风采集。`default-features = false` 是刻意的：默认特性会拖进 symphonia 的整套
# 解码器（flac/mp3/mp4/vorbis），而采集路径一个都不需要。`recording` 提供
# `rodio::microphone`，`playback` 提供 `rodio::cpal` 重导出——两者都要，因为设备
# 枚举与 `cpal::StreamError` 都在那条通路上。
#
# **`cpal` 刻意不作为直接依赖。** 方案原本固定 `cpal = "0.18"`，实测它解析到 0.18.1 而
# `rodio 0.22.2` 内部用 0.17.3，两份 `cpal::Device` 是不同类型，跨边界传参会报出
# 只有版本注记区别的 `expected cpal::Device, found cpal::Device`。**实测两个版本的
# 平台底线完全一致**（都声明 `ndk` 的 `api-level-26`，都在 macOS 后端无条件引用
# 14.2 才有的 `AudioHardwareCreateProcessTap`/`CATapDescription`），因此版本选择不影响
# 任何一条产品要求，纯按类型兼容性决定：只用 `rodio` 重导出的那一份。详见
# `docs/PLATFORM-REQUIREMENTS.zh.md`。
rodio = { version = "0.22", default-features = false, features = ["recording", "playback"] }
# 离线 ASR/TTS。第三方绑定 `sherpa-rs`（MIT）+ 其 `sherpa-rs-sys`（MIT）按 `dist.json`
# 下载 k2-fsa/sherpa-onnx 官方预编译产物（Apache-2.0，内含 onnxruntime，MIT）。
# 精确锁定：`sherpa-rs-sys` 的 `dist.json` 把 sherpa-onnx 版本写死在 crate 版本里，
# 放宽版本号等于放宽原生产物版本。详见 `docs/VOICE-BUILD.zh.md`。
# `sys` 不是默认特性，但没它就拿不到 `sherpa_rs_sys` 的重导出，也就无法调用
# `SherpaOnnxGetVersionStr`——那是唯一不需要模型即可证明原生库已链接的入口。
sherpa-rs = { version = "=0.6.8", default-features = false, features = [
  "download-binaries",
  "tts",
  "sys",
] }
# WAV 读写。`sherpa_rs::read_audio_file` 硬断言 16 kHz，读不了它自己 TTS 出的 24 kHz
# 音频，因此任何回读路径都必须绕开它。版本与 `sherpa-rs` 内部所用一致，避免重复编译。
hound = "3.5"
ferrous-opencc = "0.4"
pinyin = "0.11"
inputx-phonetic-edit = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "local-time"] }
tracing-appender = "0.2"
# 时间戳格式化：`tracing-subscriber` 的 `OffsetTime` 需要 `time` 的 `UtcOffset` 与
# `Rfc3339`。显式声明特性而不依赖 `tracing-subscriber` 的特性合并，否则上游改动
# 特性组合就会让时间戳静默变形。
time = { version = "0.3", features = ["formatting", "local-offset"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
async-trait = "=0.1.89"
# 配置发现需要平台配置/数据目录（XDG、macOS、Windows 各不相同）。
dirs = "6"
# 仅用于测试：把结构体序列化成 JSON 后检查字段名，守住「配置里不得出现密钥字段」。
serde_json = "1"
blake3 = "1"
secrecy = "0.10"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
# 仅 CLI 的集成测试使用：把构建产物当作子进程跑起来。二进制的三条契约
# （stdout 只有结果、stderr 只有日志、退出码 0/1/2/3）在进程内测不出来——libtest 自己
# 就往 stdout 打统计行，而退出码只在真的 `exit()` 之后才存在。
# 刻意不开 `color`（它不是默认特性）：失败诊断要被 `tee` 进证据日志，ANSI 转义序列
# 会让那份日志变成乱码。
assert_cmd = "2.2"
# 上游 LICENSE 摘要。清单里的字段名是 `license_sha256`，必须真的是 SHA-256：
# 换成 blake3 就无法与 `sha256sum`、GitHub 侧的摘要互相核对。
sha2 = "0.11"
# 仅 `xtask` 使用（`publish = false`，永不进入产物）：按锁定 revision 抓取上游 LICENSE。
ureq = "3"
# 随包语料工件以 gzip 分发（todo 21）。`corpus-measure` 必须用与打包**同一个**压缩
# 实现来量压缩后体积，否则量出来的数不是将来真正发出去的那个数；调用系统 `gzip`
# 会把这个数变成宿主机工具版本的函数。
flate2 = "1"
# 统计基准框架。精确锁定，避免基准输出格式和采样默认值随次版本漂移。
criterion = "=0.8.2"
# 桌面外壳。**只固定次版本线**：`tauri` 与 `tauri-build` 的补丁号必须同步演进
# （`tauri-build` 内部依赖 `tauri-utils`，两侧配置结构体不同版会报出
# `unknown field` 这种看不出根因的错误，`tauri-build` 自己的诊断里甚至专门为它写了
# 一段「CLI 比 tauri-build 新」的提示）。因此二者一起升，不单独放宽任何一侧。
#
# 刻意**不**引入 `tauri-plugin-log`：日志走 `yunjian_core::init_logger`，
# 命令行、MCP stdio 服务端与桌面 GUI 共用同一份级别解析、脱敏与滚动文件布局，
# 控制台一律写 stderr。插件会带来第二套格式与第二套过滤语义。
#
# 这里**保留默认特性**，与本文件其余条目的做法相反。理由是具体的：默认集
# （`wry` / `compression` / `common-controls-v6` / `dynamic-acl` / `x11` / `dbus`）是上游
# 唯一按组合测试过的那一套，逐项裁剪属于体积优化，而体积优化必须先量再做——目前没有
# 任何测量支持裁掉其中哪一项，凭直觉关掉 `dbus` 或 `x11` 会在某个 Linux 桌面环境上
# 变成运行期缺陷而不是编译错误。
tauri = { version = "2.11" }
tauri-build = { version = "2.6" }

# 工作区级 lint 门禁。每个成员以 `[lints] workspace = true` 引用，没有例外。
#
# 禁令的作用域是**整个工作区**，不是 `yunjian-mcp` 一个 crate：`yunjian-core` 里的
# 一句 `println!` 被 MCP 工具处理函数调到，对协议流的破坏与写在 MCP crate 里完全
# 等价，而「MCP 代码路径」不是 lint 能表达的概念。因此机制是全局 deny + 一处豁免，
# 而不是靠 code review 记得住。
[workspace.lints.clippy]
# stdout 属于 MCP stdio 协议流。一行杂音就让会话解析失败，所以是 deny 而非 warn。
print_stdout = "deny"
# 调试残留同样写 stdout，且几乎总是误留下来的。
dbg_macro = "deny"
# stderr 是日志与诊断的正当出口（`init_logger` 的控制台层就写这里），所以只警告：
# 目的是把诊断逼进 `tracing`，而不是禁止一切 stderr 写入。
print_stderr = "warn"

[workspace.lints.rust]
# 本项目没有需要 `unsafe` 的场景；真要用就必须显式 `#[allow]` 并写清理由。
# 不设成 deny 是因为宏展开偶尔会命中它，届时按点豁免比放宽全局门禁更可控。
unsafe_code = "warn"
