# 黄金查询契约的自包含 fixture 语料。
#
# 存在的理由：`../queries.toml` 里每条契约都用 `expect_top_id` 锚定到本文件里的一首诗，
# 因此契约在真实语料（todo 11/12）落地之前就可以运行和自检。没有这层锚定，契约就只是
# 一串没人能验证的字符串。
#
# 全部为公有领域文本（唐宋诗词），逐字校对，**不含任何第三方现代注释、译文或赏析**——
# 这是 decisions.md 第 1 条「版权墙就是架构」的直接体现。
#
# 字段语义：
#   stable_id    本文件内唯一。`fixture:` 前缀是刻意的：它宣告这不是真实语料的
#                `stable_id`（真实的由 todo 10 从 source_locator 铸造），避免两套 id 混淆。
#   title        题目。词作写成「词牌·题目」的合成形式，与上游 `rhythmic` 的实际形态一致。
#   ci_tune      词牌。诗为空字符串。
#   body         规范简体正文，含标点。索引与子串检索都针对这一列（todo 19）。
#   first_line   首句（不含句末标点），对应 todo 17 预计算的 `first_line` 列。
#   last_chars   逐句末字，对应 todo 17 预计算的 `last_chars`；尾字检索（todo 26）用它。
#   rhyme_book / rhyme_group
#                仅在编者有把握时填写；把不确定的韵部留空，而不是编一个出来。
#                空字符串表示「本 fixture 不参与韵部检索断言」。
#   tags         主题标签，取自 todo 27 的策展词表方向；此处是测试用的极小子集。
#
# **todo 22 如何把 fixture 对应到真实语料**：按 `(author, title)` 二元组解析。
# 真实语料里同一首诗的 `stable_id` 与此处不同，但作者 + 题目是稳定的匹配键。
# 因此 `expect_min_hits` 被刻意定义为**下界**：语料变大只会让命中数上升，断言不会因此变脆。
#
# 本文件是契约的一部分，与 `queries.toml` 同为不可变契约。改动正文即等于改动契约，
# 必须同步 `queries.toml` 并在 PR 里说明理由。

schema_version = 1

# 测试用的极小 繁简 / 异体 映射表。
#
# 它**不是** todo 13 的真实 `variant_map`（那张表由 `ferrous-opencc` 在构建期生成，
# 覆盖上万字）。此处只收契约里实际出现的字，用途是让契约的可满足性能够在没有语料的
# 情况下被证明：`normalize_query` 把繁体/异体输入映射到简体后，必须能在 `body` 里找到。
[[variant]]
from = "國"
to = "国"

[[variant]]
from = "舉"
to = "举"

[[variant]]
from = "頭"
to = "头"

[[variant]]
from = "鄉"
to = "乡"

[[variant]]
from = "側"
to = "侧"

# 峯 是 峰 的异体字（不是繁体），氷 是 冰 的异体字。两者与繁简同走一张映射表，
# 这正是 todo 24 `normalize_query` 的设计：调用方无需区分输入是繁体还是异体。
[[variant]]
from = "峯"
to = "峰"

[[variant]]
from = "氷"
to = "冰"

[[variant]]
from = "時"
to = "时"

[[variant]]
from = "關"
to = "关"

[[variant]]
from = "還"
to = "还"

[[poem]]
stable_id = "fixture:tang-libai-jingyesi"
title = "静夜思"
author = "李白"
dynasty = "唐"
ci_tune = ""
body = "床前明月光，疑是地上霜。举头望明月，低头思故乡。"
first_line = "床前明月光"
last_chars = ["光", "霜", "月", "乡"]
rhyme_book = "平水韵"
rhyme_group = "下平七阳"
tags = ["思乡", "月"]
note = "契约里被引用次数最多的锚：两字词、三字短语、整句五言、繁体输入、首句前缀、尾字、韵部、标签、纯标点与无三字连续段九类都指向它。"

