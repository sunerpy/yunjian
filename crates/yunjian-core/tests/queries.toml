class = "two_char_word"
expect_plan = "Ngram"
expect_top_id = "fixture:tang-libai-jingyesi"
expect_min_hits = 3
note = "整份契约里最重要的一条。两个字面字符推不出任何 trigram 约束，裸 LIKE 会扫全列；本条的 p95 就是辅助 n-gram 表是否值得存在的判据。"

