# 云笺黄金查询契约 —— 不可变契约文件
#
# 这份文件是检索能力的**验收基准**，也是「存储实现可替换」这句话唯一成立的依据：
# 只要下面每一条在新实现上仍然成立，底层从 SQLite 换成别的东西就不会静默降级用户体验。
#
# 消费方（不要在这些地方复制一份，它只有一处）：
#   todo 19  建 FTS5 索引后用它证明索引真的被用上
#   todo 22  语料 CI 作业逐条跑，任何一条结果变化而本文件未同步修改即失败
#   todo 24  查询归一与长度路由的行为基准（`expect_plan` 就是它 `plan_query` 的期望输出）
#   todo 25  全文与残句检索的召回基准
#   todo 43  本次去风险实测：三种 `detail` 模式各跑一遍完整契约，据此选定索引模式
#   F1       终态回归
#
# ## 字段语义
#
#   id                稳定标识，重命名等于换一条契约。`golden_queries.rs` 里每条 id
#                     对应一个 `#[test]`，因此 `--list` 的枚举数就是契约条数。
#   query             **用户原样输入的字符串**，不是归一化之后的。繁体、异体、标点、
#                     通配符都保留原形——归一化本身就是被测对象（todo 24）。
#   class             18 个类别之一，见下方「类别覆盖」。类别是覆盖度的度量单位：
#                     元测试断言 18 类一个不缺，所以后续无法悄悄删掉某一类。
#   expect_plan       期望的查询计划，取值 Ngram | Match | Like | Empty | FullScan | Meta。
#                     语义见下方「计划取值」。
#   expect_top_id     本条锚定的 fixture（见 `fixtures/poems.toml`）。它有两个作用：
#                     (1) 让契约在真实语料存在之前就可被证明「可满足」——元测试会检查
#                         归一化后的查询确实能在该 fixture 上命中；
#                     (2) 给排序实现（todo 25）一个具名的期望首位。
#                     注意：`expect_min_hits = 0` 的条目（纯标点）也保留锚，记录的是
#                     该输入的**来源**——它是从那首诗的标点里取的。检索期望完全由
#                     `expect_min_hits` 与 `expect_plan` 承载。
#   expect_min_hits   命中数**下界**，不是精确值。语料变大只会让它更容易满足，
#                     所以同一份契约既能跑 fixture 集，也能跑 85 万首的真实语料。
#   note              这一条为什么存在。不是描述，是理由。
#
# ## 计划取值（todo 24 的 `QueryPlan` 必须用这几个名字）
#
#   Ngram     归一化后字面长度 < 3。**必须**走辅助 n-gram 候选表再回表 LIKE 核对。
#             裸 `LIKE '%明月%'` 推不出任何 trigram 约束，会退化成整列扫描——
#             对最常见的查询形态而言这不是一个可接受的计划，所以此处是正确性要求。
#   Match     长度 == 3（恰好一个 trigram），或长度 > 3 且所选 detail 模式支持
#             phrase 查询。整句检索走这条。
#   Like      长度 > 3，走带 trigram 约束的索引 LIKE。
#   Empty     归一化后为空（例如纯标点）。返回空结果，不得报错，也不得扫全表。
#   FullScan  字面串里没有任何长度 >= 3 的非通配连续段，索引无从下手。
#             必须**显式标记**以便调用方提示用户，而不是静默耗掉几秒。
#   Meta      不经全文索引的元数据检索（题目 / 作者 / 词牌 / 首句 / 尾字 / 韵部 / 标签）。
#             走普通 B-tree 索引，由 todo 26、27 实现，**不得触碰 FTS 表**。
#
# ## 类别覆盖（18 类，元测试逐一断言）
#
#   two_char_word            两字词          明月 / 相思 / 春风
#   two_char_author          两字人名        李白 / 杜甫
#   three_char_phrase        三字短语
#   four_char_phrase         四字短语
#   whole_five_char_line     整句五言
#   whole_seven_char_line    整句七言
#   traditional_input        繁体输入
#   variant_char_input       异体字输入
#   rare_char                生僻字
#   title_lookup             题目
#   ci_tune_lookup           词牌
#   ci_tune_title_lookup     词牌·题目
#   first_line_prefix        首句前缀
#   last_char_lookup         尾字
#   rhyme_group_query        韵部
#   tag_query                标签
#   punctuation_only         纯标点          期望 Empty
#   no_three_char_run        无三字连续段    期望 FullScan
#
# ## 为什么两字查询是这份契约里最关键的部分
#
# FTS5 官方限制：**trigram 分词器下，长度不足 3 的子串匹配不到任何行**。而「明月」
# 「相思」「李白」正是用户最常输入的形态。这三条的非空结果就是那个陷阱的回归测试；
# 它们一旦变成 0 命中，说明路由被改坏了，而这种坏法在功能测试里完全看不出来。

schema_version = 1
fixture_file = "fixtures/poems.toml"

