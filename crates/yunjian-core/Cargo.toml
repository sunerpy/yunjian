[package]
name = "yunjian-core"
description = "云笺核心领域模型：配置、日志、错误类型与稳定标识"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
dirs = { workspace = true }
# 随包语料以 gzip 分发，落地要在本机解压。与打包端（xtask）用同一个实现，
# 否则「打包压出来的字节」与「运行期解得开的字节」是两个库的函数。
flate2 = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# 不再只是 dev 依赖：语料落地要读打包时写出的 `manifest.json` 才知道期望摘要。
serde_json = { workspace = true }
# 期望摘要是 SHA-256，必须真的是 SHA-256：换成 blake3 就无法与 `sha256sum`、
# 与工件旁的 `.sha256` 文件互相核对。
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "representative_queries"
harness = false

# 无 libtest 外壳：这条用例要断言子进程的 stdout 逐字节为空，而 libtest 自己就会往
# stdout 打印 "running 1 test" 与统计行，任何基于 libtest 的子进程都不可能满足该断言。
[[test]]
name = "logger_stdio"
harness = false

[lints]
workspace = true
