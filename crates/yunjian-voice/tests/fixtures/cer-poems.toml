[[poem]]
id = "五言律詩:王维:汉江临眺"
genre = "五言律詩"
title = "汉江临眺"
author = "王维"
body = "楚塞三湘接，荆门九派通。江流天地外，山色有无中。郡邑浮前浦，波澜动远空。襄阳好风日，留醉与山翁。"
reference = "楚塞三湘接荆门九派通江流天地外山色有无中郡邑浮前浦波澜动远空襄阳好风日留醉与山翁"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "五言律詩:王维:终南别业"
genre = "五言律詩"
title = "终南别业"
author = "王维"
body = "中岁颇好道，晚家南山陲。兴来每独往，胜事空自知。行到水穷处，坐看云起时。偶然值林叟，谈笑无还期。"
reference = "中岁颇好道晚家南山陲兴来每独往胜事空自知行到水穷处坐看云起时偶然值林叟谈笑无还期"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "五言律詩:王维:终南山"
genre = "五言律詩"
title = "终南山"
author = "王维"
body = "太乙近天都，连山接海隅。白云回望合，青霭入看无。分野中峰变，阴晴众壑殊。欲投人处宿，隔水问樵夫。"
reference = "太乙近天都连山接海隅白云回望合青霭入看无分野中峰变阴晴众壑殊欲投人处宿隔水问樵夫"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "五言律詩:王维:酬张少府"
genre = "五言律詩"
title = "酬张少府"
author = "王维"
body = "晚年唯好静，万事不关心。自顾无长策，空知返旧林。松风吹解带，山月照弹琴。君问穷通理，渔歌入浦深。"
reference = "晚年唯好静万事不关心自顾无长策空知返旧林松风吹解带山月照弹琴君问穷通理渔歌入浦深"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "五言律詩:王维:过香积寺"
genre = "五言律詩"
title = "过香积寺"
author = "王维"
body = "不知香积寺，数里入云峰。古木无人径，深山何处钟。泉声咽危石，日色冷青松。薄暮空潭曲，安禅制毒龙。"
reference = "不知香积寺数里入云峰古木无人径深山何处钟泉声咽危石日色冷青松薄暮空潭曲安禅制毒龙"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "五言律詩:王维:辋川闲居赠裴秀才迪"
genre = "五言律詩"
title = "辋川闲居赠裴秀才迪"
author = "王维"
body = "寒山转苍翠，秋水日潺湲。倚杖柴门外，临风听暮蝉。渡头余落日，墟里上孤烟。复值接舆醉，狂歌五柳前。"
reference = "寒山转苍翠秋水日潺湲倚杖柴门外临风听暮蝉渡头余落日墟里上孤烟复值接舆醉狂歌五柳前"
source_path = "蒙学/tangshisanbaishou.json"
