[[poem]]
id = "七言律詩:元稹:遣悲怀三首·其一"
genre = "七言律詩"
title = "遣悲怀三首·其一"
author = "元稹"
body = "谢公最小偏怜女，自嫁黔娄百事乖。顾我无衣搜荩箧，泥他沽酒拔金钗。野蔬充膳甘长藿，落叶添薪仰古槐。今日俸钱过十万，与君营奠复营斋。"
reference = "谢公最小偏怜女自嫁黔娄百事乖顾我无衣搜荩箧泥他沽酒拔金钗野蔬充膳甘长藿落叶添薪仰古槐今日俸钱过十万与君营奠复营斋"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "七言律詩:元稹:遣悲怀三首·其二"
genre = "七言律詩"
title = "遣悲怀三首·其二"
author = "元稹"
body = "昔日戏言身后事，今朝都到眼前来。衣裳已施行看尽，针线犹存未忍开。尚想旧情怜婢仆，也曾因梦送钱财。诚知此恨人人有，贫贱夫妻百事哀。"
reference = "昔日戏言身后事今朝都到眼前来衣裳已施行看尽针线犹存未忍开尚想旧情怜婢仆也曾因梦送钱财诚知此恨人人有贫贱夫妻百事哀"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "七言律詩:元稹:遣悲怀三首·其三"
genre = "七言律詩"
title = "遣悲怀三首·其三"
author = "元稹"
body = "闲坐悲君亦自悲，百年都是几多时。邓攸无子寻知命，潘岳悼亡犹费词。同穴窅冥何所望，他生缘会更难期。惟将终夜常开眼，报答平生未展眉。"
reference = "闲坐悲君亦自悲百年都是几多时邓攸无子寻知命潘岳悼亡犹费词同穴窅冥何所望他生缘会更难期惟将终夜常开眼报答平生未展眉"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "七言律詩:王维:赠郭给事"
genre = "七言律詩"
title = "赠郭给事"
author = "王维"
body = "洞门高阁霭余辉，桃李阴阴柳絮飞。禁里疏钟官舍晚，省中啼鸟吏人稀。晨摇玉佩趋金殿，夕奉天书拜琐闱。强欲从君无那老，将因卧病解朝衣。"
reference = "洞门高阁霭余辉桃李阴阴柳絮飞禁里疏钟官舍晚省中啼鸟吏人稀晨摇玉佩趋金殿夕奉天书拜琐闱强欲从君无那老将因卧病解朝衣"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "七言律詩:王维:和贾至舍人早朝大明宫"
genre = "七言律詩"
title = "和贾至舍人早朝大明宫"
author = "王维"
body = "绛帻鸡人送晓筹，尚衣方进翠云裘。九天阊阖开宫殿，万国衣冠拜冕旒。日色才临仙掌动，香烟欲傍衮龙浮。朝罢须裁五色诏，佩声归向凤池头。"
reference = "绛帻鸡人送晓筹尚衣方进翠云裘九天阊阖开宫殿万国衣冠拜冕旒日色才临仙掌动香烟欲傍衮龙浮朝罢须裁五色诏佩声归向凤池头"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "七言律詩:王维:奉和圣制从蓬莱向兴庆阁道"
genre = "七言律詩"
title = "奉和圣制从蓬莱向兴庆阁道"
author = "王维"
body = "渭水自萦秦塞曲，黄山旧绕汉宫斜。銮舆迥出千门柳，阁道回看上苑花。云里帝城双凤阙，雨中春树万人家。为乘阳气行时令，不是宸游玩物华。"
reference = "渭水自萦秦塞曲黄山旧绕汉宫斜銮舆迥出千门柳阁道回看上苑花云里帝城双凤阙雨中春树万人家为乘阳气行时令不是宸游玩物华"
