[[poem]]
id = "五言律詩:王维:送梓州李使君"
genre = "五言律詩"
title = "送梓州李使君"
author = "王维"
body = "万壑树参天，千山响杜鹃。山中一夜雨，树杪百重泉。汉女输橦布，巴人讼芋田。文翁翻教授，不敢倚先贤。"
reference = "万壑树参天千山响杜鹃山中一夜雨树杪百重泉汉女输橦布巴人讼芋田文翁翻教授不敢倚先贤"
source_path = "蒙学/tangshisanbaishou.json"
