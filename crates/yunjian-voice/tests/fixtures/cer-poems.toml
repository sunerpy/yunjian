[[poem]]
id = "五言律詩:王勃:送杜少府之任蜀州"
genre = "五言律詩"
title = "送杜少府之任蜀州"
author = "王勃"
body = "城阙辅三秦，风烟望五津。与君离别意，同是宦游人。海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。"
reference = "城阙辅三秦风烟望五津与君离别意同是宦游人海内存知己天涯若比邻无为在歧路儿女共沾巾"
source_path = "蒙学/tangshisanbaishou.json"
