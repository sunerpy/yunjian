[[poem]]
id = "七言律詩:王维:积雨辋川庄作"
genre = "七言律詩"
title = "积雨辋川庄作"
author = "王维"
body = "积雨空林烟火迟，蒸藜炊黍饷东菑。漠漠水田飞白鹭，阴阴夏木啭黄鹂。山中习静观朝槿，松下清斋折露葵。野老与人争席罢，海鸥何事更相疑。"
reference = "积雨空林烟火迟蒸藜炊黍饷东菑漠漠水田飞白鹭阴阴夏木啭黄鹂山中习静观朝槿松下清斋折露葵野老与人争席罢海鸥何事更相疑"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "七言律詩:白居易:望月有感"
genre = "七言律詩"
title = "望月有感"
author = "白居易"
body = "时难年荒世业空，弟兄羁旅各西东。田园寥落干戈后，骨肉流离道路中。吊影分为千里雁，辞根散作九秋蓬。共看明月应垂泪，一夜乡心五处同。"
reference = "时难年荒世业空弟兄羁旅各西东田园寥落干戈后骨肉流离道路中吊影分为千里雁辞根散作九秋蓬共看明月应垂泪一夜乡心五处同"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "五言古詩:元结:贼退示官吏"
genre = "五言古詩"
title = "贼退示官吏"
author = "元结"
body = "昔岁逢太平，山林二十年。泉源在庭户，洞壑当门前。井税有常期，日晏犹得眠。忽然遭世变，数岁亲戎旃。今来典斯郡，山夷又纷然。城小贼不屠，人贫伤可怜。"
reference = "昔岁逢太平山林二十年泉源在庭户洞壑当门前井税有常期日晏犹得眠忽然遭世变数岁亲戎旃今来典斯郡山夷又纷然城小贼不屠人贫伤可怜"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = true

[[poem]]
id = "五言古詩:王昌龄:同从弟销南斋玩月忆山阴"
genre = "五言古詩"
title = "同从弟销南斋玩月忆山阴"
author = "王昌龄"
body = "高卧南斋时，开帷月初吐。清辉澹水木，演漾在窗户。冉冉几盈虚，澄澄变今古。美人清江畔，是夜越吟苦。千里共如何，微风吹兰杜。"
reference = "高卧南斋时开帷月初吐清辉澹水木演漾在窗户冉冉几盈虚澄澄变今古美人清江畔是夜越吟苦千里共如何微风吹兰杜"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "五言古詩:王维:渭川田家"
genre = "五言古詩"
title = "渭川田家"
author = "王维"
body = "斜阳照墟落，穷巷牛羊归。野老念牧童，倚杖候荆扉。雉雊麦苗秀，蚕眠桑叶稀。田夫荷锄至，相见语依依。即此羡闲逸，怅然吟式微。"
reference = "斜阳照墟落穷巷牛羊归野老念牧童倚杖候荆扉雉雊麦苗秀蚕眠桑叶稀田夫荷锄至相见语依依即此羡闲逸怅然吟式微"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "五言古詩:王维:西施咏"
genre = "五言古詩"
title = "西施咏"
author = "王维"
body = "艳色天下重，西施宁久微。朝为越溪女，暮作吴宫妃。贱日岂殊众，贵来方悟稀。邀人傅香粉，不自著罗衣。君宠益娇态，君怜无是非。当时浣纱伴，莫得同车归。"
reference = "艳色天下重西施宁久微朝为越溪女暮作吴宫妃贱日岂殊众贵来方悟稀邀人傅香粉不自著罗衣君宠益娇态君怜无是非当时浣纱伴莫得同车归"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = true

[[poem]]
id = "五言古詩:王维:送别"
genre = "五言古詩"
title = "送别"
author = "王维"
body = "下马饮君酒，问君何所之？君言不得意，归卧南山陲。但去莫复问，白云无尽时。"
reference = "下马饮君酒问君何所之君言不得意归卧南山陲但去莫复问白云无尽时"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "七言古詩:元结:石鱼湖上醉歌"
genre = "七言古詩"
title = "石鱼湖上醉歌"
author = "元结"
body = "石鱼湖，似洞庭，夏水欲满君山青。山为樽，水为沼，酒徒历历坐洲岛。长风连日作大浪，不能废人运酒舫。我持长瓢坐巴丘，酌饮四坐以散愁。"
reference = "石鱼湖似洞庭夏水欲满君山青山为樽水为沼酒徒历历坐洲岛长风连日作大浪不能废人运酒舫我持长瓢坐巴丘酌饮四坐以散愁"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "七言古詩:白居易:长恨歌"
genre = "七言古詩"
title = "长恨歌"
author = "白居易"
body = "汉皇重色思倾国，御宇多年求不得。杨家有女初长成，养在深闺人未识。天生丽质难自弃，一朝选在君王侧。回眸一笑百媚生，六宫粉黛无颜色。"
reference = "汉皇重色思倾国御宇多年求不得杨家有女初长成养在深闺人未识天生丽质难自弃一朝选在君王侧回眸一笑百媚生六宫粉黛无颜色"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = true

[[poem]]
id = "七言古詩:白居易:琵琶行"
genre = "七言古詩"
title = "琵琶行"
author = "白居易"
body = "浔阳江头夜送客，枫叶荻花秋瑟瑟。主人下马客在船，举酒欲饮无管弦。醉不成欢惨将别，别时茫茫江浸月。忽闻水上琵琶声，主人忘归客不发。"
reference = "浔阳江头夜送客枫叶荻花秋瑟瑟主人下马客在船举酒欲饮无管弦醉不成欢惨将别别时茫茫江浸月忽闻水上琵琶声主人忘归客不发"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = true

[[poem]]
id = "樂府:王之涣:凉州词"
genre = "樂府"
title = "凉州词"
author = "王之涣"
body = "黄河远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关。"
reference = "黄河远上白云间一片孤城万仞山羌笛何须怨杨柳春风不度玉门关"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "樂府:王昌龄:出塞·秦时明月汉时关"
genre = "樂府"
title = "出塞·秦时明月汉时关"
author = "王昌龄"
body = "秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。"
reference = "秦时明月汉时关万里长征人未还但使龙城飞将在不教胡马度阴山"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "樂府:王昌龄:塞上曲·蝉鸣空桑林"
genre = "樂府"
title = "塞上曲·蝉鸣空桑林"
author = "王昌龄"
body = "蝉鸣空桑林，八月萧关道。出塞入塞寒，处处黄芦草。从来幽并客，皆共尘沙老。莫学游侠儿，矜夸紫骝好。"
reference = "蝉鸣空桑林八月萧关道出塞入塞寒处处黄芦草从来幽并客皆共尘沙老莫学游侠儿矜夸紫骝好"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "樂府:王昌龄:塞下曲·饮马渡秋水"
genre = "樂府"
title = "塞下曲·饮马渡秋水"
author = "王昌龄"
body = "饮马渡秋水，水寒风似刀。平沙日未没，黯黯见临洮。昔日长城战，咸言意气高。黄尘足今古，白骨乱蓬蒿。"
reference = "饮马渡秋水水寒风似刀平沙日未没黯黯见临洮昔日长城战咸言意气高黄尘足今古白骨乱蓬蒿"
source_path = "蒙学/tangshisanbaishou.json"
excerpt = false

[[poem]]
id = "词:纳兰性德:长相思·山一程"
genre = "词"
title = "长相思·山一程"
author = "纳兰性德"
body = "山一程，水一程，身向榆关那畔行，夜深千帐灯风一更，雪一更，聒碎乡心梦不成，故园无此声"
reference = "山一程水一程身向榆关那畔行夜深千帐灯风一更雪一更聒碎乡心梦不成故园无此声"
source_path = "纳兰性德/纳兰性德诗集.json"
excerpt = false

[[poem]]
id = "词:纳兰性德:木兰花令·拟古决绝词"
genre = "词"
title = "木兰花令·拟古决绝词"
author = "纳兰性德"
body = "人生若只如初见，何事秋风悲画扇等闲变却故人心，却道故心人易变骊山语罢清宵半，泪雨霖铃终不怨何如薄幸锦衣郎，比翼连枝当日愿"
reference = "人生若只如初见何事秋风悲画扇等闲变却故人心却道故心人易变骊山语罢清宵半泪雨霖铃终不怨何如薄幸锦衣郎比翼连枝当日愿"
source_path = "纳兰性德/纳兰性德诗集.json"
excerpt = false

[[poem]]
id = "词:纳兰性德:点绛唇·咏风兰"
genre = "词"
title = "点绛唇·咏风兰"
author = "纳兰性德"
body = "别样幽芬，更无浓艳催开处凌波欲去，且为东风住忒煞萧疏，争奈秋如许还留取，冷香半缕，第一湘江雨"
reference = "别样幽芬更无浓艳催开处凌波欲去且为东风住忒煞萧疏争奈秋如许还留取冷香半缕第一湘江雨"
source_path = "纳兰性德/纳兰性德诗集.json"
excerpt = false

[[poem]]
id = "词:纳兰性德:画堂春·一生一代一双人"
genre = "词"
title = "画堂春·一生一代一双人"
author = "纳兰性德"
body = "一生一代一双人，争教两处销魂相思相望不相亲，天为谁春浆向蓝桥易乞，药成碧海难奔若容相访饮牛津，相对忘贫"
reference = "一生一代一双人争教两处销魂相思相望不相亲天为谁春浆向蓝桥易乞药成碧海难奔若容相访饮牛津相对忘贫"
source_path = "纳兰性德/纳兰性德诗集.json"
excerpt = false
