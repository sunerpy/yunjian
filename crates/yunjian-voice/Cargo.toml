[package]
name = "yunjian-voice"
description = "云笺语音：按音步合成、静音拼接节奏控制与录音采集"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[features]
default = []
# 采集。只拉 `rodio`（MIT/Apache-2.0），不碰 sherpa-onnx，因此这一条不触发 GPL-3.0。
capture = ["dep:rodio"]
# 模型按需下载。只拉 HTTP 客户端与解压库（均 MIT/Apache-2.0），不碰 sherpa-onnx。
# **刻意不进 `default`**：默认构建里 `models` 的判定层照样完整可用（许可门禁、摘要校验、
# 原子落地、缺失降级），缺的只有「真的去下载」这一件事，而那一件事需要联网。
download = ["dep:ureq", "dep:tar", "dep:bzip2"]
# 原生推理。隐含 `capture` 与 `download`：识别没有输入源、没有权重都没有意义。
voice = ["dep:sherpa-rs", "capture", "download"]

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
# 流式识别的事件流走 `yunjian-core::operation`，与语料派生、AI 流式共用同一份取消与
# 背压语义；自造一个 sink 只会多一套语义。
yunjian-core = { path = "../yunjian-core" }
# 偏置一路复用背诵内核里的 `BiasedHyp`，而不是在这里另造一个同名类型：那个类型已经被
# `crates/yunjian-recite/tests/ui/biased_hyp_cannot_be_scored.rs` 守住「不得进入打字
# 评分」，复用它等于让那道现成的门禁直接看住生产路径。
yunjian-recite = { path = "../yunjian-recite" }
# 注音层的通用候选来源。破读词表只覆盖 22 首名册，表外的字要靠它给出候选；
# 两者的强弱差别由 `annotate::Reading` 在类型上分开，不靠调用点自觉。
pinyin.workspace = true
bzip2 = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }
sherpa-rs = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
hound.workspace = true
serde_json.workspace = true
trybuild.workspace = true

[lints]
workspace = true

# `required-features` 是必需的，不是整洁：默认构建（`cargo test --workspace`）不开
# `capture`，而这三个目标都用 `yunjian_voice::capture`。不声明的话默认构建直接编译失败。
[[test]]
name = "capture"
required-features = ["capture"]

# 双路流式解码的真实推理。默认构建里 `recognize` 的判定层照样完整可测（类型隔离、
# 卡顿时序、ITN 取值、降级策略），缺的只有「真的跑推理」与 RTF 实测这两件。
[[test]]
name = "streaming"
required-features = ["voice"]

[[example]]
name = "capture_probe"
required-features = ["capture"]

[[example]]
name = "denied_permission"
required-features = ["capture"]
