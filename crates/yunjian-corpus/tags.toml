title = "蜀道难"
add = ["山水", "蜀"]
reason = "正文专名「蜀道」同时满足山水与蜀两条规则，此处钉住生僻字类的那个锚。"

[[reviewed]]
author = "王安石"
title = "元日"
add = ["节令", "千家诗", "古诗文名篇"]
reason = "题面「元日」与正文「爆竹」「屠苏」都命中节令规则；春由「春风送暖」按规则得出；选本只能在此给出。《千家诗》七言绝句收。"

[[reviewed]]
author = "王安石"
title = "泊船瓜洲"
add = ["思乡"]
deny = ["月"]
reason = "通篇无一「乡」字，思乡由「何时照我还」读出——这正是评审名单不可省的理由，任何关键词规则都推不出它。「明月何时照我还」的月是归途的媒介而非主体，故排除。春由「春风又绿江南岸」按规则得出。"

