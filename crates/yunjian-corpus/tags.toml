# 策展主题标签词表。构建期打标的**唯一**事实来源。
#
# # 为什么必须是这样一个文件，而不是一个模型
#
# 标签直接决定用户在 `browse_by_tag` 里看到哪些诗，选本标签还进入 `search::text`
# 的静态显赫度排序。若它由模型产出，出现一条错标时既解释不了为什么会这样标，也无法
# 在不重跑模型的前提下改掉它——「解释不了」正是本项目的版权墙与可审计性都不接受的
# 形态。所以打标只允许两种来源，两种都可逐条复核：
#
#   1. **关键词规则**（`body_keywords` / `title_keywords`）：正文或题目里出现某个
#      字面串即打标。任何一条由规则得来的标签，都能用一次字符串查找复现。
#   2. **评审名单**（`[[reviewed]]`）：按 `(author, title)` 显式增删。用于规则推不
#      出来的判断——《泊船瓜洲》通篇没有一个「乡」字，思乡是读出来的，不是查出来的。
#
# 两种来源之外没有第三种。`assign_tags` 不接受其它输入，也不产出本文件未声明的标签名。
#
# # 关键词的可采信原则（这条决定了本文件的形状）
#
# **一个关键词只有在它本身就指称该标签的对象时才可用。** 「玉门关」指称边塞、
# 「爆竹」指称节令、「春风」指称春——这些可采信。反过来，「山」不指称山水题
# （《春望》的「山河」是家国），「月」不指称月这个物象（《春望》的「三月」是纪时），
# 「行」不指称行旅（《行路难》的「行」是喻仕途）。凡只能靠整句判断的标签，
# 本文件**不给它编关键词**，而是留空并在 `rule_note` 里写明理由，只走评审名单。
#
# 这条原则的代价是评审名单更长，收益是没有一条规则是为了让测试通过而调出来的。
# 把整句当关键词（例如拿「只缘身在此山中」当哲理的规则）在形式上是规则、
# 实质上是伪装成规则的逐首指定，故一律不用。
#
# # `add` 与 `deny` 的不对称
#
# `deny` 必须真的移除掉某个东西：一条什么都没移除的 `deny` 是死配置，会让人以为
# 某个误报已被处理。因此 `assign_tags` 对无效 `deny` **硬失败**。
# `add` 则允许与规则重复——那不是死配置，而是把契约锚定的那几首诗钉住，
# 使它们不随规则措辞的改动而漂移。
#
# # 为什么 `(author, title)` 是评审名单的键
#
# 与 todo 22 把黄金 fixture 对应到真实语料用的是同一个键。`stable_id` 由
# `source_locator` 铸造、随上游文件位置而定，跨来源不通用；「作者 + 题目」在上游
# 各来源之间是稳定的。代价是同作者的同名作品会被一并打上，`assign_tags` 会把每条
# 名单命中的条数报出来供复核。
#
# 本文件由 `crates/yunjian-corpus/src/tag.rs` 以 `include_str!` 内嵌，改动它必然
# 触发重新编译与全量测试。

schema_version = 1

# ------------------------------------------------------------------ 主题（theme）

[[tag]]
name = "思乡"
kind = "theme"
gloss = "客中怀归。"
# 「故乡」而非单字「乡」：后者会把「江南岸」这类地名句一并卷进来。
body_keywords = ["故乡", "思乡", "望乡", "还乡", "归乡", "乡心"]
title_keywords = ["思乡", "乡思"]

[[tag]]
name = "送别"
kind = "theme"
gloss = "赠别、送行。"
body_keywords = ["劝君更尽", "长亭送"]
# 不收单字「别」：题中的「别」也可以是「别业」（别墅）。
title_keywords = ["送", "赠", "留别", "饯"]

[[tag]]
name = "边塞"
kind = "theme"
gloss = "戍边、征戍、关塞。"
body_keywords = ["玉门关", "阴山", "楼兰", "轮台", "都护", "胡马", "单于"]
title_keywords = ["出塞", "从军行", "塞下", "凉州词", "关山月"]

[[tag]]
name = "咏物"
kind = "theme"
gloss = "以一物为通篇主体。"
body_keywords = []
title_keywords = ["咏"]

[[tag]]
name = "闲适"
kind = "theme"
gloss = "田园、隐逸、自得。"
body_keywords = ["采菊东篱", "把酒话桑麻"]
title_keywords = ["闲居", "田园", "归园田居", "山居"]

[[tag]]
name = "怀古"
kind = "theme"
gloss = "登临古迹而抚今追昔。"
body_keywords = ["千古风流", "六朝", "前朝"]
title_keywords = ["怀古", "咏史", "览古"]

[[tag]]
name = "相思"
kind = "theme"
gloss = "男女或友朋之间的思念。"
body_keywords = ["相思"]
title_keywords = ["相思"]

[[tag]]
name = "忧国"
kind = "theme"
gloss = "伤时忧国。"
# 不收单字「国」：「红豆生南国」的国是地域。
body_keywords = ["国破", "国事", "社稷", "忧国"]
title_keywords = []
rule_note = "题面几乎不会自称忧国，故只给正文规则。"

[[tag]]
name = "战乱"
kind = "theme"
gloss = "兵燹离乱。"
body_keywords = ["烽火", "兵戈", "干戈", "白骨露"]
title_keywords = []
rule_note = "同上，题面不自称战乱。"

[[tag]]
name = "登高"
kind = "theme"
gloss = "登楼、登山而望远。"
body_keywords = []
title_keywords = ["登", "望岳"]
rule_note = "正文里的「上」「望」都太泛（「白鹭上青天」不是登高），故只认题面的「登」。"

[[tag]]
name = "哲理"
kind = "theme"
gloss = "由景生理，句中有可独立成理的判断。"
body_keywords = []
title_keywords = []
rule_note = "一个命题不是一个词。能识别它的只有整句，而拿整句当关键词就是伪装成规则的逐首指定，故本标签只走评审名单。"

[[tag]]
name = "山水"
kind = "theme"
gloss = "以山川形胜为主体。"
# 都是专名：指称的就是具体的山或水，不会误伤「山河」「江南」这类借用。
body_keywords = ["庐山", "蜀道", "剑门", "峨眉", "三峡", "钱塘"]
title_keywords = ["山水", "游山", "入山", "山行"]

[[tag]]
name = "写景"
kind = "theme"
gloss = "通篇为景语，不落议论。"
body_keywords = []
title_keywords = []
rule_note = "「通篇无议论」是对全篇的判断，没有任何单词能指称它，故只走评审名单。"

[[tag]]
name = "行旅"
kind = "theme"
gloss = "在途中，行程本身是题目。"
body_keywords = []
# 不收单字「行」：《行路难》的「行」是喻仕途，不是行程。
title_keywords = ["早发", "夜发", "晓发", "赴", "道中", "舟中", "途中"]
rule_note = "正文里的行程语（「千里江陵」）都是具体地名，逐首列举等于逐首指定，故正文留空。"

[[tag]]
name = "羁旅"
kind = "theme"
gloss = "旅次夜泊，滞留不归。"
body_keywords = ["客船", "客舍", "旅思", "羁旅"]
title_keywords = ["夜泊", "旅次", "客中"]

[[tag]]
name = "失意"
kind = "theme"
gloss = "仕途或际遇的挫折。"
body_keywords = ["行路难", "不得志"]
title_keywords = ["行路难", "落第", "谴"]

[[tag]]
name = "节令"
kind = "theme"
gloss = "岁时节日。"
body_keywords = ["爆竹", "屠苏", "新桃换旧符"]
title_keywords = ["元日", "除夜", "除夕", "清明", "端午", "七夕", "重阳", "上元"]

# ------------------------------------------------------------------ 物象（imagery）

[[tag]]
name = "月"
kind = "imagery"
gloss = "月为篇中主要物象。"
# 刻意不收单字「月」：《春望》的「烽火连三月」与《黄鹤楼送孟浩然之广陵》的
# 「烟花三月」都是纪时，不是物象。复合串才指称天上那个月。
body_keywords = ["明月", "月落", "月明", "秋月", "江月", "孤月", "月华", "月色", "月光"]
title_keywords = ["月"]

[[tag]]
name = "雨"
kind = "imagery"
gloss = "雨为篇中主要物象。"
body_keywords = ["好雨", "细雨", "夜雨", "疏雨", "雨知时节"]
title_keywords = ["雨"]

# ------------------------------------------------------------------ 季节（season）

[[tag]]
name = "春"
kind = "season"
gloss = "春景或春事。"
body_keywords = ["春风", "春江", "春来", "春眠", "阳春", "春水", "春色"]
title_keywords = ["春"]

[[tag]]
name = "夏"
kind = "season"
gloss = "夏景或夏事。"
body_keywords = ["炎夏", "荷风", "蝉噪", "夏木"]
title_keywords = ["夏"]

[[tag]]
name = "秋"
kind = "season"
gloss = "秋景或秋事。"
# 不收单字「霜」：《静夜思》的「地上霜」是月光的比喻。
body_keywords = ["秋风", "秋月", "秋色", "秋声", "秋思", "秋花"]
title_keywords = ["秋"]

[[tag]]
name = "冬"
kind = "season"
gloss = "冬景或冬事。"
# 不收单字「雪」：《绝句》的「千秋雪」是西岭常年积雪，《行路难》的「雪满山」是喻阻。
body_keywords = ["寒风", "飞雪", "冰霜", "严冬"]
title_keywords = ["冬"]

# ------------------------------------------------------------------ 节日（festival）

[[tag]]
name = "中秋"
kind = "festival"
gloss = "中秋。"
body_keywords = ["中秋"]
title_keywords = ["中秋"]

# ------------------------------------------------------------------ 地域（place）

[[tag]]
name = "蜀"
kind = "place"
gloss = "蜀地。"
body_keywords = ["蜀道", "蚕丛", "剑门", "锦官城", "巴蜀"]
title_keywords = ["蜀"]

# ------------------------------------------- 选本（anthology，规则上不可能存在）

[[tag]]
name = "唐诗三百首"
kind = "anthology"
gloss = "清 蘅塘退士《唐诗三百首》收录。"
body_keywords = []
title_keywords = []
rule_note = "选本收录是历史事实而非文本特征，任何关键词都推不出它，只能来自评审名单。"

[[tag]]
name = "宋词三百首"
kind = "anthology"
gloss = "近人朱祖谋《宋词三百首》收录。"
body_keywords = []
title_keywords = []
rule_note = "同上。"

[[tag]]
name = "千家诗"
kind = "anthology"
gloss = "《千家诗》收录。"
body_keywords = []
title_keywords = []
