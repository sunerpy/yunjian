# ================================================================== 评审名单
#
# 每条必须写 `reason`。「为什么这首诗是这个标签」是标签体系全部可审计性的落点，
# 所以空 `reason` 让构建失败。`deny` 优先于 `add` 与规则。

[[reviewed]]
author = "李白"
title = "静夜思"
add = ["思乡", "月", "唐诗三百首", "古诗文名篇"]
reason = "「低头思故乡」是明写；「明月光」「望明月」两处月为主体物象——两者规则本已覆盖，此处钉住契约引用最多的那个锚，使它不随规则措辞漂移。《唐诗三百首》卷六 五言绝句，通行教材必收。"

[[reviewed]]
author = "杜甫"
title = "春望"
add = ["忧国", "战乱", "唐诗三百首", "古诗文名篇"]
deny = ["春"]
reason = "「城春草木深」的春是背景不是主体，而题面「春望」会让季节规则命中——这是题面字与主题不一致的典型，故显式排除。「三月」不会误命中月，因为月的规则刻意不收单字。《唐诗三百首》卷四 五言律诗。"

[[reviewed]]
author = "王之涣"
title = "登鹳雀楼"
add = ["哲理", "古诗文名篇"]
reason = "「欲穷千里目，更上一层楼」是可独立成理的判断，命题只能显式给出；登高由题面的「登」按规则得出，不在此重复。《唐诗三百首》不收此首，通行教材必收，故只登记名篇——这一条是「四个选本各自独立、不互相蕴含」的实例。"

[[reviewed]]
author = "李白"
title = "早发白帝城"
add = ["行旅", "唐诗三百首", "古诗文名篇"]
reason = "题面「早发」按规则已得行旅，此处钉住它——本首是契约里整句七言的锚。《唐诗三百首》卷八 七言绝句。"

[[reviewed]]
author = "张继"
title = "枫桥夜泊"
add = ["秋", "唐诗三百首", "古诗文名篇"]
deny = ["月"]
reason = "「月落」是夜将尽的时间标记，主体是客舟与钟声，故排除物象月。秋由「霜满天」读出：霜在此确指秋霜，但单字霜在《静夜思》里是月光的比喻，不可入规则，因此秋只能在此显式给出。羁旅由题面「夜泊」按规则得出。《唐诗三百首》卷八 七言绝句。"

[[reviewed]]
author = "王维"
title = "相思"
deny = ["春"]
reason = "「春来发几枝」的春是红豆的时序背景，不是主题。相思由题面与正文双重规则命中，无需追加。"

[[reviewed]]
author = "张若虚"
title = "春江花月夜"
add = ["月", "春"]
reason = "题面五物并列，月与春都是主体。两者规则已覆盖，此处钉住四字短语「海上明月」的锚。"

[[reviewed]]
author = "苏轼"
title = "念奴娇·赤壁怀古"
add = ["怀古", "宋词三百首", "古诗文名篇"]
reason = "题面即怀古，「千古风流人物」「三国周郎」同指前朝，规则已覆盖；选本收录只能在此给出。"

[[reviewed]]
author = "苏轼"
title = "水调歌头·明月几时有"
add = ["中秋", "宋词三百首", "古诗文名篇"]
reason = "原调题序作于中秋，而正文只有「今夕是何年」这类间接语，任何关键词都命中不了，故中秋在此显式给出。月由题面「明月几时有」按规则得出。"

[[reviewed]]
author = "苏轼"
title = "题西林壁"
add = ["哲理", "千家诗", "古诗文名篇"]
reason = "「不识庐山真面目，只缘身在此山中」是命题，只能显式给出；山水由正文专名「庐山」按规则得出。《千家诗》七言绝句收。"

[[reviewed]]
