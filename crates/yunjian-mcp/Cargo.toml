[package]
name = "yunjian-mcp"
description = "云笺 MCP 服务端：以 stdio 传输暴露检索与背诵能力"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
# rmcp is pinned because its release cadence produced a major version within one month;
# upgrades are scheduled compatibility work rather than routine dependency refreshes.
rmcp = { workspace = true, features = ["transport-io"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std"] }
yunjian-core = { path = "../yunjian-core" }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[[test]]
name = "stdio"
harness = false

[lints]
workspace = true
