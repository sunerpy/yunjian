[package]
name = "yunjian-cli"
description = "云笺命令行：检索、背诵与语料维护的终端入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

# 包名为 `yunjian-cli`（crates.io 上的裸名 `yunjian` 已被 2021 年的废弃占位包占用，
# 且 crates.io 不释放未撤回的名字），但对外分发的可执行文件必须叫 `yunjian`。
# 这里是产品名在构建体系中唯一的落点。
[[bin]]
name = "yunjian"
path = "src/main.rs"

# 库目标存在的理由：可执行文件的行为要能在两个层次上被验证。信封 schema、退出码映射与
# clap 定义本身适合进程内单测，而 stdout/stderr 分离与退出码只能由子进程验证
# （`tests/cli.rs`）。没有库目标，前一半就只能靠后一半间接推断。
[lib]
name = "yunjian_cli"
path = "src/lib.rs"

[features]
default = ["mcp"]
mcp = ["dep:tokio", "dep:yunjian-mcp"]
# `yunjian mcp --http`。**刻意不进 `default`**：stdio 传输没有监听端口，HTTP 传输一开就有一个
# 同机任何进程都能连的 socket。默认构建里那个 socket 不存在，也就没有「忘记加认证」的机会。
mcp-http = ["mcp", "dep:tokio-util", "tokio/signal", "yunjian-mcp/http"]
# 语音能力从这里向下透传。默认关闭：不开时二进制不链接 onnxruntime，
# 词典与默写功能因此不受原生依赖的成败影响。
voice = ["yunjian-voice/voice"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# `mcp install` 要按平台推导客户端配置目录。三个平台三套惯例，手写会漏掉
# macOS 的 `~/Library/Application Support` 与 Windows 不读 `%APPDATA%` 这两件事。
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
yunjian-ai = { path = "../yunjian-ai" }
yunjian-core = { path = "../yunjian-core" }
yunjian-mcp = { path = "../yunjian-mcp", optional = true }
yunjian-voice = { path = "../yunjian-voice" }

[dev-dependencies]
assert_cmd = { workspace = true }
# fixture 语料库要在测试里现建：真实语料是 633 MiB、首启派生实测 571.8 s 的工件，
# 任何门禁都不可能等它。
rusqlite = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
