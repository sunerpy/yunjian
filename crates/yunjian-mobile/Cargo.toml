[package]
name = "yunjian-mobile"
description = "云笺移动端共享门面：跨检索、赏析、背诵、语音与凭据的薄接线层"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
secrecy.workspace = true
serde.workspace = true
yunjian-ai = { path = "../yunjian-ai" }
yunjian-core = { path = "../yunjian-core" }
yunjian-recite = { path = "../yunjian-recite" }
yunjian-voice = { path = "../yunjian-voice" }

[dev-dependencies]
# 受保护领域逻辑的逐字节摘要守卫。刻意是 SHA-256 而不是 blake3：仓库既有的逐字节门禁
# （xtask verify-sources / verify-models / assets manifest）全是 SHA-256，多引一个哈希族
# 只会让「摘要」这个词在同一个仓库里指两件事。
sha2 = { workspace = true }
toml.workspace = true

[lints]
workspace = true
