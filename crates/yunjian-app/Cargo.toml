[package]
name = "yunjian-app"
description = "云笺桌面端：Tauri v2 外壳，承载 React 前端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

# 这个 crate 同时扮演 Tauri 约定里的 `src-tauri` 角色：`tauri.conf.json` 与
# `tauri.macos.conf.json` 都在这里，因为 `generate_context!` 与 `tauri-build` 都以
# **manifest 所在目录**为配置根。把配置挪到仓库根的 `src-tauri/` 会多出一个空壳
# crate 根，且 `cargo tauri build` 必须靠 `--config` 才找得到，白增一处可漂移的耦合。

# 库目标存在的理由与 `yunjian-cli` 相同：可执行文件的行为要能在两个层次上被验证。
# 窗口配置的跨文件一致性、日志引导顺序适合进程内/集成测试，而真正拉起 WebView
# 只能靠真机验收（todo 67）。没有库目标，前一半就只能靠后一半间接推断。
#
# 另外这也是 Tauri v2 移动端的既定形态（入口在库里、平台外壳调用它），
# todo 68/69 接移动端时不必再改结构。
[lib]
name = "yunjian_app"
path = "src/lib.rs"

# 可执行文件叫 `yunjian-desktop` 而不是 `yunjian`：后者是 `yunjian-cli` 的产物名
# （`crates/yunjian-cli/Cargo.toml` 里唯一的产品名落点），同名会让两个 crate 争抢
# `target/{debug,release}/yunjian`，谁后构建谁覆盖，且这种冲突 cargo 不报错。
[[bin]]
name = "yunjian-desktop"
path = "src/main.rs"

[features]
default = []
# 原生语音。**这个开关同时是许可边界**：默认构建是纯 MIT 且不链接 onnxruntime，开启后
# 预编译的 sherpa-onnx 产物静态包含 GPL-3.0 的 espeak-ng，分发物整体须按 GPL-3.0 提供
# （见 `docs/VOICE-BUILD.zh.md` 与 `problems.md` 的 2026-08-10 一条）。
#
# **语音 IPC 模块本身不在这个开关后面。** 线上形状、五条失败原因码、阶段机、
# 「分数不得来自偏置假设」这几件事都是纯判定，藏到特性后面就意味着一台没有模型、
# 没有声卡的机器（也就是 `make ci` 跑的那种构建）验证不了它们——而它们恰恰最需要被守住。
# 开关只决定 `VoiceRig` 的生产实现是真的合成与采集，还是一个恒报「未编译语音能力」的桩。
voice = ["yunjian-voice/voice"]

[dependencies]
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# updater 内部关闭了 reqwest 默认特性；这里显式合并 system-proxy，确保 GUI 进程能读取
# Windows/macOS 系统代理，而不是只认桌面应用通常继承不到的 HTTP_PROXY 环境变量。
reqwest = { version = "=0.13.4", default-features = false, features = ["system-proxy"] }
yunjian-ai = { path = "../yunjian-ai" }
yunjian-core = { path = "../yunjian-core" }
yunjian-recite = { path = "../yunjian-recite" }
yunjian-voice = { path = "../yunjian-voice" }

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
# `tauri` 的 `test` 特性给出 `MockRuntime` 与 `mock_builder`，于是命令的**外壳**可以按
# WebView 驱动它的方式真被调用一次，而不是只用类型断言证明它返回了一个 Future。
# 两者的差别是可测量的：只加类型断言会让新增的命令外壳一行都没执行过。
tauri = { workspace = true, features = ["test"] }
# 窗口配置的一致性断言要按 JSON 逐键比对两份配置文件。刻意不反序列化成
# `tauri_utils::config::Config`：那条路会把缺失的键补成 serde 默认值，于是
# 「macOS overlay 漏写 minWidth」这个真实陷阱会被默认值抹平成「两边都是 None，相等」，
# 断言永远变不了红。必须在 `serde_json::Value` 这一层判断键是否**存在**。

[lints]
workspace = true
