# yunjian Android 冒烟产物构建 —— AWS CodeBuild
#
# 目的：产出 `xtask acceptance --platform android --set spike` 需要的两个产物
# （`target/mobile/yunjian-spike.apk` 与 `target/mobile/spike-tests.zip`），
# 因为本机既无 Android SDK 也无 NDK，且 `docs/PLATFORM-REQUIREMENTS.zh.md` 记录的
# `aarch64-linux-android` 目标缺 `ANDROID_NDK_HOME`。
#
# 区域：本项目 runner 在 us-east-2，而 Device Farm 只在 us-west-2。构建在 us-east-2
# 产出、上传到 us-west-2 的 Device Farm，跨区是刻意的，不是配置错误。
#
# ## 三个「未确认点」的实测答案（2026-08-15，`yunjian-runner` 上跑侦察构建所得）
#
# 1. **`aws/codebuild/standard:7.0` 完全不带 Android SDK。** `ANDROID_HOME`、
#    `ANDROID_SDK_ROOT`、`ANDROID_NDK_HOME` 三个变量全部未设置，且
#    `find / -maxdepth 6 -name sdkmanager` 一个都没找到。因此下面的自装分支不是
#    「兜底」而是**唯一路径**，原先那句「若镜像没带就自装」的条件判断永远走 else。
#    自装的 cmdline-tools 报 `sdkmanager --version` = `12.0`。
#
# 2. **磁盘远不是瓶颈。** 容器 overlay 300 GiB、装 SDK 前剩 129 GiB。
#    `ndk;26.3.11579264` 实测 **2.1 GiB**，整个 SDK（NDK + platforms;android-35 +
#    build-tools;35.0.0 + platform-tools + cmdline-tools）**2.5 GiB**，
#    四个组件一次 `sdkmanager --install` **22 秒**装完，装完仍剩 125 GiB。
#    原先担心的「约 2.5 GiB 能否落在配额内」答案是能，且富余两个数量级。
#
# 3. **`tauri android init` 不改 `crates/yunjian-mobile/Cargo.toml`。** 这一条最要紧，
#    因为 todo 69 的守卫 `undetermined_verdict_builds_neither_binding_branch`
#    **只读那一个文件**的 `[features]` 与 `[dependencies]` 两张表。init 生成的是
#    `crates/yunjian-app/gen/android/`（且该目录在 `.gitignore` 内），与守卫读的文件
#    没有交集。init 还会主动放弃改写 `crates/yunjian-app/Cargo.toml`——它打印
#    `` `tauri` dependency has workspace inheritance enabled. The features array
#    won't be automatically rewritten. Expected features: [] ``，即工作区继承挡住了
#    它的自动改写，而它期望的附加特性本来就是空集。本 buildspec 因此加了一道
#    **显式断言**（见 build 阶段），让「不冲突」这件事每次构建都被重新证明一次，
#    而不是靠这段注释被相信。
#
# 另外三条实测事实，直接写进下面的实现：
#
# - **tauri CLI 必须走 `cargo install`，不能用 npm 的 `@tauri-apps/cli`。** npm 那个包
#   装起来只要 1 秒（`tauri-cli 2.11.4`），单独跑 `android init` 也正常，但它会让生成的
#   Gradle 工程在 `:app:rustBuildArm64Debug` 阶段报 `Cannot find module '<crate>/tauri'`。
#   详见 install 阶段那条注释。**这是本文件唯一一处刻意选慢的地方。**
# - **Tauri 会用自己的 API 24 链接器覆盖我们导出的 android26。** 实测 CLI 向 Gradle
#   注入 `CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=.../aarch64-linux-android24-clang`，
#   把 pre_build 里那份 android26 导出顶掉。对**本冒烟目标无害**：不开 `voice` 时
#   依赖图里没有 cpal，用不到 AAudio。但 todo 70 打开 `voice` 后，API 24 的 sysroot
#   缺 AAudio 符号（todo 25 实测），届时必须把 minSdk 提到 26 让 Tauri 自己选对链接器，
#   而不是在这里导出变量——因为导出会被覆盖。
# - **NDK r26.3.11579264 就是 r26d**，其 `toolchains/llvm/prebuilt/linux-x86_64/bin`
#   里只有带 API 级别的 `aarch64-linux-android21..34-clang`，**没有**不带级别的
#   `aarch64-linux-android-clang`；归档工具只有 `llvm-ar` / `llvm-ranlib`，
#   **没有** `aarch64-linux-android-ar`。这正是 `voice-build.yml` 记录的那个坑。

version: 0.2

env:
  variables:
    ANDROID_NDK_VERSION: "26.3.11579264"
    ANDROID_PLATFORM: "android-35"
    # tauri 模板的 compileSdk；与判据③要求的 targetSdk 35 是两件事。
    ANDROID_COMPILE_PLATFORM: "android-36"
    ANDROID_BUILD_TOOLS: "35.0.0"
    RUST_TARGET: "aarch64-linux-android"
    CARGO_TERM_COLOR: "never"
    # cmdline-tools 的下载地址写死版本号：`_latest` 那个别名指向的内容会变，
    # 而构建要可复现。这个包实测报 `sdkmanager --version` = 12.0。
    CMDLINE_TOOLS_ZIP: "commandlinetools-linux-11076708_latest.zip"

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 20
    commands:
      - echo "== 记录实际工具链，而不是假定它存在 =="
      - java -version
      - node --version
      # 镜像不带 SDK 已是实测结论，所以这里不再做「若存在则复用」的分支：
      # 那条分支永远不执行，留着只会让读者以为它可能生效。
      - echo "== standard:7.0 不带 Android SDK（已实测），自装 cmdline-tools =="
      - export ANDROID_HOME="$HOME/android-sdk"
      - mkdir -p "$ANDROID_HOME/cmdline-tools"
      - curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
      - unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      - echo "export ANDROID_HOME=$ANDROID_HOME" > "$HOME/.yunjian-env"
      - echo "export ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$HOME/.yunjian-env"
      - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
      - sdkmanager --version
      - yes | sdkmanager --licenses >/dev/null 2>&1 || true
      # 四个组件一次装完实测 22 秒、2.5 GiB。`--verbose` 关掉进度条刷屏，
      # 否则日志里是几千个 `[====]` 帧，真正的报错会被埋掉。
      # `platforms;android-36` 一并装上：tauri 模板的 `compileSdk` 实测是 36（PR #102 在
      # 真机上量到 targetSdk 36 就是它的下游后果），而 AGP 的自动下载是个隐式依赖——
      # 显式装出来才让「用哪个平台编译」这件事可复核。
      - >-
        sdkmanager --install
        "platforms;${ANDROID_PLATFORM}"
        "platforms;${ANDROID_COMPILE_PLATFORM}"
        "build-tools;${ANDROID_BUILD_TOOLS}"
        "platform-tools"
        "ndk;${ANDROID_NDK_VERSION}"
        > /tmp/sdkmanager.log 2>&1 || { echo "SDK 安装失败："; tail -40 /tmp/sdkmanager.log; exit 1; }
      - echo "export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$HOME/.yunjian-env"
      # NDK_HOME 与 ANDROID_NDK_HOME 都导出：tauri-cli 读前者，cargo-ndk 与多数
      # 第三方脚本读后者，两个名字在生态里都在用。
      - echo "export NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$HOME/.yunjian-env"
      - . "$HOME/.yunjian-env"
      - test -d "$ANDROID_NDK_HOME" || { echo "NDK 未落地，构建终止"; exit 1; }
      - du -sh "$ANDROID_HOME" "$ANDROID_NDK_HOME"

      - echo "== Rust 工具链；tauri android init 要跑 cargo metadata，没有 cargo 会直接失败 =="
      - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
      - . "$HOME/.cargo/env"
      - rustup target add "$RUST_TARGET"
      # 必须用 `cargo install tauri-cli`，**不能**用 npm 的 `@tauri-apps/cli`，尽管后者
      # 装起来只要 1 秒而这里要编译几分钟。理由是 `android init` 会把「当初怎么调用 CLI」
      # 这件事**烧进生成的 Gradle 工程**：`gen/android/buildSrc` 里的 `BuildTask.kt`
      # 之后要在 `:app:rustBuildArm64Debug` 里回调 CLI 去编 Rust。
      # 用 npm 全局 shim 初始化时，它记下的是一个相对工程目录的 node 脚本路径，
      # 于是 Gradle 阶段报 `Cannot find module '<crate 目录>/tauri'`（实测），
      # 而 Rust 那一步在此之前**已经成功**——失败点与真实原因隔着一个阶段，很难读。
      - echo "== tauri CLI：必须是 cargo 子命令形态，见上方注释 =="
      - cargo install tauri-cli --locked --version "^2"
      - cargo tauri --version

  pre_build:
    commands:
      - . "$HOME/.yunjian-env"
      - . "$HOME/.cargo/env"
      - export PATH="$ANDROID_HOME/platform-tools:$PATH"
      - echo "== 前置断言：缺一个就明确失败，不产出半成品 =="
      - test -n "$ANDROID_NDK_HOME" || { echo "ANDROID_NDK_HOME 未设置"; exit 1; }
      - adb version
      - cargo --version
      - npm ci --prefix app
      - npm run build --prefix app
      - test -f app/dist/index.html || { echo "前端产物缺失，generate_context! 会在编译期 panic"; exit 1; }

      # ---------------------------------------------------------------------
      # NDK 交叉编译环境。**照 voice-build.yml 已验证的那一版写，不凭记忆拼。**
      #
      # 只导出链接器曾经够用，因为图里没有需要**为目标**编译 C 的依赖。这个前提
      # 早已不成立：`reqwest`/`tauri-plugin-updater` 拉进 rustls -> ring（C 与汇编），
      # `yunjian-core` 拉进 libsqlite3-sys（C）。两者都走 cc-rs。
      #
      # 缺这几条变量时 cc-rs 找不到目标编译器：它先探
      # `aarch64-linux-android21-clang`（NDK bin 不在 PATH 上，探不到），再回落到
      # `aarch64-linux-android-clang`——而**统一工具链时代的 NDK 从未发过这个不带
      # API 级别的名字**（本仓库上面的侦察已逐字列出 bin 目录佐证），于是报
      # `ToolNotFound: failed to find tool "aarch64-linux-android-clang"`。
      # ar/ranlib 走同一套回落：先探 PATH 上的 `llvm-ar`，失败则回落到同样不存在的
      # `aarch64-linux-android-ar`。因此四个工具全部写成 NDK 内的绝对路径。
      #
      # 刻意**不**把 `$TC/bin` 加进 PATH：那会让 cc-rs 的自动探测命中 NDK 自带的
      # `aarch64-linux-android21-clang`，于是哪天这里的 CC 被删掉，C 代码会静默按
      # API 21 编译而不是报错。
      # ---------------------------------------------------------------------
      - |
        TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        # 链接器与 CC 取自**同一个**变量，因此两者不可能落在不同 API 级别上——
        # C 代码与 Rust 代码针对不同 API 编译是这里最难查的一类故障。
        CLANG="$TC/bin/aarch64-linux-android26-clang"
        CLANGXX="${CLANG}++"
        AR="$TC/bin/llvm-ar"
        RANLIB="$TC/bin/llvm-ranlib"

        # 写死工具名是必需的（自动探测会回落到 NDK 从未发过的名字），但写死的名字
        # 会随 NDK 升版失效。不断言的话，下次失效仍然表现为那句无从下手的
        # `ToolNotFound`；断言之后它变成「这个文件没了」加一份目录清单。
        MISSING=0
        for TOOL in "$CLANG" "$CLANGXX" "$AR" "$RANLIB"; do
          if [ ! -x "$TOOL" ]; then
            echo "NDK 工具不存在或不可执行：$TOOL"
            MISSING=1
          fi
        done
        if [ "$MISSING" != 0 ]; then
          echo "$TC/bin 的实际内容："
          ls "$TC/bin"
          exit 1
        fi

        # API 26 不是随手选的：android24 的 sysroot 里没有 AAudio 符号（todo 25 实测），
        # 而 `capture` 走 cpal 的 Android 后端，那个后端就用 AAudio。
        case "$CLANG" in
          *android26-clang) echo "OK: API 26" ;;
          *) echo "CC/链接器不是 android26，cpal 的 AAudio 绑定会链接到缺符号的 sysroot"; exit 1 ;;
        esac

        {
          echo "export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
          echo "export CC_aarch64_linux_android=$CLANG"
          echo "export CXX_aarch64_linux_android=$CLANGXX"
          echo "export AR_aarch64_linux_android=$AR"
          echo "export RANLIB_aarch64_linux_android=$RANLIB"
          echo "export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$TC/sysroot"
        } >> "$HOME/.yunjian-env"
      - . "$HOME/.yunjian-env"
      - 'echo "CC_aarch64_linux_android=$CC_aarch64_linux_android"'

  build:
    commands:
      - . "$HOME/.yunjian-env"
      - . "$HOME/.cargo/env"
      - mkdir -p target/mobile

      - echo "== tauri android init：生成 gen/android 外壳 =="
      - (cd crates/yunjian-app && cargo tauri android init)

      # -------------------------------------------------------------------
      # 判据 ①②③ 的 instrumented 测试接线。
      #
      # 这三段注入让 `mobile/android/spike/` 下的测试类真正成为可被 `am instrument`
      # 调起的东西。上一版 testspec 直接 `am instrument` 三个**仓库里不存在**的类，
      # 失败信息读起来像「设备有问题」，掩盖真实原因。所以顺序是：先让类存在，
      # 再让 testspec 调它们。
      # -------------------------------------------------------------------
      - echo "== 注入 todo 46 的音频权限声明（判据①要它，缺 MODIFY_AUDIO_SETTINGS 正是 tauri#10846）=="
      - |
        set -e
        APP_MANIFEST=crates/yunjian-app/gen/android/app/src/main/AndroidManifest.xml
        test -f "$APP_MANIFEST" || { echo "init 没生成应用 manifest：$APP_MANIFEST"; exit 1; }
        python3 - "$APP_MANIFEST" <<'PYEOF'
        import re, sys
        path = sys.argv[1]
        text = open(path, encoding="utf-8").read()
        # 权限与 uses-feature 是 <manifest> 的直接子元素，Activity 是 <application> 的。
        # 两处插入点不同，所以分别处理，而不是把整段片段一股脑塞进去。
        permissions = [
            '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
            '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
            '<uses-feature android:name="android.hardware.microphone" android:required="false" />',
        ]
        missing = [item for item in permissions if item.split('android:name="')[1].split('"')[0] not in text]
        if missing:
            text = text.replace("<application", "\n    ".join(missing) + "\n\n    <application", 1)
        activity = 'top.onethinker.yunjian.spike.SpikeWebViewActivity'
        if activity not in text:
            block = (
                '        <activity\n'
                '            android:name="top.onethinker.yunjian.spike.SpikeWebViewActivity"\n'
                '            android:exported="false"\n'
                '            android:label="yunjian spike" />\n'
            )
            text = re.sub(r"(\n\s*</application>)", "\n" + block + r"\1", text, count=1)
        open(path, "w", encoding="utf-8").write(text)
        PYEOF
        echo "--- 注入后的应用 manifest ---"
        cat "$APP_MANIFEST"
        # 三道断言，一个都不能省：缺 RECORD_AUDIO 判据①永远拿不到 PCM；缺 INTERNET
        # 判据②连不上发布地址却会表现成「下载超时」；缺 spike Activity 判据③根本没界面可测。
        grep -q "android.permission.RECORD_AUDIO" "$APP_MANIFEST" || { echo "RECORD_AUDIO 未注入"; exit 1; }
        grep -q "android.permission.MODIFY_AUDIO_SETTINGS" "$APP_MANIFEST" || { echo "MODIFY_AUDIO_SETTINGS 未注入"; exit 1; }
        grep -q "android.permission.INTERNET" "$APP_MANIFEST" || { echo "模板缺 INTERNET，判据②的生产下载路径出不去"; exit 1; }
        grep -q "SpikeWebViewActivity" "$APP_MANIFEST" || { echo "spike Activity 未注入"; exit 1; }

      - echo "== 追加 gradle 片段：targetSdk 35 + androidTest 源集与依赖 =="
      - |
        set -e
        APP_GRADLE=crates/yunjian-app/gen/android/app/build.gradle.kts
        test -f "$APP_GRADLE" || { echo "init 没生成 $APP_GRADLE"; exit 1; }
        echo "--- 模板原文（供核对 compileSdk / targetSdk 从哪来）---"
        cat "$APP_GRADLE"
        printf '\n' >> "$APP_GRADLE"
        cat mobile/android/spike/spike-androidtest.gradle.kts >> "$APP_GRADLE"
        grep -q "targetSdk = 35" "$APP_GRADLE" || { echo "targetSdk 未钉住，判据③会再次量到 36"; exit 1; }

      - echo "== 判据②的生产路径桥：libyunjian_spike.so 进应用 APK 的 jniLibs =="
      # 单独 `cargo build` 而不是让 tauri 一起带：这个库不属于产品，它只是把
      # `yunjian_core::assets::AssetResolver` 暴露给 instrumented 测试。放进产品的
      # cdylib 会让一个仅测试需要的 JNI 入口出现在分发物里。
      - cargo build -p yunjian-spike --target "$RUST_TARGET" --release
      - |
        set -e
        SO="target/$RUST_TARGET/release/libyunjian_spike.so"
        test -f "$SO" || { echo "spike 桥未产出：$SO"; ls -la "target/$RUST_TARGET/release/" | head -30; exit 1; }
        JNI_DIR=crates/yunjian-app/gen/android/app/src/main/jniLibs/arm64-v8a
        mkdir -p "$JNI_DIR"
        cp "$SO" "$JNI_DIR/"
        ls -la "$JNI_DIR"

      # 这道断言是本文件对 todo 69 的交代：init 之后，binding 守卫读的那个文件
      # 必须逐字节未变，且守卫测试必须仍然通过。两者缺一都不算证明。
      - echo "== 断言 init 未触碰 todo 69 守卫读取的文件 =="
      - |
        if git diff --quiet -- crates/yunjian-mobile/Cargo.toml; then
          echo "OK: crates/yunjian-mobile/Cargo.toml 未被 init 改动"
        else
          echo "冲突：init 改了 binding 守卫读取的文件，必须停下"
          git diff -- crates/yunjian-mobile/Cargo.toml
          exit 1
        fi
      - echo "== 断言 binding 守卫测试仍然通过 =="
      - cargo test -p yunjian-mobile --test architecture 2>&1 | tail -20
      - echo "== 记录 init 的完整改动面，供报告引用 =="
      - git status --porcelain | head -40
      - git diff --stat | tail -20

      # 刻意**不**把输出接进 `| tail`：管道的退出码是 tail 的，构建失败会被吞成
      # 成功，只在下一步「找不到 APK」时才暴露，而那时真实报错已被截断。
      # 这与 `problems.md` 记的「退出码 0 不等于验收通过」是同一种形态。
      # `--debug` 而不是默认的 release：release 的 APK 由 Gradle 产出为
      # `*-unsigned.apk`，而 Android 拒绝安装未签名包，Device Farm 也不会代签
      # Android 产物（它只对 iOS 用通配 profile 重签名）。debug 走 Gradle 自带的
      # 调试签名配置，装得上、可 instrument，且 targetSdk 不变——判据三要的
      # `target_sdk == 35` 与构建类型无关。
      #
      # `--features custom-protocol` 必须显式给：`tauri-build` 把 `dev` 定义成
      # `!custom_protocol`，缺它时 WebView 去连 `devUrl`（localhost:5173），
      # 真机上没有 Vite，画出来的是 `Could not connect to localhost`。
      # 那正是 PR #100 更正的那个「近单色窗口」误判形态，在真机上会更难识别。
      - echo "== 冒烟目标只建单 ABI；产品分发的四个 ABI 归 todo 70 =="
      - (cd crates/yunjian-app && cargo tauri android build --target aarch64 --apk --debug --features custom-protocol)
      # 候选先全部列出再按体积最大者取：Gradle 的 outputs 目录里除最终 APK 外还可能
      # 留下中间产物，`find | head -1` 取到的是目录遍历顺序里的第一个，那不是一个
      # 可复现的选择。同时**显式拒绝 `-unsigned.apk`**，因为它装不上真机，
      # 而它一旦被当成产物送上 Device Farm，失败会表现为「安装超时」而不是「未签名」。
      - |
        echo "APK 候选清单："
        find crates/yunjian-app/gen/android -name '*.apk' -type f -printf '%s\t%p\n' | sort -rn
        APK=$(find crates/yunjian-app/gen/android -name '*.apk' -type f ! -name '*-unsigned.apk' -printf '%s\t%p\n' | sort -rn | head -1 | cut -f2)
        if [ -z "$APK" ]; then
          echo "未找到已签名的 APK 产物"
          find crates/yunjian-app/gen/android \( -name '*.apk' -o -name '*.aab' \) -type f
          exit 1
        fi
        echo "选定 $APK"
        cp "$APK" target/mobile/yunjian-spike.apk

      # -------------------------------------------------------------------
      # androidTest APK。**这是本次相对 PR #102 唯一真正新增的产物**：
      # 没有它，testspec 里的 `am instrument` 就只能去调不存在的类。
      #
      # 走 `gradlew` 而不是 tauri CLI：CLI 没有暴露 androidTest 变体。任务名不写死——
      # tauri 模板按 ABI 生成 productFlavor，变体名（`arm64Debug` 之类）属于模板实现细节，
      # 凭记忆猜一个名字失败时报的是 `Task not found`，读起来像 Gradle 坏了。
      # 所以先让 Gradle 自己列出它有哪些 androidTest 任务，再按 ABI + debug 挑。
      # -------------------------------------------------------------------
      - echo "== 列出 Gradle 实际提供的 androidTest 任务 =="
      # 每个 gradle 步骤都放进子 shell：CodeBuild 把一个 phase 的命令拼成同一个脚本，
      # 裸 `cd` 会泄漏到后续命令，于是「找 APK」那一步会在 gen/android 里找 target/mobile。
      - |
        set -e
        (
          cd "$CODEBUILD_SRC_DIR/crates/yunjian-app/gen/android"
          chmod +x gradlew
          ./gradlew -q --console=plain :app:tasks --all 2>/dev/null > /tmp/gradle-tasks.txt || true
          grep -oE '^assemble[A-Za-z0-9]*AndroidTest' /tmp/gradle-tasks.txt | sort -u > /tmp/androidtest-tasks.txt || true
          grep -oE '^rustBuild[A-Za-z0-9]*' /tmp/gradle-tasks.txt | sort -u > /tmp/rustbuild-tasks.txt || true
          echo "--- rustBuild 任务（下一步要排除的对象）---"
          cat /tmp/rustbuild-tasks.txt
          cat /tmp/androidtest-tasks.txt
          if [ ! -s /tmp/androidtest-tasks.txt ]; then
            echo "Gradle 没有任何 androidTest 任务——androidTest 源集没接上"
            ./gradlew -q --console=plain :app:tasks --all 2>&1 | tail -60
            exit 1
          fi
        )
      - echo "== 组装 androidTest APK =="
      - |
        set -e
        (
          cd "$CODEBUILD_SRC_DIR/crates/yunjian-app/gen/android"
          # 优先 arm64 + Debug；退到任意 Debug。两级都失败就明确报出来，不去猜。
          TASK=$(grep -i 'arm64' /tmp/androidtest-tasks.txt | grep -i 'debug' | head -1)
          if [ -z "$TASK" ]; then
            TASK=$(grep -i 'debug' /tmp/androidtest-tasks.txt | head -1)
          fi
          if [ -z "$TASK" ]; then
            echo "候选任务里没有 debug 变体："
            cat /tmp/androidtest-tasks.txt
            exit 1
          fi
          echo "选定 Gradle 任务 :app:$TASK"

          # -------------------------------------------------------------------
          # 必须排除 `rustBuild<变体>`，否则这一步一定失败。原因不是「Gradle 有问题」：
          # `assemble<变体>AndroidTest` 的任务图里含 `:app:rustBuild<变体>`，而那个任务
          # 回调 tauri CLI 去编 Rust；CLI 的 `read_options`（tauri-cli 2.11.4
          # `src/mobile/mod.rs:403`）从 `$TMPDIR/<identifier>-server-addr` 读一个地址，
          # 再连上去取构建参数——**那个 WebSocket 服务由父进程 `cargo tauri android build`
          # 持有，进程一退就没了**。地址文件仍在（上一步的残留），所以失败形态是
          # `ConnectionRefused` 而不是「文件缺失」，读起来像网络问题，实则是
          # 「在没有父 CLI 的情况下直接调 gradlew」。
          #
          # 排除它是安全的：androidTest APK 不含应用的 `.so`（应用 APK 上一步已经建好，
          # 且已断言 `libyunjian_spike.so` 在里面）。这一步只需要应用变体的 Kotlin 产物
          # 作为编译类路径，那来自 `compileArm64DebugKotlin`，与 rustBuild 无关。
          # -------------------------------------------------------------------
          RUST_TASK="rustBuild$(printf '%s' "$TASK" | sed 's/^assemble//; s/AndroidTest$//')"
          if grep -qx "$RUST_TASK" /tmp/rustbuild-tasks.txt; then
            echo "排除 :app:$RUST_TASK（父 CLI 已退出，它的 option 服务不在了）"
            ./gradlew --console=plain ":app:$TASK" -x ":app:$RUST_TASK"
          else
            # 推导不出对应的 rustBuild 任务时不去猜一个名字：`-x` 一个不存在的任务
            # 会让 Gradle 报 unknown task，而那条错误与真实原因无关。
            echo "任务清单里没有 $RUST_TASK，直接执行（清单如下）"
            cat /tmp/rustbuild-tasks.txt
            ./gradlew --console=plain ":app:$TASK"
          fi
        )
      - |
        set -e
        cd "$CODEBUILD_SRC_DIR"
        echo "androidTest APK 候选清单："
        find crates/yunjian-app/gen/android -name '*.apk' -type f -path '*androidTest*' -printf '%s\t%p\n' | sort -rn
        TEST_APK=$(find crates/yunjian-app/gen/android -name '*.apk' -type f -path '*androidTest*' ! -name '*-unsigned.apk' -printf '%s\t%p\n' | sort -rn | head -1 | cut -f2)
        if [ -z "$TEST_APK" ]; then
          echo "未找到已签名的 androidTest APK"
          find crates/yunjian-app/gen/android -name '*.apk' -type f
          exit 1
        fi
        echo "选定 $TEST_APK"
        cp "$TEST_APK" target/mobile/yunjian-spike-androidtest.apk

      - echo "== 测试包：testspec、设备端脚本与 androidTest APK =="
      - test -f .aws/devicefarm/spike-android.yml || { echo "缺 testspec"; exit 1; }
      - test -f target/mobile/yunjian-spike-androidtest.apk || { echo "缺 androidTest APK"; exit 1; }
      # androidTest APK 一起打进测试包：Device Farm 的宿主侧会把这个 zip 解到
      # `$DEVICEFARM_TEST_PACKAGE_PATH`，于是 `adb install` 拿到的是本地路径，
      # 不必再为它单独走一次 create-upload。
      - cp target/mobile/yunjian-spike-androidtest.apk .aws/devicefarm/
      - (cd .aws/devicefarm && zip -qr "$CODEBUILD_SRC_DIR/target/mobile/spike-tests.zip" spike-probe.sh spike-measure.sh yunjian-spike-androidtest.apk)
      - rm -f .aws/devicefarm/yunjian-spike-androidtest.apk

  post_build:
    commands:
      - echo "== 产物清单与体积，供 docs/reports/mobile-size.md 消费 =="
      - ls -la target/mobile/ || true
      - sha256sum target/mobile/* || true

      # 签名与 ABI 必须在这里查明，而不是等 Device Farm 安装失败再回头猜：
      # 未签名 APK 在真机上的失败形态是「安装超时」，ABI 不匹配的形态是
      # 「INSTALL_FAILED_NO_MATCHING_ABIS」，两者都不会直接说出真实原因。
      - echo "== APK 签名与 ABI =="
      - |
        APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
        if [ -x "$APKSIGNER" ]; then
          "$APKSIGNER" verify --print-certs target/mobile/yunjian-spike.apk 2>&1 | head -20
        else
          echo "apksigner 不在 $APKSIGNER"
        fi
        unzip -l target/mobile/yunjian-spike.apk | grep -e 'lib/' -e 'AndroidManifest' | head -20
        "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging target/mobile/yunjian-spike.apk 2>/dev/null | grep -e package -e sdkVersion -e native-code | head -10

      # 判据③的阈值是 `target_sdk == 35`。构建期就把它查出来，而不是等真机报 36 再回头改
      # 判据——PR #102 量到 36 正是因为构建从未钉住它。这道断言让「阈值不符」在几分钟内
      # 暴露，而不是花掉一轮设备分钟数之后。
      - echo "== 断言 APK 的 targetSdk 与判据③一致 =="
      - |
        set -e
        AAPT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
        BADGING=$("$AAPT" dump badging target/mobile/yunjian-spike.apk 2>/dev/null)
        printf '%s\n' "$BADGING" | grep -e sdkVersion -e targetSdkVersion
        TARGET=$(printf '%s\n' "$BADGING" | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)
        MIN=$(printf '%s\n' "$BADGING" | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" | head -1)
        echo "解析出 targetSdkVersion=$TARGET minSdkVersion=$MIN"
        [ "$TARGET" = "35" ] || { echo "判据③要求 targetSdk 35，APK 实际 $TARGET"; exit 1; }
        [ "$MIN" = "26" ] || { echo "todo 46 要求 minSdk 26，APK 实际 $MIN"; exit 1; }

      # 判据②的桥必须真的在 APK 里。不查的话，设备端只会报
      # `libyunjian_spike_not_loadable`，而那句话既可能是没打进去，也可能是 ABI 不匹配。
      - echo "== 断言 libyunjian_spike.so 已打进应用 APK =="
      - |
        set -e
        unzip -l target/mobile/yunjian-spike.apk | grep 'libyunjian_spike.so' || {
          echo "APK 里没有 libyunjian_spike.so，判据②无法执行"
          unzip -l target/mobile/yunjian-spike.apk | grep 'lib/'
          exit 1
        }

      - echo "== androidTest APK 签名、instrumentation 与被测包 =="
      - |
        set -e
        APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
        AAPT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
        # 两个 APK 必须由**同一把**调试密钥签名，否则 `am instrument` 报
        # INSTALL_FAILED_UPDATE_INCOMPATIBLE 或 instrumentation 直接不被识别。
        "$APKSIGNER" verify --print-certs target/mobile/yunjian-spike.apk 2>&1 | grep -i 'SHA-256 digest' | head -2
        "$APKSIGNER" verify --print-certs target/mobile/yunjian-spike-androidtest.apk 2>&1 | grep -i 'SHA-256 digest' | head -2
        "$AAPT" dump badging target/mobile/yunjian-spike-androidtest.apk 2>/dev/null | grep -e package -e instrumentation
        # instrumentation 的 targetPackage 必须指向应用包，否则测试跑在自己的进程里，
        # `targetContext` 拿到的是测试包，判据③量到的 targetSdk 也就成了测试包的。
        "$AAPT" dump xmltree target/mobile/yunjian-spike-androidtest.apk AndroidManifest.xml 2>/dev/null | grep -A 4 instrumentation | head -20

      # 直接把产物送进 Device Farm，而**不**经过本地磁盘或 S3。
      # 理由是体积：APK 约 310 MiB，走「下载到开发机再上传」要搬两遍 620 MiB，
      # 而它在这台构建机上本来就已经躺在正确的位置。
      #
      # 刻意只做 create-upload，**不做 schedule-run**：调度会真的花掉设备分钟数，
      # 那一步留给人在看过上面签名与 ABI 输出之后手动发起。构建脚本不该自己决定花钱。
      # 对应的 IAM 也只给了 CreateUpload / GetUpload 两个动作。
      - echo "== 上传到 Device Farm（us-west-2；只上传，不调度）=="
      - |
        set -e
        PROJECT_ARN="arn:aws:devicefarm:us-west-2:891377171033:project:9b17cc74-307c-4fdb-b97c-90dc308a8a62"
        STAMP="$(date -u +%Y%m%dT%H%M%SZ)"

        upload() {
          NAME="$1"; TYPE="$2"; FILE="$3"
          JSON=$(aws devicefarm create-upload --project-arn "$PROJECT_ARN" \
            --name "$NAME" --type "$TYPE" --region us-west-2 --output json)
          ARN=$(printf '%s' "$JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["upload"]["arn"])')
          URL=$(printf '%s' "$JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["upload"]["url"])')
          # 预签名 URL 用 PUT，且**不能**带 Authorization 头，否则 S3 会拒签。
          curl -fsS -X PUT -T "$FILE" "$URL"
          # 上传完成不等于 Device Farm 处理完成：它要解包校验，状态经
          # INITIALIZED -> PROCESSING -> SUCCEEDED/FAILED。不轮询就可能拿一个还没就绪的 ARN 去调度。
          i=0
          while [ "$i" -lt 60 ]; do
            STATUS=$(aws devicefarm get-upload --arn "$ARN" --region us-west-2 \
              --query 'upload.status' --output text)
            case "$STATUS" in
              SUCCEEDED) echo "UPLOAD-READY $TYPE $ARN"; return 0 ;;
              FAILED) echo "UPLOAD-FAILED $TYPE"; aws devicefarm get-upload --arn "$ARN" --region us-west-2; return 1 ;;
            esac
            i=$((i + 1))
            sleep 5
          done
          echo "UPLOAD-TIMEOUT $TYPE $ARN"
          return 1
        }

        upload "yunjian-spike-$STAMP.apk" ANDROID_APP target/mobile/yunjian-spike.apk
        upload "spike-tests-$STAMP.zip" APPIUM_NODE_TEST_PACKAGE target/mobile/spike-tests.zip
        upload "spike-android-$STAMP.yml" APPIUM_NODE_TEST_SPEC .aws/devicefarm/spike-android.yml
        # androidTest APK 不单独上传：它已经在上面那个测试包 zip 里，宿主侧解包后
        # 用本地路径 `adb install` 即可。Device Farm 的 ANDROID_APP 槽位只有一个，
        # 而那个槽位必须留给被测应用。

artifacts:
  files:
    - target/mobile/yunjian-spike.apk
    - target/mobile/yunjian-spike-androidtest.apk
    - target/mobile/spike-tests.zip
  discard-paths: no

cache:
  paths:
    - "/root/.cargo/registry/**/*"
    - "/root/.android-sdk/**/*"
    - "target/**/*"
