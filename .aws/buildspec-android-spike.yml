# yunjian Android 冒烟产物构建 —— AWS CodeBuild
#
# 目的：产出 `xtask acceptance --platform android --set spike` 需要的两个产物
# （`target/mobile/yunjian-spike.apk` 与 `target/mobile/spike-tests.zip`），
# 因为本机既无 Android SDK 也无 NDK，且 `docs/PLATFORM-REQUIREMENTS.zh.md` 记录的
# `aarch64-linux-android` 目标缺 `ANDROID_NDK_HOME`。
#
# 区域：本项目 runner 在 us-east-2，而 Device Farm 只在 us-west-2。构建在 us-east-2
# 产出、上传到 us-west-2 的 Device Farm，跨区是刻意的，不是配置错误。
#
# ## 三个「未确认点」的实测答案（2026-08-15，`yunjian-runner` 上跑侦察构建所得）
#
# 1. **`aws/codebuild/standard:7.0` 完全不带 Android SDK。** `ANDROID_HOME`、
#    `ANDROID_SDK_ROOT`、`ANDROID_NDK_HOME` 三个变量全部未设置，且
#    `find / -maxdepth 6 -name sdkmanager` 一个都没找到。因此下面的自装分支不是
#    「兜底」而是**唯一路径**，原先那句「若镜像没带就自装」的条件判断永远走 else。
#    自装的 cmdline-tools 报 `sdkmanager --version` = `12.0`。
#
# 2. **磁盘远不是瓶颈。** 容器 overlay 300 GiB、装 SDK 前剩 129 GiB。
#    `ndk;26.3.11579264` 实测 **2.1 GiB**，整个 SDK（NDK + platforms;android-35 +
#    build-tools;35.0.0 + platform-tools + cmdline-tools）**2.5 GiB**，
#    四个组件一次 `sdkmanager --install` **22 秒**装完，装完仍剩 125 GiB。
#    原先担心的「约 2.5 GiB 能否落在配额内」答案是能，且富余两个数量级。
#
# 3. **`tauri android init` 不改 `crates/yunjian-mobile/Cargo.toml`。** 这一条最要紧，
#    因为 todo 69 的守卫 `undetermined_verdict_builds_neither_binding_branch`
#    **只读那一个文件**的 `[features]` 与 `[dependencies]` 两张表。init 生成的是
#    `crates/yunjian-app/gen/android/`（且该目录在 `.gitignore` 内），与守卫读的文件
#    没有交集。init 还会主动放弃改写 `crates/yunjian-app/Cargo.toml`——它打印
#    `` `tauri` dependency has workspace inheritance enabled. The features array
#    won't be automatically rewritten. Expected features: [] ``，即工作区继承挡住了
#    它的自动改写，而它期望的附加特性本来就是空集。本 buildspec 因此加了一道
#    **显式断言**（见 build 阶段），让「不冲突」这件事每次构建都被重新证明一次，
#    而不是靠这段注释被相信。
#
# 另外三条实测事实，直接写进下面的实现：
#
# - **tauri CLI 必须走 `cargo install`，不能用 npm 的 `@tauri-apps/cli`。** npm 那个包
#   装起来只要 1 秒（`tauri-cli 2.11.4`），单独跑 `android init` 也正常，但它会让生成的
#   Gradle 工程在 `:app:rustBuildArm64Debug` 阶段报 `Cannot find module '<crate>/tauri'`。
#   详见 install 阶段那条注释。**这是本文件唯一一处刻意选慢的地方。**
# - **Tauri 会用自己的 API 24 链接器覆盖我们导出的 android26。** 实测 CLI 向 Gradle
#   注入 `CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=.../aarch64-linux-android24-clang`，
#   把 pre_build 里那份 android26 导出顶掉。对**本冒烟目标无害**：不开 `voice` 时
#   依赖图里没有 cpal，用不到 AAudio。但 todo 70 打开 `voice` 后，API 24 的 sysroot
#   缺 AAudio 符号（todo 25 实测），届时必须把 minSdk 提到 26 让 Tauri 自己选对链接器，
#   而不是在这里导出变量——因为导出会被覆盖。
# - **NDK r26.3.11579264 就是 r26d**，其 `toolchains/llvm/prebuilt/linux-x86_64/bin`
#   里只有带 API 级别的 `aarch64-linux-android21..34-clang`，**没有**不带级别的
#   `aarch64-linux-android-clang`；归档工具只有 `llvm-ar` / `llvm-ranlib`，
#   **没有** `aarch64-linux-android-ar`。这正是 `voice-build.yml` 记录的那个坑。

version: 0.2

env:
  variables:
    ANDROID_NDK_VERSION: "26.3.11579264"
    ANDROID_PLATFORM: "android-35"
    ANDROID_BUILD_TOOLS: "35.0.0"
    RUST_TARGET: "aarch64-linux-android"
    CARGO_TERM_COLOR: "never"
    # cmdline-tools 的下载地址写死版本号：`_latest` 那个别名指向的内容会变，
    # 而构建要可复现。这个包实测报 `sdkmanager --version` = 12.0。
    CMDLINE_TOOLS_ZIP: "commandlinetools-linux-11076708_latest.zip"

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 20
    commands:
      - echo "== 记录实际工具链，而不是假定它存在 =="
      - java -version
      - node --version
      # 镜像不带 SDK 已是实测结论，所以这里不再做「若存在则复用」的分支：
      # 那条分支永远不执行，留着只会让读者以为它可能生效。
      - echo "== standard:7.0 不带 Android SDK（已实测），自装 cmdline-tools =="
      - export ANDROID_HOME="$HOME/android-sdk"
      - mkdir -p "$ANDROID_HOME/cmdline-tools"
      - curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
      - unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      - echo "export ANDROID_HOME=$ANDROID_HOME" > "$HOME/.yunjian-env"
      - echo "export ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$HOME/.yunjian-env"
      - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
      - sdkmanager --version
      - yes | sdkmanager --licenses >/dev/null 2>&1 || true
      # 四个组件一次装完实测 22 秒、2.5 GiB。`--verbose` 关掉进度条刷屏，
      # 否则日志里是几千个 `[====]` 帧，真正的报错会被埋掉。
      - >-
        sdkmanager --install
        "platforms;${ANDROID_PLATFORM}"
        "build-tools;${ANDROID_BUILD_TOOLS}"
        "platform-tools"
        "ndk;${ANDROID_NDK_VERSION}"
        > /tmp/sdkmanager.log 2>&1 || { echo "SDK 安装失败："; tail -40 /tmp/sdkmanager.log; exit 1; }
      - echo "export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$HOME/.yunjian-env"
      # NDK_HOME 与 ANDROID_NDK_HOME 都导出：tauri-cli 读前者，cargo-ndk 与多数
      # 第三方脚本读后者，两个名字在生态里都在用。
      - echo "export NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$HOME/.yunjian-env"
      - . "$HOME/.yunjian-env"
      - test -d "$ANDROID_NDK_HOME" || { echo "NDK 未落地，构建终止"; exit 1; }
      - du -sh "$ANDROID_HOME" "$ANDROID_NDK_HOME"

      - echo "== Rust 工具链；tauri android init 要跑 cargo metadata，没有 cargo 会直接失败 =="
      - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
      - . "$HOME/.cargo/env"
      - rustup target add "$RUST_TARGET"
      # 必须用 `cargo install tauri-cli`，**不能**用 npm 的 `@tauri-apps/cli`，尽管后者
      # 装起来只要 1 秒而这里要编译几分钟。理由是 `android init` 会把「当初怎么调用 CLI」
      # 这件事**烧进生成的 Gradle 工程**：`gen/android/buildSrc` 里的 `BuildTask.kt`
      # 之后要在 `:app:rustBuildArm64Debug` 里回调 CLI 去编 Rust。
      # 用 npm 全局 shim 初始化时，它记下的是一个相对工程目录的 node 脚本路径，
      # 于是 Gradle 阶段报 `Cannot find module '<crate 目录>/tauri'`（实测），
      # 而 Rust 那一步在此之前**已经成功**——失败点与真实原因隔着一个阶段，很难读。
      - echo "== tauri CLI：必须是 cargo 子命令形态，见上方注释 =="
      - cargo install tauri-cli --locked --version "^2"
      - cargo tauri --version

  pre_build:
    commands:
      - . "$HOME/.yunjian-env"
      - . "$HOME/.cargo/env"
      - export PATH="$ANDROID_HOME/platform-tools:$PATH"
      - echo "== 前置断言：缺一个就明确失败，不产出半成品 =="
      - test -n "$ANDROID_NDK_HOME" || { echo "ANDROID_NDK_HOME 未设置"; exit 1; }
      - adb version
      - cargo --version
      - npm ci --prefix app
      - npm run build --prefix app
      - test -f app/dist/index.html || { echo "前端产物缺失，generate_context! 会在编译期 panic"; exit 1; }

      # ---------------------------------------------------------------------
      # NDK 交叉编译环境。**照 voice-build.yml 已验证的那一版写，不凭记忆拼。**
      #
      # 只导出链接器曾经够用，因为图里没有需要**为目标**编译 C 的依赖。这个前提
      # 早已不成立：`reqwest`/`tauri-plugin-updater` 拉进 rustls -> ring（C 与汇编），
      # `yunjian-core` 拉进 libsqlite3-sys（C）。两者都走 cc-rs。
      #
      # 缺这几条变量时 cc-rs 找不到目标编译器：它先探
      # `aarch64-linux-android21-clang`（NDK bin 不在 PATH 上，探不到），再回落到
      # `aarch64-linux-android-clang`——而**统一工具链时代的 NDK 从未发过这个不带
      # API 级别的名字**（本仓库上面的侦察已逐字列出 bin 目录佐证），于是报
      # `ToolNotFound: failed to find tool "aarch64-linux-android-clang"`。
      # ar/ranlib 走同一套回落：先探 PATH 上的 `llvm-ar`，失败则回落到同样不存在的
      # `aarch64-linux-android-ar`。因此四个工具全部写成 NDK 内的绝对路径。
      #
      # 刻意**不**把 `$TC/bin` 加进 PATH：那会让 cc-rs 的自动探测命中 NDK 自带的
      # `aarch64-linux-android21-clang`，于是哪天这里的 CC 被删掉，C 代码会静默按
      # API 21 编译而不是报错。
      # ---------------------------------------------------------------------
      - |
        TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
        # 链接器与 CC 取自**同一个**变量，因此两者不可能落在不同 API 级别上——
        # C 代码与 Rust 代码针对不同 API 编译是这里最难查的一类故障。
        CLANG="$TC/bin/aarch64-linux-android26-clang"
        CLANGXX="${CLANG}++"
        AR="$TC/bin/llvm-ar"
        RANLIB="$TC/bin/llvm-ranlib"

        # 写死工具名是必需的（自动探测会回落到 NDK 从未发过的名字），但写死的名字
        # 会随 NDK 升版失效。不断言的话，下次失效仍然表现为那句无从下手的
        # `ToolNotFound`；断言之后它变成「这个文件没了」加一份目录清单。
        MISSING=0
        for TOOL in "$CLANG" "$CLANGXX" "$AR" "$RANLIB"; do
          if [ ! -x "$TOOL" ]; then
            echo "NDK 工具不存在或不可执行：$TOOL"
            MISSING=1
          fi
        done
        if [ "$MISSING" != 0 ]; then
          echo "$TC/bin 的实际内容："
          ls "$TC/bin"
          exit 1
        fi

        # API 26 不是随手选的：android24 的 sysroot 里没有 AAudio 符号（todo 25 实测），
        # 而 `capture` 走 cpal 的 Android 后端，那个后端就用 AAudio。
        case "$CLANG" in
          *android26-clang) echo "OK: API 26" ;;
          *) echo "CC/链接器不是 android26，cpal 的 AAudio 绑定会链接到缺符号的 sysroot"; exit 1 ;;
        esac

        {
          echo "export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
          echo "export CC_aarch64_linux_android=$CLANG"
          echo "export CXX_aarch64_linux_android=$CLANGXX"
          echo "export AR_aarch64_linux_android=$AR"
          echo "export RANLIB_aarch64_linux_android=$RANLIB"
          echo "export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$TC/sysroot"
        } >> "$HOME/.yunjian-env"
      - . "$HOME/.yunjian-env"
      - 'echo "CC_aarch64_linux_android=$CC_aarch64_linux_android"'

  build:
    commands:
      - . "$HOME/.yunjian-env"
      - . "$HOME/.cargo/env"
      - mkdir -p target/mobile

      - echo "== tauri android init：生成 gen/android 外壳 =="
      - (cd crates/yunjian-app && cargo tauri android init)

      # 这道断言是本文件对 todo 69 的交代：init 之后，binding 守卫读的那个文件
      # 必须逐字节未变，且守卫测试必须仍然通过。两者缺一都不算证明。
      - echo "== 断言 init 未触碰 todo 69 守卫读取的文件 =="
      - |
        if git diff --quiet -- crates/yunjian-mobile/Cargo.toml; then
          echo "OK: crates/yunjian-mobile/Cargo.toml 未被 init 改动"
        else
          echo "冲突：init 改了 binding 守卫读取的文件，必须停下"
          git diff -- crates/yunjian-mobile/Cargo.toml
          exit 1
        fi
      - echo "== 断言 binding 守卫测试仍然通过 =="
      - cargo test -p yunjian-mobile --test architecture 2>&1 | tail -20
      - echo "== 记录 init 的完整改动面，供报告引用 =="
      - git status --porcelain | head -40
      - git diff --stat | tail -20

      # 刻意**不**把输出接进 `| tail`：管道的退出码是 tail 的，构建失败会被吞成
      # 成功，只在下一步「找不到 APK」时才暴露，而那时真实报错已被截断。
      # 这与 `problems.md` 记的「退出码 0 不等于验收通过」是同一种形态。
      # `--debug` 而不是默认的 release：release 的 APK 由 Gradle 产出为
      # `*-unsigned.apk`，而 Android 拒绝安装未签名包，Device Farm 也不会代签
      # Android 产物（它只对 iOS 用通配 profile 重签名）。debug 走 Gradle 自带的
      # 调试签名配置，装得上、可 instrument，且 targetSdk 不变——判据三要的
      # `target_sdk == 35` 与构建类型无关。
      #
      # `--features custom-protocol` 必须显式给：`tauri-build` 把 `dev` 定义成
      # `!custom_protocol`，缺它时 WebView 去连 `devUrl`（localhost:5173），
      # 真机上没有 Vite，画出来的是 `Could not connect to localhost`。
      # 那正是 PR #100 更正的那个「近单色窗口」误判形态，在真机上会更难识别。
      - echo "== 冒烟目标只建单 ABI；产品分发的四个 ABI 归 todo 70 =="
      - (cd crates/yunjian-app && cargo tauri android build --target aarch64 --apk --debug --features custom-protocol)
      # 候选先全部列出再按体积最大者取：Gradle 的 outputs 目录里除最终 APK 外还可能
      # 留下中间产物，`find | head -1` 取到的是目录遍历顺序里的第一个，那不是一个
      # 可复现的选择。同时**显式拒绝 `-unsigned.apk`**，因为它装不上真机，
      # 而它一旦被当成产物送上 Device Farm，失败会表现为「安装超时」而不是「未签名」。
      - |
        echo "APK 候选清单："
        find crates/yunjian-app/gen/android -name '*.apk' -type f -printf '%s\t%p\n' | sort -rn
        APK=$(find crates/yunjian-app/gen/android -name '*.apk' -type f ! -name '*-unsigned.apk' -printf '%s\t%p\n' | sort -rn | head -1 | cut -f2)
        if [ -z "$APK" ]; then
          echo "未找到已签名的 APK 产物"
          find crates/yunjian-app/gen/android \( -name '*.apk' -o -name '*.aab' \) -type f
          exit 1
        fi
        echo "选定 $APK"
        cp "$APK" target/mobile/yunjian-spike.apk

      - echo "== 测试包：testspec 与设备端探针脚本 =="
      - test -f .aws/devicefarm/spike-android.yml || { echo "缺 testspec"; exit 1; }
      - (cd .aws/devicefarm && zip -qr "$CODEBUILD_SRC_DIR/target/mobile/spike-tests.zip" spike-probe.sh spike-measure.sh)

  post_build:
    commands:
      - echo "== 产物清单与体积，供 docs/reports/mobile-size.md 消费 =="
      - ls -la target/mobile/ || true
      - sha256sum target/mobile/* || true

artifacts:
  files:
    - target/mobile/yunjian-spike.apk
    - target/mobile/spike-tests.zip
  discard-paths: no

cache:
  paths:
    - "/root/.cargo/registry/**/*"
    - "/root/.android-sdk/**/*"
    - "target/**/*"
