# yunjian Android 冒烟产物构建 —— AWS CodeBuild
#
# 目的：产出 `xtask acceptance --platform android --set spike` 需要的两个产物
# （`target/mobile/yunjian-spike.apk` 与 `target/mobile/spike-tests.zip`），
# 因为本机既无 Android SDK 也无 NDK，且 `docs/PLATFORM-REQUIREMENTS.zh.md` 记录的
# `aarch64-linux-android` 目标缺 `ANDROID_NDK_HOME`。
#
# 状态：**未执行验证**。本文件描述的是链路，不是已通过的构建。首次运行前必须确认
# 三件事，任一不成立就会失败而不是静默产出错误产物：
#   1. `aws/codebuild/standard:7.0` 里 Android SDK 的实际版本与路径；
#   2. NDK r26+ 能否在 CodeBuild 的磁盘配额内下载解压（约 2.5 GiB）；
#   3. `crates/yunjian-app` 尚未 `tauri android init`，`gen/android` 不存在。
#      这一步会生成**产品外壳**目录，而 todo 69 的 binding 分支守卫要求 verdict 定了
#      才建外壳。因此本 buildspec 用 `--target aarch64` 只建冒烟目标，不动产品外壳。
#
# 区域：本项目 runner 在 us-east-2，而 Device Farm 只在 us-west-2。构建在 us-east-2
# 产出、上传到 us-west-2 的 Device Farm，跨区是刻意的，不是配置错误。

version: 0.2

env:
  variables:
    ANDROID_NDK_VERSION: "26.3.11579264"
    ANDROID_PLATFORM: "android-35"
    ANDROID_BUILD_TOOLS: "35.0.0"
    RUST_TARGET: "aarch64-linux-android"
    CARGO_TERM_COLOR: "never"

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 20
    commands:
      - echo "== 记录实际工具链，而不是假定它存在 =="
      - java -version
      - node --version
      - 'echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"'
      - 'ls -d "${ANDROID_HOME}" 2>/dev/null || echo "Android SDK 不在预期位置，下面自行安装"'
      - |
        if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        fi
        echo "export ANDROID_HOME=$ANDROID_HOME" >> "$HOME/.yunjian-env"
      - . "$HOME/.yunjian-env"
      - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
      - yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - >-
        sdkmanager --install
        "platforms;${ANDROID_PLATFORM}"
        "build-tools;${ANDROID_BUILD_TOOLS}"
        "platform-tools"
        "ndk;${ANDROID_NDK_VERSION}"
      - echo "export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$HOME/.yunjian-env"
      - . "$HOME/.yunjian-env"
      - test -d "$ANDROID_NDK_HOME" || { echo "NDK 未落地，构建终止"; exit 1; }
      - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
      - . "$HOME/.cargo/env"
      - rustup target add "$RUST_TARGET"
      - cargo install tauri-cli --locked --version "^2"

  pre_build:
    commands:
      - . "$HOME/.yunjian-env"
      - . "$HOME/.cargo/env"
      - export PATH="$ANDROID_HOME/platform-tools:$PATH"
      - echo "== 前置断言：缺一个就明确失败，不产出半成品 =="
      - test -n "$ANDROID_NDK_HOME" || { echo "ANDROID_NDK_HOME 未设置"; exit 1; }
      - adb version
      - cargo tauri --version
      - npm ci --prefix app

  build:
    commands:
      - . "$HOME/.yunjian-env"
      - . "$HOME/.cargo/env"
      - mkdir -p target/mobile
      - echo "== 冒烟目标只建单 ABI；产品分发的四个 ABI 归 todo 70 =="
      - cargo tauri android build --target aarch64 --apk
      - |
        APK=$(find crates/yunjian-app/gen/android -name '*.apk' -type f | head -1)
        test -n "$APK" || { echo "未找到 APK 产物"; exit 1; }
        cp "$APK" target/mobile/yunjian-spike.apk
      - echo "== 测试包：testspec 与设备端探针脚本 =="
      - test -f .aws/devicefarm/spike-android.yml || { echo "缺 testspec"; exit 1; }
      - (cd .aws/devicefarm && zip -qr "$CODEBUILD_SRC_DIR/target/mobile/spike-tests.zip" spike-probe.sh)

  post_build:
    commands:
      - echo "== 产物清单与体积，供 docs/reports/mobile-size.md 消费 =="
      - ls -la target/mobile/
      - sha256sum target/mobile/* || true

artifacts:
  files:
    - target/mobile/yunjian-spike.apk
    - target/mobile/spike-tests.zip
  discard-paths: no

cache:
  paths:
    - "/root/.cargo/registry/**/*"
    - "/root/.android-sdk/**/*"
    - "target/**/*"
