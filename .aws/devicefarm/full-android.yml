# Device Farm 自定义测试环境 —— 云笺 todo 71 真机验收。
#
# ## 与 `spike-android.yml` 的区别
#
# spike 那份跑的是三个**不依赖主界面**的类，用来决定 binding 分支。这一份跑的是
# `FullAcceptanceTest`，它必须拉起真界面：十条断言里有九条要看界面上显示了什么。
#
# 编排放在 `full-measure.sh` 里而不是摊在 `test:` 阶段：任一条非零退出会让 Device Farm
# 停在那里，后面的测量就永远拿不到，而我们要的是一次拿全——尤其是在某条断言失败时，
# 后续测量正是判断「产品坏了」还是「这一项没测到」所需要的。
#
# ## 为什么这次要启动主界面
#
# PR #102 那次刻意绕开主界面：Tauri 外壳一启动就 SIGABRT（`ndk-context` 未初始化时
# 是 `panic!` 而不是 `Err`）。UniFFI 外壳没有这个问题——`YunjianApplication.onCreate`
# 在任何 Rust 调用之前把 application context 交给 JNI，Rust 侧未初始化时也返回 `Err`。
# 那条缺陷因分支裁决自然消解，所以这一版可以、也必须拉起真界面。

version: 0.1
android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - echo "云笺真机验收：十条断言，测量值回传宿主侧判定"

  pre_test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - ls -la

  test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - sh full-measure.sh 2>&1 | tee $DEVICEFARM_LOG_DIR/full-acceptance.log

  post_test:
    commands:
      - echo "== 测量值已回传；PASS/FAIL 由 xtask 判定，不在设备侧下结论 =="
      - adb logcat -d > $DEVICEFARM_LOG_DIR/full-logcat.txt 2>&1 || true

artifacts:
  - $DEVICEFARM_LOG_DIR
