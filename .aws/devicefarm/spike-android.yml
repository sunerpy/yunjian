# Device Farm 自定义测试环境 —— Android 冒烟判据。
#
# `test:` 阶段的每一条都必须让设备回传**可判读的测量值**，不是「跑过了」。
#
# ## 这一版和上一版的区别
#
# PR #102 那一版刻意**不**调用 `am instrument`，理由是 `SpikeMicrophoneTest` /
# `SpikeCorpusTest` / `SpikeImeTest` 三个类**在仓库里不存在**，照那样调度只会得到一句
# 读起来像「设备有问题」的失败，掩盖真实原因「我们没写那三个测试」。
#
# 现在它们存在了：源码在 `mobile/android/spike/androidTest/`，由
# `.aws/buildspec-android-spike.yml` 组装成 `yunjian-spike-androidtest.apk` 并打进这个
# 测试包 zip。所以本版恢复 `am instrument`，但**编排全在 `spike-measure.sh` 里**，
# 而不是把三条 `am instrument` 摊在这个文件的 `test:` 阶段里——那样任一条非零退出会让
# Device Farm 停在那里，后面的判据就永远拿不到测量值，而我们要的是一次拿全。
#
# ## 已实测的能力边界（见 docs/reports/device-farm-spike.md）
#
#   - 麦克风硬件存在且未静音，但设备上没有 tinycap / arecord，且 **Device Farm 不提供
#     音频注入**，所以 PCM 必须由应用内 `AudioRecord` 采集，且非零 RMS 只能来自
#     机架环境噪声，喂不进已知语料。
#   - Gboard 有且只有一个中文 subtype `zh_CN`（147 个 subtype 里）。
#   - locale 覆盖生效：run configuration 的 zh_CN 落到 persist.sys.locale=zh-CN。

version: 0.1
android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - echo "yunjian Android 冒烟：先记录设备能力，再测判据"

  pre_test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - sh spike-probe.sh 2>&1 | tee $DEVICEFARM_LOG_DIR/device-capability.log

  test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      # 一个脚本跑完：装测试包、instrument 三个判据类、收集设备端写下的测量值。
      # 刻意不拆成多条命令，理由见文件头。
      - sh spike-measure.sh 2>&1 | tee $DEVICEFARM_LOG_DIR/criterion-measurements.log

  post_test:
    commands:
      - echo "== 收集测量值，交给 xtask 转成 verdict；不在设备侧下结论 =="
      - adb logcat -d > $DEVICEFARM_LOG_DIR/full-logcat.txt 2>&1 || true

artifacts:
  - $DEVICEFARM_LOG_DIR
