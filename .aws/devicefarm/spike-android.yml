# Device Farm 自定义测试环境 —— Android 冒烟判据。
#
# `test:` 阶段的每一条都必须让设备回传**可判读的测量值**，不是「跑过了」。
# 判据一（麦克风 16 kHz 单声道非静音 PCM）由 APK 内的 instrumented 测试测量并写入
# logcat，因为 Device Farm 的真机上**没有 tinycap / arecord**（已实测确认），
# 宿主侧的 adb 拿不到 PCM。
#
# 已实测的能力边界（见 docs/reports/device-farm-spike.md）：
#   - 麦克风硬件存在且未静音，但 **Device Farm 不提供音频注入**，
#     所以 rms > 0 只能来自机架环境噪声，不能喂已知语料。
#   - Gboard 有且只有一个中文 subtype `zh_CN`（147 个 subtype 里）。
#   - locale 覆盖生效：run configuration 的 zh_CN 落到 persist.sys.locale=zh-CN。

version: 0.1
android_test_host: amazon_linux_2

phases:
  install:
    commands:
      - echo "yunjian Android 冒烟：先记录设备能力，再跑判据"

  pre_test:
    commands:
      - cd $DEVICEFARM_TEST_PACKAGE_PATH
      - sh spike-probe.sh 2>&1 | tee $DEVICEFARM_LOG_DIR/device-capability.log
      - adb shell pm list packages | grep -q top.onethinker.yunjian || { echo "云笺未安装，判据无法执行"; exit 1; }

  test:
    commands:
      - echo "== 判据一 麦克风采集：读 APK instrumented 测试写入 logcat 的测量值 =="
      - adb logcat -c
      - adb shell am instrument -w -e class top.onethinker.yunjian.SpikeMicrophoneTest top.onethinker.yunjian.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee $DEVICEFARM_LOG_DIR/criterion-microphone.log
      - adb logcat -d -s YunjianSpike:I | tee -a $DEVICEFARM_LOG_DIR/criterion-microphone.log
      - echo "== 判据二 语料物化走生产下载路径 =="
      - adb shell am instrument -w -e class top.onethinker.yunjian.SpikeCorpusTest top.onethinker.yunjian.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee $DEVICEFARM_LOG_DIR/criterion-corpus.log
      - echo "== 判据三 中文 IME：启用并选中 Gboard 的 zh_CN subtype =="
      - adb shell ime enable com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME
      - adb shell ime set com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME
      - adb shell am instrument -w -e class top.onethinker.yunjian.SpikeImeTest top.onethinker.yunjian.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee $DEVICEFARM_LOG_DIR/criterion-ime.log

  post_test:
    commands:
      - echo "== 收集测量值，交给 xtask 转成 verdict；不在设备侧下结论 =="
      - adb logcat -d > $DEVICEFARM_LOG_DIR/full-logcat.txt 2>&1 || true

artifacts:
  - $DEVICEFARM_LOG_DIR
