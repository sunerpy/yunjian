# yunjian Android 侦察构建 —— 只回答问题，不产出产物
#
# 存在的理由：`.aws/buildspec-android-spike.yml` 头部列了三个「未确认点」，而确认它们
# 不需要一次 20–40 分钟的全量 Rust 交叉编译。本文件把那三个问题单独拿出来问一遍，
# 成本约 5–10 分钟，从而避免「为了知道 SDK 在哪，先烧掉一次全量构建」。
#
# 三个问题（逐条对应下面的 `== 问题 N ==` 段落）：
#   1. `aws/codebuild/standard:7.0` 里 Android SDK 的实际版本与路径是什么？
#   2. NDK r26 下载解压占多少磁盘，CodeBuild 的配额够不够？
#   3. `tauri android init` 到底改动哪些受版本控制的文件？
#      具体要回答的是：它会不会碰 `crates/yunjian-mobile/Cargo.toml`——那是 todo 69 的
#      binding 守卫 `a_repository_with_no_built_binding_declares_no_shell_dependency` 读取的唯一文件。
#
# 本文件**刻意用 `|| true` 兜住绝大多数步骤**：侦察的目的是一次拿到全部答案，
# 而不是在第一个缺失项上中止。判断「行不行」的依据是日志里打印的实测值，
# 不是这次构建的退出码。真正的断言留给 `buildspec-android-spike.yml`。

version: 0.2

env:
  variables:
    ANDROID_NDK_VERSION: "26.3.11579264"
    ANDROID_PLATFORM: "android-35"
    ANDROID_BUILD_TOOLS: "35.0.0"
    CARGO_TERM_COLOR: "never"

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 20
    commands:
      - echo "===== 问题 1 镜像自带的 Android 工具链 ====="
      - 'echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"'
      - 'echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"'
      - 'echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<unset>}"'
      - java -version 2>&1 || true
      - node --version || true
      - echo "-- 全盘搜 sdkmanager / ndk-build，不猜路径 --"
      - find / -maxdepth 6 -name sdkmanager -type f 2>/dev/null || true
      - find / -maxdepth 5 -type d -name 'android*sdk*' 2>/dev/null || true
      - find /usr/local /opt "$HOME" -maxdepth 4 -type d -name ndk 2>/dev/null || true
      - echo "-- 若 SDK 存在，列出已装组件 --"
      - 'if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}" ]; then ls -la "$ANDROID_HOME"; ls -la "$ANDROID_HOME/platforms" 2>/dev/null; ls -la "$ANDROID_HOME/build-tools" 2>/dev/null; ls -la "$ANDROID_HOME/ndk" 2>/dev/null; else echo "ANDROID_HOME 不存在或未设置"; fi'

      - echo "===== 问题 2 磁盘基线（NDK 之前）====="
      - df -h
      - "df -h . | tail -1"

  pre_build:
    commands:
      - echo "===== 安装 cmdline-tools（若镜像没带）====="
      - |
        set -x
        if [ -z "${ANDROID_HOME:-}" ] || [ ! -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        fi
        echo "export ANDROID_HOME=$ANDROID_HOME" > "$HOME/.yunjian-env"
        set +x
      - . "$HOME/.yunjian-env"
      - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
      - sdkmanager --version || true
      - echo "-- 已装组件（--list_installed）--"
      - sdkmanager --list_installed 2>&1 | head -40 || true
      - yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - echo "===== 问题 2 装 NDK 并量它的体积 ====="
      - date -u +%FT%TZ
      - >-
        sdkmanager --install
        "platforms;${ANDROID_PLATFORM}"
        "build-tools;${ANDROID_BUILD_TOOLS}"
        "platform-tools"
        "ndk;${ANDROID_NDK_VERSION}"
        2>&1 | tail -20 || true
      - date -u +%FT%TZ
      - 'du -sh "$ANDROID_HOME" 2>/dev/null || true'
      - 'du -sh "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" 2>/dev/null || echo "NDK 目录不存在"'
      - 'du -sh "$ANDROID_HOME"/* 2>/dev/null || true'
      - echo "-- NDK 之后的磁盘 --"
      - df -h
      - echo "-- 断言 clang 的确切文件名（不凭记忆）--"
      - 'TC="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64"; ls "$TC/bin" 2>/dev/null | grep -e aarch64 -e llvm-ar -e llvm-ranlib || echo "工具链 bin 不存在：$TC/bin"'

  build:
    commands:
      - echo "===== 问题 3 tauri android init 的改动面 ====="
      - . "$HOME/.yunjian-env"
      - export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
      - export NDK_HOME="$ANDROID_NDK_HOME"
      - echo "-- init 之前的工作区状态（应当干净）--"
      - git status --porcelain || true
      - git rev-parse HEAD || true
      - echo "-- 用 npm 装 tauri CLI 预编译包，比 cargo install 快一个量级 --"
      - date -u +%FT%TZ
      - npm i -g @tauri-apps/cli@^2 2>&1 | tail -5 || true
      - date -u +%FT%TZ
      - tauri --version || true
      - echo "-- 前端产物：generate_context! 的编译期前置，同时量它的耗时 --"
      - date -u +%FT%TZ
      - (cd app && npm ci 2>&1 | tail -5) || true
      - (cd app && npm run build 2>&1 | tail -10) || true
      - date -u +%FT%TZ
      - 'ls -la app/dist 2>/dev/null | head -5 || echo "app/dist 不存在"'
      - echo "-- 真正的问题：init 改了什么 --"
      - (cd crates/yunjian-app && tauri android init 2>&1 | tail -40) || true
      - echo "-- 受版本控制文件的改动清单（这是问题 3 的答案）--"
      - git status --porcelain
      - echo "-- 已跟踪文件的 diff --stat --"
      - git diff --stat
      - echo "-- todo 69 守卫读的那个文件是否被改动 --"
      - 'git diff --stat -- crates/yunjian-mobile/Cargo.toml; if git diff --quiet -- crates/yunjian-mobile/Cargo.toml; then echo "GUARD-FILE-UNTOUCHED: crates/yunjian-mobile/Cargo.toml 未被改动"; else echo "GUARD-FILE-MODIFIED: 冲突，必须停下"; fi'
      - 'if git diff --quiet -- crates/yunjian-app/Cargo.toml; then echo "APP-MANIFEST-UNTOUCHED"; else echo "APP-MANIFEST-MODIFIED:"; git diff -- crates/yunjian-app/Cargo.toml; fi'
      - echo "-- gen/android 生成了什么 --"
      - find crates/yunjian-app/gen -maxdepth 3 2>/dev/null | head -60 || echo "gen 不存在"
      - echo "-- 守卫测试在 init 之后是否仍然通过（不装 Rust 就跑不了，故只记录意图）--"
      - 'echo "guard test 需要 cargo；本侦察不装 Rust 工具链，交给 spike buildspec 断言"'

  post_build:
    commands:
      - echo "===== 侦察结束：以上打印值就是三个问题的答案 ====="
      - df -h
