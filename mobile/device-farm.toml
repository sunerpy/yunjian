# AWS Device Farm 远端真机驱动配置
#
# Device Farm **只在 us-west-2** 提供服务，而本仓库的 CodeBuild runner 在 us-east-2。
# 这不是可调的偏好，是服务的可用区域，所以 `region` 由 `xtask` 校验为固定值。
#
# 下面两个平台的 `device_pool_arn` 都是**已在账号 891377171033 中真实创建并实测可达**的
# 静态设备池。Android 池锁定 Google Pixel 8 / Android 15（SDK 35），正是判据三要求的
# `targetSdk 35` 目标面。
#
# `enabled = false` 的平台表示远端链路尚未打通，`blocked_reason` 说明差什么。
# 产物不存在时验收报告仍写 NOT EXECUTED——池里有真机不等于真机上装过云笺。

schema_version = 1
region = "us-west-2"
project_arn = "arn:aws:devicefarm:us-west-2:891377171033:project:9b17cc74-307c-4fdb-b97c-90dc308a8a62"
billing_method = "METERED"
locale = "zh_CN"
# 首启物化在 Pixel 8 上实测 868~873 秒（212 MiB 下载 + 4.44 GiB 解压），之后还有九条
# 断言。30 分钟会在 t02 之后被截断——真机实测第五轮正是如此。这里给 150（账号上限）。
job_timeout_minutes = 150

[android]
enabled = true
device_pool_arn = "arn:aws:devicefarm:us-west-2:891377171033:devicepool:9b17cc74-307c-4fdb-b97c-90dc308a8a62/7c385981-1356-4e2f-a3c6-ff2a406c4ea9"
app_artifact = "target/mobile/yunjian-spike.apk"
app_upload_type = "ANDROID_APP"
test_package_artifact = "target/mobile/spike-tests.zip"
test_package_upload_type = "APPIUM_NODE_TEST_PACKAGE"
test_spec = ".aws/devicefarm/spike-android.yml"
test_type = "APPIUM_NODE"
build_command = "aws codebuild start-build --project-name yunjian-android-spike --region us-east-2"
blocked_reason = ""

# todo 71 真机验收（`xtask acceptance --set full`）的产物与 testspec。
#
# 与 `[android]` / `[ios]` **刻意分开**：spike 跑的是三个不依赖主界面的类，用来决定
# binding 分支；full 跑的是 `FullAcceptanceTest`，它必须拉起真界面。两者的 APK、
# 测试包与 testspec 都不同。共用一个段会让「跑 full 却上传了 spike 的 APK」成为一次
# 静默的错误——run 会 PASSED，而十条测量值一条也不会回来（PR #102 的教训形态）。
[android_full]
enabled = true
device_pool_arn = "arn:aws:devicefarm:us-west-2:891377171033:devicepool:9b17cc74-307c-4fdb-b97c-90dc308a8a62/7c385981-1356-4e2f-a3c6-ff2a406c4ea9"
app_artifact = "target/mobile/yunjian.apk"
app_upload_type = "ANDROID_APP"
test_package_artifact = "target/mobile/full-tests.zip"
test_package_upload_type = "APPIUM_NODE_TEST_PACKAGE"
test_spec = ".aws/devicefarm/full-android.yml"
test_type = "APPIUM_NODE"
# **逐条实测过的打包序列**（2026-08-17，run full-acceptance-29）。此前这里写的是
# `cargo run -p xtask -- mobile-package`，而 `xtask` 的 `Commands` 枚举里从来没有这个子命令
# ——那让 Android 真机验收无法从干净检出复现，而配置本身看起来是完整的。
# 测试包 zip 里必须同时有两个 APK 与 `full-measure.sh`：Device Farm 对**公共**设备一律重签，
# 设备侧脚本要卸掉重签的那份、改装 zip 里我们自己签的两个。
build_command = "cd mobile/android && gradle :app:assembleDebug :app:assembleDebugAndroidTest && mkdir -p ../../target/mobile && cp app/build/outputs/apk/debug/app-debug.apk ../../target/mobile/yunjian.apk && cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../../target/mobile/yunjian-androidTest.apk && cp ../../.aws/devicefarm/full-measure.sh ../../target/mobile/ && cd ../../target/mobile && rm -f full-tests.zip && zip -q full-tests.zip yunjian.apk yunjian-androidTest.apk full-measure.sh"
blocked_reason = ""

[ios_full]
enabled = false
device_pool_arn = "arn:aws:devicefarm:us-west-2:891377171033:devicepool:9b17cc74-307c-4fdb-b97c-90dc308a8a62/7c385981-1356-4e2f-a3c6-ff2a406c4ea9"
app_artifact = "target/mobile/yunjian.ipa"
app_upload_type = "IOS_APP"
test_package_artifact = "target/mobile/full-xcuitest.zip"
test_package_upload_type = "XCTEST_UI_TEST_PACKAGE"
test_spec = ".aws/devicefarm/full-ios.yml"
test_type = "XCTEST_UI"
build_command = "cd mobile/ios && xcodegen generate && xcodebuild build-for-testing -scheme Yunjian -destination 'generic/platform=iOS'"
blocked_reason = "构建 .ipa 与 XCUITest bundle 需要 macOS 与 Xcode 26；本机是 Linux，且 Device Farm 的 macOS 构建环境不在本项目已开通的资源内。SwiftUI 产品工程（mobile/ios/Yunjian/）、两个测试 target 与 UniFFI 的 Swift 生成物都已在仓库里，且结构由 `cargo test -p xtask ios_project` 守着；但那些 Swift **从未经过 Swift 编译器**（见 mobile/ios/README.md 的未验证清单），缺的是 macOS 宿主与一次真实编译"

[ios]
enabled = false
device_pool_arn = "arn:aws:devicefarm:us-west-2:891377171033:devicepool:9b17cc74-307c-4fdb-b97c-90dc308a8a62/7c385981-1356-4e2f-a3c6-ff2a406c4ea9"
app_artifact = "target/mobile/yunjian-spike.ipa"
app_upload_type = "IOS_APP"
test_package_artifact = "target/mobile/spike-xcuitest.zip"
test_package_upload_type = "XCTEST_UI_TEST_PACKAGE"
test_spec = ".aws/devicefarm/spike-ios.yml"
test_type = "XCTEST_UI"
build_command = "aws codebuild start-build --project-name yunjian-ios-spike --region us-west-2"
blocked_reason = "Device Farm 会用通配 provisioning profile 重签名，因此不必注册设备 UDID；但产出 .ipa 仍需 macOS 与 Xcode，需先建 MAC_ARM CodeBuild fleet 并验证 tauri#15066 对 iOS 26 SDK 的链接失败是否已解除"
