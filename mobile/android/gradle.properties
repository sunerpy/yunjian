# 云笺 Android 产品工程的构建属性。
#
# `jvmargs` 给到 4 GiB：Compose 编译器 + AGP 资源处理在默认 512 MiB 下会在
# `mergeDebugResources` 阶段 OOM，而那条报错读起来像资源冲突而不是内存不足。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# **刻意关掉**。构建期不去联网找缺失的 SDK 平台：spike 那次 AGP 自动下载了
# android-36，于是 `targetSdk` 悄悄从 35 漂到 36，判据③测的语义随之变了。
# 缺平台就应该失败并指名缺哪一个，而不是自己补上一个别的。
android.builder.sdkDownload=false
