[package]
name = "xtask"
description = "云笺仓库任务运行器：语料构建、模型校验与发布辅助"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
# `provider-calls` 要实现 `AppreciationProvider`，那是一个 `#[async_trait]` trait。
async-trait = { workspace = true }
clap = { workspace = true }
# `corpus-measure` 量 gzip 后的工件体积。必须与 todo 21 打包用的是同一个实现，
# 否则量出来的数不是将来真正发出去的那个数。
flate2 = { workspace = true }
# `index-spike` 直接用应用侧同一个 bundled SQLite 建索引并测延迟：写入者与读取者
# 必须是同一个 SQLite，否则实测出来的 detail 模式行为对产物不成立。
rusqlite = { workspace = true }
serde = { workspace = true }
# `index-spike` 的裁决文件是 JSON（todo 19 / 24 读它）。
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
# `commentary-index` 复用 `yunjian-corpus::commentary` 的校验与索引渲染，
# 绝不在 xtask 里另写一套判据——出处规则只能有一个实现。
tracing = { workspace = true }
ureq = { workspace = true }
# `verify-icons` 解码 PNG（含 ICO 内嵌层）并写出六档联系表。**只加 `png`，不加
# `image`**：`png` 已在依赖树里（`tauri-codegen` 经由它读图标），而 `image` 会新拖一整棵
# 编解码器树。ICO 的目录结构由本模块手工解析——要断言的是**层序**，而图像库的
# `sizes()` 之类接口返回集合，顺序信息在那里就丢了，断言便永远变不了红。
png = { workspace = true }
zip = { workspace = true }
yunjian-core = { path = "../crates/yunjian-core" }
yunjian-corpus = { path = "../crates/yunjian-corpus" }
# `pregenerate` 复用 `yunjian-ai::pregenerate` 的开放权重门禁与溯源结构，绝不在 xtask
# 里另写一套判据——「这条内容我们凭什么可以发」只能有一个实现。事实块也必须由
# `AppreciationRequest` 渲染，否则算出的 grounding_digest 与运行期查随包表时的对不上。
yunjian-ai = { path = "../crates/yunjian-ai" }
# `pregenerate` 真的调模型时要驱动 `AppreciationProvider` 的 future。xtask 本身是
# 同步程序，故只建一个当前线程运行时。
tokio = { workspace = true }
# `cer-spike` 的参考文本取自繁体上游，识别结果也常是繁体：两侧都要做 t2s 归一，
# 否则字形差异会被当成识别错误算进 CER。用的是语料侧同一个实现，判据只能有一个。
ferrous-opencc = { workspace = true }
# `cer-spike` 的实测路径。默认不开：`voice` 会拉入静态含 GPL-3.0 espeak-ng 的
# 预编译原生产物，默认构建必须保持纯 MIT 且不链接 onnxruntime。
yunjian-voice = { path = "../crates/yunjian-voice" }
# `acceptance` 合成真实输入并观测真实窗口。这两条是真机验收的执行手段，不是便利设施：
# 「点下去之后窗口真的最大化了」只能由窗口管理器维护的 `_NET_WM_STATE` 回答。
enigo = { workspace = true }
x11rb = { workspace = true }
# `acceptance` 的托盘宿主。见工作区 `Cargo.toml` 里那一段：托盘断言缺的是总线上的一个
# 宿主名字，不是显示硬件。
zbus = { workspace = true }
# `acceptance` 的首启物化那条会话要定位本机那份待物化的 `.db.gz`。用与应用**同一个**
# 目录解析实现，否则 harness 找的那个位置可能不是应用会读的那个。
dirs = { workspace = true }

[features]
default = []
# 开启后 `cer-spike` 才真的合成与识别；不开则如实写 NOT MEASURED。
voice = ["yunjian-voice/voice"]

[lints]
workspace = true
