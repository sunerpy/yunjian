[package]
name = "xtask"
description = "云笺仓库任务运行器：语料构建、模型校验与发布辅助"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# `corpus-measure` 量 gzip 后的工件体积。必须与 todo 21 打包用的是同一个实现，
# 否则量出来的数不是将来真正发出去的那个数。
flate2 = { workspace = true }
# `index-spike` 直接用应用侧同一个 bundled SQLite 建索引并测延迟：写入者与读取者
# 必须是同一个 SQLite，否则实测出来的 detail 模式行为对产物不成立。
rusqlite = { workspace = true }
serde = { workspace = true }
# `index-spike` 的裁决文件是 JSON（todo 19 / 24 读它）。
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
# `commentary-index` 复用 `yunjian-corpus::commentary` 的校验与索引渲染，
# 绝不在 xtask 里另写一套判据——出处规则只能有一个实现。
tracing = { workspace = true }
ureq = { workspace = true }
yunjian-core = { path = "../crates/yunjian-core" }
yunjian-corpus = { path = "../crates/yunjian-corpus" }
# `cer-spike` 的参考文本取自繁体上游，识别结果也常是繁体：两侧都要做 t2s 归一，
# 否则字形差异会被当成识别错误算进 CER。用的是语料侧同一个实现，判据只能有一个。
ferrous-opencc = { workspace = true }
# `cer-spike` 的实测路径。默认不开：`voice` 会拉入静态含 GPL-3.0 espeak-ng 的
# 预编译原生产物，默认构建必须保持纯 MIT 且不链接 onnxruntime。
yunjian-voice = { path = "../crates/yunjian-voice" }

[features]
default = []
# 开启后 `cer-spike` 才真的合成与识别；不开则如实写 NOT MEASURED。
voice = ["yunjian-voice/voice"]

[lints]
workspace = true
